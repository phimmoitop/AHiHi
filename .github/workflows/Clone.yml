name: Clone Voice Profile - VieNeu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Install FFmpeg
      # ============================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1

      # ============================================================
      # 4. Install VieNeu
      #
      # Pin version so the profile is reproducible.
      # ============================================================
      - name: Install VieNeu
        run: |
          python -m pip install --upgrade pip

          pip install \
            torch --index-url https://download.pytorch.org/whl/cpu

          pip install \
            "vieneu==2.7.0" \
            numpy \
            soundfile \
            pydub \
            onnxruntime \
            "huggingface_hub[cli]"

      # ============================================================
      # 5. Verify source audio
      # ============================================================
      - name: Verify audio1.mp3
        run: |
          if [ ! -f "audio1.mp3" ]; then
            echo "::error::Không tìm thấy audio1.mp3 ở thư mục gốc repository."
            echo "Hãy kiểm tra file phải nằm tại:"
            echo "audio1.mp3"
            exit 1
          fi

          echo "======================================"
          echo "SOURCE AUDIO"
          echo "======================================"

          ls -lh audio1.mp3

          echo ""
          echo "FFmpeg audio information:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            audio1.mp3

      # ============================================================
      # 6. Create voice_profile directory
      # ============================================================
      - name: Create voice profile directory
        run: |
          rm -rf voice_profile
          mkdir -p voice_profile

      # ============================================================
      # 7. Prepare reference audio
      #
      # audio1.mp3 is already the exact 8-second reference.
      #
      # We convert it to clean mono WAV.
      #
      # We DO NOT trim it again.
      # ============================================================
      - name: Prepare reference audio
        run: |
          echo "Preparing reference audio..."

          ffmpeg \
            -y \
            -i "audio1.mp3" \
            -vn \
            -ac 1 \
            -c:a pcm_s16le \
            "voice_profile/reference.wav"

          echo ""
          echo "Reference audio:"
          ls -lh voice_profile/reference.wav

          echo ""
          echo "Reference information:"
          ffprobe \
            -v error \
            -show_entries \
            stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            voice_profile/reference.wav

      # ============================================================
      # 8. Save exact reference transcript
      # ============================================================
      - name: Save reference transcript
        run: |
          printf '%s\n' "Ngươi có tha cho Thiên Lam Tông của chúng ta không, sẽ không đuổi cùng giết tận để khử Thiên Lam Tông chúng ta sao" > voice_profile/reference.txt

          echo "Reference transcript:"
          cat voice_profile/reference.txt

      # ============================================================
      # 9. Encode reference voice
      #
      # VieNeu converts reference audio into speech/voice codes.
      # This is the actual voice enrollment step.
      # ============================================================
      - name: Encode voice profile
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import datetime
          from pathlib import Path

          import numpy as np

          from vieneu import Vieneu

          reference_audio = "voice_profile/reference.wav"
          reference_text = Path(
              "voice_profile/reference.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("======================================")
          print("Initializing VieNeu")
          print("======================================")

          tts = Vieneu()

          print("")
          print("Encoding reference voice...")
          print(f"Audio: {reference_audio}")
          print(f"Text:  {reference_text}")

          ref_codes = tts.encode_reference(
              reference_audio
          )

          # Convert Torch Tensor -> NumPy if necessary.
          if hasattr(ref_codes, "detach"):
              ref_codes = (
                  ref_codes
                  .detach()
                  .cpu()
                  .numpy()
              )
          else:
              ref_codes = np.asarray(ref_codes)

          if ref_codes.size == 0:
              raise RuntimeError(
                  "VieNeu returned an empty voice profile."
              )

          # Make sure the codes are integer speech tokens.
          if not np.issubdtype(
              ref_codes.dtype,
              np.integer
          ):
              ref_codes = ref_codes.astype(
                  np.int64
              )

          output_codes = (
              "voice_profile/voice_codes.npy"
          )

          np.save(
              output_codes,
              ref_codes
          )

          print("")
          print("======================================")
          print("VOICE PROFILE CREATED")
          print("======================================")
          print(f"Shape: {ref_codes.shape}")
          print(f"Dtype: {ref_codes.dtype}")
          print(f"Saved: {output_codes}")

          # --------------------------------------------------------
          # Metadata
          # --------------------------------------------------------

          profile = {
              "voice_name": "my_voice",

              "model": {
                  "package": "vieneu",
                  "version": "2.7.0"
              },

              "method": "zero-shot voice cloning",

              "source_audio": "audio1.mp3",

              "reference_audio": (
                  "voice_profile/reference.wav"
              ),

              "reference_text": reference_text,

              "voice_codes": (
                  "voice_profile/voice_codes.npy"
              ),

              "codes_shape": list(
                  ref_codes.shape
              ),

              "codes_dtype": str(
                  ref_codes.dtype
              ),

              "created_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),

              "note": (
                  "Voice profile created from "
                  "an 8-second Vietnamese reference. "
                  "This is a zero-shot voice cloning "
                  "profile, not a fine-tuned model."
              )
          }

          with open(
              "voice_profile/profile.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  profile,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("profile.json created.")
          PY

      # ============================================================
      # 10. Test the cloned voice
      #
      # IMPORTANT:
      # Use ref_codes + ref_text.
      #
      # Test WAV files are written directly into the repository
      # root (not into voice_profile/tests) so you can listen to
      # them straight from the repo and delete manually afterwards.
      # ============================================================
      - name: Test cloned voice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path

          import numpy as np

          from vieneu import Vieneu

          print("======================================")
          print("Loading voice profile")
          print("======================================")

          reference_text = Path(
              "voice_profile/reference.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          ref_codes = np.load(
              "voice_profile/voice_codes.npy"
          )

          print(
              f"Voice codes shape: {ref_codes.shape}"
          )

          tts = Vieneu()

          # --------------------------------------------------------
          # Test sentences
          #
          # Different sentences are used so you can evaluate
          # whether the cloned speaker identity is consistent.
          # --------------------------------------------------------

          test_sentences = [
              "Xin chào, đây là bài kiểm tra giọng nói của tôi.",

              "Hôm nay chúng ta sẽ cùng tìm hiểu một chủ đề rất thú vị.",

              "Bạn có thể nghe thử xem giọng nói này có tự nhiên hay không.",

              "Đây là giọng nói được tạo ra từ voice profile đã lưu.",

              "Cảm ơn bạn đã lắng nghe và hẹn gặp lại trong những nội dung tiếp theo."
          ]

          # Repo root, not voice_profile/tests
          output_dir = Path(".")

          for index, text in enumerate(
              test_sentences,
              start=1
          ):

              print("")
              print(
                  f"[{index}/{len(test_sentences)}] "
                  f"Generating:"
              )
              print(text)

              audio = tts.infer(
                  text=text,
                  ref_codes=ref_codes,
                  ref_text=reference_text,
                  apply_watermark=True
              )

              output_file = (
                  output_dir /
                  f"test_{index}.wav"
              )

              tts.save(
                  audio,
                  output_file
              )

              print(
                  f"Saved: {output_file}"
              )

          print("")
          print("======================================")
          print("ALL TESTS COMPLETED")
          print("======================================")
          PY

      # ============================================================
      # 11. Create a README for the profile
      # ============================================================
      - name: Create profile README
        run: |
          cat > voice_profile/README.md <<'EOF'
          # VieNeu Voice Profile

          This directory contains a zero-shot VieNeu voice profile.

          ## Files

          - `reference.wav` - cleaned reference audio
          - `reference.txt` - exact transcript of reference audio
          - `voice_codes.npy` - encoded VieNeu voice codes
          - `profile.json` - profile metadata

          Test samples (`test_*.wav`) are generated in the repository
          root on each run and are not tracked long-term here.

          ## Model

          VieNeu TTS 2.7.0

          ## Usage

          Load `voice_codes.npy` and use it with:

          ```python
          audio = tts.infer(
              text="Nội dung cần đọc",
              ref_codes=ref_codes,
              ref_text=reference_text,
          )
          ```
          EOF

          echo "README created:"
          cat voice_profile/README.md

      # ============================================================
      # 12. Upload test audio as GitHub Artifact
      #
      # Kept as an extra download option in Actions, in addition to
      # the WAV files committed straight to the repo root.
      # ============================================================
      - name: Upload test samples
        uses: actions/upload-artifact@v4
        with:
          name: my-voice-vieneu-test
          path: |
            voice_profile/reference.wav
            voice_profile/reference.txt
            voice_profile/profile.json
            voice_profile/voice_codes.npy
            voice_profile/README.md
            test_*.wav
          retention-days: 30

      # ============================================================
      # 13. Commit persistent voice profile + test samples
      #
      # We keep:
      # - reference.wav
      # - reference.txt
      # - voice_codes.npy
      # - profile.json
      # - README.md
      #
      # We ALSO commit the test_*.wav files at the repo root, so
      # you can listen to them directly and delete manually later.
      # ============================================================
      - name: Commit voice profile to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add voice_profile/
          git add test_*.wav

          if git diff --cached --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "Create VieNeu voice profile + test samples"
            git push
          fi

      # ============================================================
      # 14. Final summary
      # ============================================================
      - name: Final summary
        run: |
          echo ""
          echo "=============================================="
          echo "VOICE CLONING COMPLETED"
          echo "=============================================="
          echo ""
          echo "Profile:"
          echo "  voice_profile/voice_codes.npy"
          echo ""
          echo "Reference:"
          echo "  voice_profile/reference.wav"
          echo ""
          echo "Transcript:"
          echo "  voice_profile/reference.txt"
          echo ""
          echo "Metadata:"
          echo "  voice_profile/profile.json"
          echo ""
          echo "Test samples (repo root):"
          echo "  test_1.wav ... test_5.wav"
          echo ""
          echo "The profile and test samples have been committed to the repository."
          echo "=============================================="
