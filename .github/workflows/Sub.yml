name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:

      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_seconds:
        description: "Interval tìm subtitle ban đầu (giây)"
        required: false
        default: "1"
        type: string

      ocr_fps:
        description: "FPS OCR, 1-2 là phù hợp"
        required: false
        default: "2"
        type: string

jobs:

  process:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      HF_HOME: "${{ github.workspace }}/work/huggingface"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # PYTHON 3.11
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================================
      # SYSTEM
      # ==========================================================

      - name: Install system packages
        run: |

          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-core \
            fonts-dejavu \
            libgl1 \
            libglib2.0-0

          echo ""
          echo "=========================================="
          echo "AVAILABLE FONTS"
          echo "=========================================="

          fc-list | grep -Ei \
            "Oward|Noto Sans CJK|DejaVu Sans" \
            | head -30 || true


      # ==========================================================
      # PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |

          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            yt-dlp \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            pillow \
            tqdm \
            pysubs2 \
            sentencepiece \
            safetensors \
            torch==2.4.1 \
            transformers==4.47.1

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install \
            paddleocr==3.3.2


      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare directories
        run: |

          set -eux

          mkdir -p work
          mkdir -p output

          echo "Workspace:"
          pwd

          echo ""
          echo "Repository:"
          ls -la


      # ==========================================================
      # PREPARE BILIBILI COOKIE
      # ==========================================================

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}

        run: |

          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then

            echo "::error::"
            echo "::error::GitHub Secret BILIBILI_COOKIES chưa được cấu hình."
            echo "::error::"

            exit 1

          fi

          printf '%s\n' \
            "$BILIBILI_COOKIES" \
            > work/cookies.txt

          chmod 600 work/cookies.txt

          echo "Cookie file created."

          echo "Cookie line count:"
          wc -l work/cookies.txt


      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "BILIBILI DOWNLOAD"
          echo "=========================================="

          echo ""
          echo "URL:"
          echo "$BILIBILI_URL"

          echo ""
          echo "yt-dlp:"
          yt-dlp --version

          echo ""
          echo "Downloading H.264 when available..."

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          echo ""
          echo "=========================================="
          echo "DOWNLOADED"
          echo "=========================================="

          ls -lh work/


      # ==========================================================
      # CHECK VIDEO
      # ==========================================================

      - name: Inspect video
        run: |

          set -e

          VIDEO="work/source.mp4"

          if [ ! -f "$VIDEO" ]; then

            echo "source.mp4 not found."

            echo "Available files:"
            find work -maxdepth 1 -type f -printf '%p\n'

            exit 1

          fi

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -hide_banner \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"


      # ==========================================================
      # CREATE PROCESSOR
      # ==========================================================

      - name: Create processing script
        run: |

          cat > process.py <<'PY'

          import os
          import re
          import json
          import subprocess
          from pathlib import Path

          import cv2
          import numpy as np
          import pysubs2

          from tqdm import tqdm

          from paddleocr import PaddleOCR

          from transformers import (
              AutoTokenizer,
              AutoModelForSeq2SeqLM
          )


          # ============================================================
          # CONFIG
          # ============================================================

          WORK = Path("work")
          OUTPUT = Path("output")

          VIDEO = WORK / "source.mp4"

          MODEL_NAME = "Helsinki-NLP/opus-mt-zh-vi"

          SCAN_SECONDS = float(
              os.environ.get(
                  "SCAN_SECONDS",
                  "1"
              )
          )

          OCR_FPS = float(
              os.environ.get(
                  "OCR_FPS",
                  "2"
              )
          )

          # ============================================================
          # SUBTITLE STYLE
          # ============================================================

          # Font mặc định.
          #
          # Nếu Oward được cài trong runner thì dùng Oward.
          # Nếu không có -> Noto Sans CJK SC.
          #
          FONT_SIZE = 25

          # Khoảng cách giữa các ký tự.
          #
          # Giá trị âm = chữ sát nhau hơn.
          #
          LETTER_SPACING = -1

          # Viền chữ.
          OUTLINE_SIZE = 2

          # Shadow.
          SHADOW_SIZE = 0

          # Khoảng cách subtitle với đáy video.
          #
          # Đây KHÔNG phải vị trí blur.
          # Chỉ dùng để render text.
          SUBTITLE_BOTTOM_MARGIN = 25

          # ============================================================
          # BLUR CONFIG
          # ============================================================

          # Padding ngang thêm vào vùng blur.
          #
          # Subtitle dài nhất:
          #
          # [----------- subtitle -----------]
          #
          # Blur:
          #
          # [ + padding | subtitle | padding + ]
          #
          BLUR_PAD_X_RATIO = 0.012

          # Padding dọc.
          #
          # Chỉ cao hơn subtitle một chút.
          BLUR_PAD_Y_RATIO = 0.008

          # Độ mạnh blur.
          #
          # 8-14 thường đẹp.
          #
          BLUR_SIGMA = 9

          # Không cho blur chạm đáy video.
          #
          # Nếu subtitle thực tế nằm cao hơn đáy,
          # vùng blur sẽ giữ nguyên khoảng cách đó.
          MIN_BOTTOM_GAP = 8


          # ============================================================
          # FFPROBE
          # ============================================================

          def probe_video():

              command = [
                  "ffprobe",

                  "-hide_banner",
                  "-v",
                  "error",

                  "-select_streams",
                  "v:0",

                  "-show_entries",
                  "stream=width,height,r_frame_rate",

                  "-show_entries",
                  "format=duration",

                  "-of",
                  "json",

                  str(VIDEO)
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              rate = stream[
                  "r_frame_rate"
              ]

              a, b = rate.split("/")

              fps = (
                  float(a)
                  /
                  float(b)
              )

              duration = float(
                  data["format"]["duration"]
              )

              return (
                  width,
                  height,
                  fps,
                  duration
              )


          # ============================================================
          # DECODE ONE FRAME
          # ============================================================

          def get_frame(
              time_sec,
              width,
              height
          ):

              command = [
                  "ffmpeg",

                  "-hide_banner",
                  "-loglevel",
                  "error",

                  "-ss",
                  str(time_sec),

                  "-i",
                  str(VIDEO),

                  "-frames:v",
                  "1",

                  "-f",
                  "image2pipe",

                  "-vcodec",
                  "mjpeg",

                  "-"
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE
              )

              if result.returncode != 0:
                  return None

              if not result.stdout:
                  return None

              data = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8
              )

              frame = cv2.imdecode(
                  data,
                  cv2.IMREAD_COLOR
              )

              return frame


          # ============================================================
          # OCR INIT
          # ============================================================

          print()
          print("==========================================")
          print("Loading PaddleOCR")
          print("==========================================")
          print()

          ocr = PaddleOCR(
              lang="ch"
          )


          # ============================================================
          # OCR IMAGE
          # ============================================================

          def ocr_image(image):

              result = ocr.predict(image)

              texts = []
              boxes = []

              for page in result:

                  data = None

                  try:

                      data = page.json

                      if callable(data):
                          data = data()

                  except Exception as e:

                      print(
                          "page.json ERROR:",
                          repr(e)
                      )

                      continue

                  if isinstance(data, str):

                      try:
                          data = json.loads(data)

                      except Exception:
                          data = None

                  if not isinstance(data, dict):
                      continue

                  # ====================================================
                  # PaddleOCR 3.x
                  # ====================================================

                  if isinstance(
                      data.get("res"),
                      dict
                  ):

                      data = data["res"]

                  rec_texts = data.get(
                      "rec_texts",
                      []
                  )

                  rec_scores = data.get(
                      "rec_scores",
                      []
                  )

                  rec_polys = data.get(
                      "rec_polys",
                      []
                  )

                  for i, text in enumerate(
                      rec_texts
                  ):

                      text = str(
                          text
                      ).strip()

                      if not text:
                          continue

                      score = 1.0

                      if i < len(
                          rec_scores
                      ):

                          try:

                              score = float(
                                  rec_scores[i]
                              )

                          except Exception:
                              pass

                      if score < 0.30:
                          continue

                      if i >= len(
                          rec_polys
                      ):
                          continue

                      points = np.asarray(
                          rec_polys[i]
                      )

                      if points.ndim != 2:
                          continue

                      if points.shape[1] != 2:
                          continue

                      x1 = int(
                          points[:, 0].min()
                      )

                      y1 = int(
                          points[:, 1].min()
                      )

                      x2 = int(
                          points[:, 0].max()
                      )

                      y2 = int(
                          points[:, 1].max()
                      )

                      texts.append(text)

                      boxes.append(
                          (
                              x1,
                              y1,
                              x2,
                              y2
                          )
                      )

              return (
                  texts,
                  boxes
              )


          # ============================================================
          # CHINESE TEXT TEST
          # ============================================================

          def chinese_count(text):

              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      text
                  )
              )


          # ============================================================
          # FIND INITIAL SUBTITLE REGION
          # ============================================================

          def find_subtitle_region():

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              print()
              print("==========================================")
              print("VIDEO")
              print("==========================================")

              print(
                  f"Resolution: "
                  f"{width}x{height}"
              )

              print(
                  f"FPS: {fps:.2f}"
              )

              print(
                  f"Duration: "
                  f"{duration:.2f}s"
              )

              print()

              # Subtitle thường nằm ở 55-100%.
              y0 = int(
                  height * 0.55
              )

              max_scan = min(
                  duration,
                  90
              )

              time_sec = 0

              while time_sec <= max_scan:

                  print(
                      f"Scanning "
                      f"{time_sec:.1f}s"
                  )

                  frame = get_frame(
                      time_sec,
                      width,
                      height
                  )

                  if frame is None:

                      print(
                          "  Frame decode failed"
                      )

                      time_sec += SCAN_SECONDS

                      continue

                  crop = frame[
                      y0:height,
                      0:width
                  ]

                  texts, boxes = (
                      ocr_image(crop)
                  )

                  candidates = []

                  for text, box in zip(
                      texts,
                      boxes
                  ):

                      count = chinese_count(
                          text
                      )

                      if count < 2:
                          continue

                      x1, yy1, x2, yy2 = box

                      yy1 += y0
                      yy2 += y0

                      box_width = (
                          x2 - x1
                      )

                      box_height = (
                          yy2 - yy1
                      )

                      if box_width < 40:
                          continue

                      if box_height < 8:
                          continue

                      bottom_score = (
                          yy2 / height
                      )

                      score = (
                          box_width
                          *
                          count
                          *
                          (
                              1
                              +
                              bottom_score
                          )
                      )

                      candidates.append(
                          (
                              score,
                              text,
                              (
                                  x1,
                                  yy1,
                                  x2,
                                  yy2
                              )
                          )
                      )

                  if candidates:

                      candidates.sort(
                          reverse=True
                      )

                      (
                          score,
                          text,
                          box
                      ) = candidates[0]

                      x1, y1, x2, y2 = box

                      # ==================================================
                      # IMPORTANT:
                      #
                      # Không padding quá nhiều ở đây.
                      #
                      # Đặc biệt KHÔNG kéo y2 xuống 1080.
                      # ==================================================

                      padx = int(
                          width
                          *
                          BLUR_PAD_X_RATIO
                      )

                      pady = int(
                          height
                          *
                          BLUR_PAD_Y_RATIO
                      )

                      x1 = max(
                          0,
                          x1 - padx
                      )

                      y1 = max(
                          0,
                          y1 - pady
                      )

                      x2 = min(
                          width - 1,
                          x2 + padx
                      )

                      y2 = min(
                          height - MIN_BOTTOM_GAP,
                          y2 + pady
                      )

                      region = {

                          "x1": x1,
                          "y1": y1,
                          "x2": x2,
                          "y2": y2,

                          "width": width,
                          "height": height,

                          "fps": fps,

                          "found_at":
                              time_sec,

                          "sample_text":
                              text
                      }

                      print()
                      print(
                          "=========================================="
                      )

                      print(
                          "INITIAL SUBTITLE REGION FOUND"
                      )

                      print(
                          "Text:",
                          text
                      )

                      print(
                          "Region:",
                          region
                      )

                      print(
                          "=========================================="
                      )

                      print()

                      return region

                  time_sec += SCAN_SECONDS

              raise RuntimeError(
                  "Không tìm thấy subtitle "
                  "tiếng Trung trong 90 giây đầu."
              )


          # ============================================================
          # OCR WHOLE VIDEO
          #
          # IMPORTANT:
          #
          # Trong lúc OCR:
          #
          # 1. Lưu subtitle cues
          # 2. Đồng thời lưu bbox của từng subtitle
          #
          # Sau đó lấy subtitle có WIDTH LỚN NHẤT
          # làm kích thước vùng blur.
          # ============================================================

          def extract_subtitles(
              initial_region
          ):

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              # Initial OCR region chỉ dùng để tìm subtitle.
              #
              # Sau khi OCR toàn video, vùng blur sẽ được
              # tính lại dựa trên subtitle dài nhất.

              rx1 = initial_region["x1"]
              ry1 = initial_region["y1"]
              rx2 = initial_region["x2"]
              ry2 = initial_region["y2"]

              samples = max(
                  1,
                  int(
                      duration
                      *
                      OCR_FPS
                  )
              )

              print()
              print(
                  "=========================================="
              )

              print(
                  f"OCR FPS: {OCR_FPS}"
              )

              print(
                  f"OCR samples: {samples}"
              )

              print(
                  "=========================================="
              )

              print()

              cues = []

              previous_text = ""

              start_time = None

              # ========================================================
              # Geometry data
              # ========================================================

              subtitle_boxes = []

              for i in tqdm(
                  range(samples),
                  desc="OCR video"
              ):

                  current_time = (
                      i
                      /
                      OCR_FPS
                  )

                  frame = get_frame(
                      current_time,
                      width,
                      height
                  )

                  if frame is None:
                      continue

                  crop = frame[
                      ry1:ry2,
                      rx1:rx2
                  ]

                  texts, boxes = (
                      ocr_image(crop)
                  )

                  valid = []

                  for text, box in zip(
                      texts,
                      boxes
                  ):

                      if chinese_count(
                          text
                      ) < 2:
                          continue

                      x1, y1, x2, y2 = box

                      # Chuyển bbox từ crop
                      # về tọa độ video.

                      abs_x1 = (
                          x1 + rx1
                      )

                      abs_y1 = (
                          y1 + ry1
                      )

                      abs_x2 = (
                          x2 + rx1
                      )

                      abs_y2 = (
                          y2 + ry1
                      )

                      box_width = (
                          abs_x2
                          -
                          abs_x1
                      )

                      box_height = (
                          abs_y2
                          -
                          abs_y1
                      )

                      if box_width < 40:
                          continue

                      if box_height < 8:
                          continue

                      valid.append(
                          (
                              text,
                              (
                                  abs_x1,
                                  abs_y1,
                                  abs_x2,
                                  abs_y2
                              )
                          )
                      )

                  # ====================================================
                  # Sort text boxes left → right
                  #
                  # Trường hợp subtitle bị OCR thành nhiều box.
                  # ====================================================

                  valid.sort(
                      key=lambda item:
                      item[1][0]
                  )

                  text = " ".join(
                      item[0]
                      for item in valid
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  # ====================================================
                  # Geometry
                  # ====================================================

                  if valid:

                      all_x1 = min(
                          item[1][0]
                          for item in valid
                      )

                      all_y1 = min(
                          item[1][1]
                          for item in valid
                      )

                      all_x2 = max(
                          item[1][2]
                          for item in valid
                      )

                      all_y2 = max(
                          item[1][3]
                          for item in valid
                      )

                      geometry = {

                          "x1": all_x1,
                          "y1": all_y1,
                          "x2": all_x2,
                          "y2": all_y2,

                          "width":
                              all_x2
                              -
                              all_x1,

                          "height":
                              all_y2
                              -
                              all_y1,

                          "center_x":
                              (
                                  all_x1
                                  +
                                  all_x2
                              )
                              /
                              2,

                          "center_y":
                              (
                                  all_y1
                                  +
                                  all_y2
                              )
                              /
                              2
                      }

                      subtitle_boxes.append(
                          {
                              "time":
                                  current_time,

                              "text":
                                  text,

                              "box":
                                  geometry
                          }
                      )

                  # ====================================================
                  # Subtitle changed
                  # ====================================================

                  if text != previous_text:

                      # Close previous subtitle.

                      if (
                          previous_text
                          and
                          start_time
                          is not None
                      ):

                          cues.append({
                              "start":
                                  start_time,

                              "end":
                                  current_time,

                              "text":
                                  previous_text
                          })

                      # New subtitle.

                      if text:

                          previous_text = (
                              text
                          )

                          start_time = (
                              current_time
                          )

                      else:

                          previous_text = ""

                          start_time = None

              # ========================================================
              # Close last subtitle
              # ========================================================

              if (
                  previous_text
                  and
                  start_time
                  is not None
              ):

                  cues.append({
                      "start":
                          start_time,

                      "end":
                          duration,

                      "text":
                          previous_text
                  })

              # ========================================================
              # Cleanup
              # ========================================================

              cleaned = []

              for cue in cues:

                  text = cue["text"]

                  if len(text) < 2:
                      continue

                  cue_duration = (
                      cue["end"]
                      -
                      cue["start"]
                  )

                  if cue_duration < 0.15:
                      continue

                  if cleaned:

                      previous = (
                          cleaned[-1]
                      )

                      gap = (
                          cue["start"]
                          -
                          previous["end"]
                      )

                      if (
                          text
                          ==
                          previous["text"]
                          and
                          gap < 0.6
                      ):

                          previous["end"] = (
                              cue["end"]
                          )

                          continue

                  cleaned.append(
                      cue
                  )

              print()
              print(
                  f"Subtitle cues: "
                  f"{len(cleaned)}"
              )

              # ========================================================
              # FIND LONGEST SUBTITLE
              # ========================================================

              if not subtitle_boxes:

                  raise RuntimeError(
                      "Không có geometry subtitle."
                  )

              longest = max(
                  subtitle_boxes,
                  key=lambda item:
                  item["box"]["width"]
              )

              longest_box = (
                  longest["box"]
              )

              print()
              print(
                  "=========================================="
              )

              print(
                  "LONGEST SUBTITLE"
              )

              print(
                  "Text:",
                  longest["text"]
              )

              print(
                  "Time:",
                  f'{longest["time"]:.2f}s'
              )

              print(
                  "X:",
                  longest_box["x1"],
                  "->",
                  longest_box["x2"]
              )

              print(
                  "Y:",
                  longest_box["y1"],
                  "->",
                  longest_box["y2"]
              )

              print(
                  "Width:",
                  longest_box["width"]
              )

              print(
                  "Height:",
                  longest_box["height"]
              )

              print(
                  "=========================================="
              )

              print()

              # ========================================================
              # Build final blur region
              #
              # CHIỀU DÀI:
              #     = subtitle dài nhất
              #       + padding hai bên
              #
              # CHIỀU CAO:
              #     = subtitle cao nhất
              #       + padding nhỏ
              #
              # VỊ TRÍ:
              #     = vị trí subtitle thực tế
              #
              # Không kéo xuống đáy.
              # ========================================================

              max_width = max(
                  item["box"]["width"]
                  for item in subtitle_boxes
              )

              max_height = max(
                  item["box"]["height"]
                  for item in subtitle_boxes
              )

              # Subtitle dài nhất.

              longest_width = (
                  longest_box["width"]
              )

              # Nếu OCR có những subtitle
              # bị lệch trái/phải giữa các frame,
              # dùng width lớn nhất nhưng giữ tâm
              # của subtitle dài nhất.

              center_x = (
                  longest_box["center_x"]
              )

              # Chiều rộng vùng blur.

              blur_width = int(
                  longest_width
                  +
                  (
                      width
                      *
                      BLUR_PAD_X_RATIO
                      *
                      2
                  )
              )

              # Chiều cao vùng blur.
              #
              # Dùng chiều cao lớn nhất của subtitle,
              # không dùng chiều cao của crop.
              blur_height = int(
                  max_height
                  +
                  (
                      height
                      *
                      BLUR_PAD_Y_RATIO
                      *
                      2
                  )
              )

              # Đảm bảo không quá nhỏ.

              blur_height = max(
                  blur_height,
                  20
              )

              # Tính x.

              blur_x1 = int(
                  center_x
                  -
                  blur_width / 2
              )

              blur_x2 = (
                  blur_x1
                  +
                  blur_width
              )

              # ========================================================
              # Vertical position
              #
              # Lấy median center_y của subtitle.
              #
              # Cách này tốt hơn việc mặc định:
              # y = height - something
              #
              # Vì video của bạn có khoảng trống
              # giữa subtitle và đáy.
              # ========================================================

              centers_y = [
                  item["box"]["center_y"]
                  for item in subtitle_boxes
              ]

              subtitle_center_y = float(
                  np.median(
                      centers_y
                  )
              )

              blur_y1 = int(
                  subtitle_center_y
                  -
                  blur_height / 2
              )

              blur_y2 = (
                  blur_y1
                  +
                  blur_height
              )

              # ========================================================
              # Clamp
              # ========================================================

              blur_x1 = max(
                  0,
                  blur_x1
              )

              blur_x2 = min(
                  width,
                  blur_x2
              )

              blur_y1 = max(
                  0,
                  blur_y1
              )

              # Quan trọng:
              #
              # Không cho vùng blur chạm đáy video.
              #
              # Nếu subtitle cách đáy 40px,
              # blur vẫn sẽ cách đáy khoảng đó.
              #
              if blur_y2 > height - MIN_BOTTOM_GAP:

                  shift_up = (
                      blur_y2
                      -
                      (
                          height
                          -
                          MIN_BOTTOM_GAP
                      )
                  )

                  blur_y1 -= shift_up
                  blur_y2 -= shift_up

              blur_y1 = max(
                  0,
                  blur_y1
              )

              blur_y2 = min(
                  height
                  -
                  MIN_BOTTOM_GAP,
                  blur_y2
              )

              final_region = {

                  "x1":
                      int(blur_x1),

                  "y1":
                      int(blur_y1),

                  "x2":
                      int(blur_x2),

                  "y2":
                      int(blur_y2),

                  "width":
                      width,

                  "height":
                      height,

                  "fps":
                      fps,

                  "found_at":
                      initial_region[
                          "found_at"
                      ],

                  "sample_text":
                      initial_region[
                          "sample_text"
                      ],

                  "longest_text":
                      longest["text"],

                  "longest_subtitle_width":
                      int(longest_width),

                  "longest_subtitle_height":
                      int(max_height),

                  "blur_width":
                      int(
                          blur_x2
                          -
                          blur_x1
                      ),

                  "blur_height":
                      int(
                          blur_y2
                          -
                          blur_y1
                      ),

                  "bottom_gap":
                      int(
                          height
                          -
                          blur_y2
                      )
              }

              print()
              print(
                  "=========================================="
              )

              print(
                  "FINAL BLUR REGION"
              )

              print(
                  "=========================================="
              )

              print(
                  f"x1 = {blur_x1}"
              )

              print(
                  f"y1 = {blur_y1}"
              )

              print(
                  f"x2 = {blur_x2}"
              )

              print(
                  f"y2 = {blur_y2}"
              )

              print()

              print(
                  f"Blur width  = "
                  f"{blur_x2 - blur_x1}"
              )

              print(
                  f"Blur height = "
                  f"{blur_y2 - blur_y1}"
              )

              print()

              print(
                  f"Bottom gap  = "
                  f"{height - blur_y2}px"
              )

              print()

              print(
                  "Longest subtitle:"
              )

              print(
                  longest["text"]
              )

              print(
                  "Longest width:",
                  longest_width
              )

              print(
                  "Max subtitle height:",
                  max_height
              )

              print(
                  "=========================================="
              )

              print()

              return (
                  cleaned,
                  final_region
              )


          # ============================================================
          # SAVE SRT
          # ============================================================

          def save_srt(
              cues,
              path,
              field
          ):

              subs = pysubs2.SSAFile()

              for cue in cues:

                  start = int(
                      cue["start"]
                      *
                      1000
                  )

                  end = int(
                      cue["end"]
                      *
                      1000
                  )

                  text = cue[
                      field
                  ]

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=start,
                          end=end,
                          text=text
                      )
                  )

              subs.save(
                  str(path),
                  encoding="utf-8"
              )


          # ============================================================
          # TRANSLATION
          # ============================================================

          def translate_cues(
              cues
          ):

              print()
              print(
                  "=========================================="
              )

              print(
                  "Loading translation model"
              )

              print(
                  MODEL_NAME
              )

              print(
                  "=========================================="
              )

              print()

              tokenizer = (
                  AutoTokenizer
                  .from_pretrained(
                      MODEL_NAME
                  )
              )

              model = (
                  AutoModelForSeq2SeqLM
                  .from_pretrained(
                      MODEL_NAME
                  )
              )

              model.eval()

              results = []

              batch_size = 8

              for offset in tqdm(
                  range(
                      0,
                      len(cues),
                      batch_size
                  ),
                  desc="Translate"
              ):

                  batch = cues[
                      offset:
                      offset
                      +
                      batch_size
                  ]

                  texts = [
                      x["text"]
                      for x in batch
                  ]

                  inputs = tokenizer(
                      texts,

                      return_tensors="pt",

                      padding=True,

                      truncation=True,

                      max_length=256
                  )

                  import torch

                  with torch.no_grad():

                      output = (
                          model.generate(
                              **inputs,

                              max_length=256,

                              num_beams=4
                          )
                      )

                  translations = (
                      tokenizer.batch_decode(
                          output,
                          skip_special_tokens=True
                      )
                  )

                  for cue, vi in zip(
                      batch,
                      translations
                  ):

                      vi = vi.strip()

                      if not vi:
                          vi = cue["text"]

                      results.append({

                          "start":
                              cue["start"],

                          "end":
                              cue["end"],

                          "text":
                              cue["text"],

                          "vi":
                              vi
                      })

              return results


          # ============================================================
          # FIND FONT
          # ============================================================

          def find_font():

              candidates = [

                  "Oward",

                  "Oward.ttf",

                  "Oward.otf",

                  "Noto Sans CJK SC",

                  "Noto Sans CJK TC",

                  "Noto Sans CJK"

              ]

              # ========================================================
              # Check fontconfig
              # ========================================================

              for candidate in candidates:

                  try:

                      result = subprocess.run(
                          [
                              "fc-match",
                              "-f",
                              "%{family}\\n",
                              candidate
                          ],

                          stdout=subprocess.PIPE,

                          stderr=subprocess.PIPE,

                          text=True
                      )

                      family = (
                          result.stdout
                          .strip()
                      )

                      if not family:
                          continue

                      if (
                          "Oward"
                          in
                          family
                      ):

                          print(
                              "Font selected:",
                              family
                          )

                          return family

                  except Exception:
                      pass

              # ========================================================
              # Noto fallback
              # ========================================================

              print(
                  "Oward not found."
              )

              print(
                  "Using Noto Sans CJK SC."
              )

              return "Noto Sans CJK SC"


          # ============================================================
          # CREATE ASS
          # ============================================================

          def create_ass(
              cues,
              region
          ):

              width = int(
                  region["width"]
              )

              height = int(
                  region["height"]
              )

              blur_y2 = int(
                  region["y2"]
              )

              font_name = find_font()

              print()
              print(
                  "=========================================="
              )

              print(
                  "SUBTITLE STYLE"
              )

              print(
                  f"Font: {font_name}"
              )

              print(
                  f"Font size: {FONT_SIZE}"
              )

              print(
                  f"Letter spacing: {LETTER_SPACING}"
              )

              print(
                  f"Outline: {OUTLINE_SIZE}"
              )

              print(
                  "=========================================="
              )

              print()

              subs = pysubs2.SSAFile()

              style = pysubs2.SSAStyle()

              style.fontname = font_name

              # ========================================================
              # FONT SIZE
              # ========================================================

              style.fontsize = FONT_SIZE

              # ========================================================
              # COLORS
              # ========================================================

              style.primarycolor = (
                  pysubs2.Color(
                      255,
                      255,
                      255,
                      0
                  )
              )

              style.secondarycolor = (
                  pysubs2.Color(
                      255,
                      255,
                      255,
                      0
                  )
              )

              style.outlinecolor = (
                  pysubs2.Color(
                      0,
                      0,
                      0,
                      0
                  )
              )

              style.backcolor = (
                  pysubs2.Color(
                      0,
                      0,
                      0,
                      0
                  )
              )

              # ========================================================
              # TEXT OUTLINE
              # ========================================================

              style.outline = OUTLINE_SIZE

              style.shadow = SHADOW_SIZE

              # ========================================================
              # BOTTOM CENTER
              # ========================================================

              style.alignment = 2

              # ========================================================
              # Margins
              # ========================================================

              style.marginl = 30
              style.marginr = 30

              style.marginv = (
                  SUBTITLE_BOTTOM_MARGIN
              )

              subs.styles[
                  "Default"
              ] = style

              # ========================================================
              # EVENTS
              # ========================================================

              for cue in cues:

                  vi = cue["vi"]

                  # ====================================================
                  # Force ASS rendering settings.
                  #
                  # \fsp-1:
                  # chữ sát nhau hơn.
                  #
                  # \q2:
                  # smart line wrapping.
                  #
                  # \N không được tự thêm ở đây.
                  # ====================================================

                  text = (
                      "{\\fsp"
                      f"{LETTER_SPACING}"
                      "\\q2}"
                      +
                      vi
                  )

                  subs.events.append(
                      pysubs2.SSAEvent(

                          start=int(
                              cue["start"]
                              *
                              1000
                          ),

                          end=int(
                              cue["end"]
                              *
                              1000
                          ),

                          text=text
                      )
                  )

              path = (
                  WORK
                  /
                  "vietnamese.ass"
              )

              subs.save(
                  str(path),
                  encoding="utf-8"
              )

              return path


          # ============================================================
          # RENDER
          #
          # Thay DELLOGO bằng blur thật.
          #
          # Pipeline:
          #
          # [source]
          #      |
          #      +--------------------+
          #      |                    |
          #      |                    |
          #    main                blur copy
          #                           |
          #                         crop
          #                           |
          #                       boxblur
          #                           |
          #                           +------+
          #                                  |
          # main ------------------------- overlay
          #                                  |
          #                                ASS
          #
          # Kết quả:
          # subtitle Trung cũ bị blur mềm,
          # không phải interpolation của delogo.
          # ============================================================

          def render_video(
              ass,
              region
          ):

              width = int(
                  region["width"]
              )

              height = int(
                  region["height"]
              )

              x1 = int(
                  region["x1"]
              )

              y1 = int(
                  region["y1"]
              )

              x2 = int(
                  region["x2"]
              )

              y2 = int(
                  region["y2"]
              )

              w = (
                  x2
                  -
                  x1
              )

              h = (
                  y2
                  -
                  y1
              )

              # ========================================================
              # Validate
              # ========================================================

              if x1 < 0:
                  raise RuntimeError(
                      f"Invalid x1={x1}"
                  )

              if y1 < 0:
                  raise RuntimeError(
                      f"Invalid y1={y1}"
                  )

              if x2 > width:
                  raise RuntimeError(
                      f"Invalid x2={x2}, "
                      f"video width={width}"
                  )

              if y2 > height:
                  raise RuntimeError(
                      f"Invalid y2={y2}, "
                      f"video height={height}"
                  )

              if w <= 0:
                  raise RuntimeError(
                      f"Invalid blur width={w}"
                  )

              if h <= 0:
                  raise RuntimeError(
                      f"Invalid blur height={h}"
                  )

              if y2 >= height:
                  raise RuntimeError(
                      "Blur region unexpectedly "
                      "touches bottom of frame."
                  )

              print()
              print(
                  "=========================================="
              )

              print(
                  "BLUR REGION"
              )

              print(
                  f"x={x1}"
              )

              print(
                  f"y={y1}"
              )

              print(
                  f"w={w}"
              )

              print(
                  f"h={h}"
              )

              print(
                  f"bottom gap={height - y2}px"
              )

              print(
                  f"blur sigma={BLUR_SIGMA}"
              )

              print(
                  "=========================================="
              )

              print()

              # ========================================================
              # ASS path
              # ========================================================

              ass_path = (
                  str(ass)
                  .replace(
                      "\\",
                      "/"
                  )
                  .replace(
                      ":",
                      "\\:"
                  )
                  .replace(
                      "'",
                      "\\'"
                  )
              )

              # ========================================================
              # Blur filter
              #
              # Dùng split thay vì delogo.
              #
              # crop chính xác vùng subtitle,
              # blur vùng đó,
              # overlay trở lại vị trí cũ.
              # ========================================================

              video_filter = (

                  "split=2"
                  "[main][blur];"

                  "[blur]"
                  f"crop="
                  f"w={w}:"
                  f"h={h}:"
                  f"x={x1}:"
                  f"y={y1},"

                  f"boxblur="
                  f"luma_radius={BLUR_SIGMA}:"
                  f"luma_power=1:"
                  f"chroma_radius={BLUR_SIGMA}:"
                  f"chroma_power=1"
                  "[blurred];"

                  "[main]"
                  "[blurred]"
                  f"overlay="
                  f"x={x1}:"
                  f"y={y1}"
                  ":eof_action=pass"
                  "[clean];"

                  "[clean]"
                  f"ass='{ass_path}'"
              )

              output = (
                  OUTPUT
                  /
                  "video_vi.mp4"
              )

              # ========================================================
              # Remove old output
              # ========================================================

              if output.exists():
                  output.unlink()

              print()
              print(
                  "=========================================="
              )

              print(
                  "Rendering final video"
              )

              print(
                  "=========================================="
              )

              print()

              command = [

                  "ffmpeg",

                  "-hide_banner",

                  "-y",

                  "-i",
                  str(VIDEO),

                  "-vf",
                  video_filter,

                  "-map",
                  "0:v:0",

                  "-map",
                  "0:a?",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "21",

                  "-pix_fmt",
                  "yuv420p",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-movflags",
                  "+faststart",

                  str(output)
              ]

              subprocess.run(
                  command,
                  check=True
              )

              if not output.exists():

                  raise RuntimeError(
                      "FFmpeg không tạo được "
                      "video output."
                  )

              if output.stat().st_size < 10000:

                  raise RuntimeError(
                      "Output video bất thường "
                      "(file quá nhỏ)."
                  )

              return output


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      f"Video không tồn tại: {VIDEO}"
                  )

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              # ========================================================
              # 1. Find initial subtitle region
              # ========================================================

              initial_region = (
                  find_subtitle_region()
              )

              # ========================================================
              # 2. OCR whole video
              #
              # Đồng thời tìm subtitle dài nhất.
              # ========================================================

              (
                  cues,
                  region
              ) = extract_subtitles(
                  initial_region
              )

              if not cues:

                  raise RuntimeError(
                      "OCR không tìm thấy subtitle."
                  )

              # ========================================================
              # Save final region
              # ========================================================

              region_file = (
                  WORK
                  /
                  "subtitle_region.json"
              )

              region_file.write_text(
                  json.dumps(
                      region,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              # ========================================================
              # 3. Chinese SRT
              # ========================================================

              chinese_srt = (
                  WORK
                  /
                  "chinese.srt"
              )

              save_srt(
                  cues,
                  chinese_srt,
                  "text"
              )

              # ========================================================
              # 4. Translate
              # ========================================================

              translated = (
                  translate_cues(
                      cues
                  )
              )

              # ========================================================
              # 5. Vietnamese SRT
              # ========================================================

              vietnamese_srt = (
                  WORK
                  /
                  "vietnamese.srt"
              )

              save_srt(
                  translated,
                  vietnamese_srt,
                  "vi"
              )

              # ========================================================
              # 6. ASS
              # ========================================================

              ass = (
                  create_ass(
                      translated,
                      region
                  )
              )

              # ========================================================
              # 7. Render
              # ========================================================

              output = (
                  render_video(
                      ass,
                      region
                  )
              )

              # ========================================================
              # COMPLETE
              # ========================================================

              print()
              print(
                  "=========================================="
              )

              print(
                  "PROCESS COMPLETE"
              )

              print(
                  "=========================================="
              )

              print()

              print(
                  f"Video: {output}"
              )

              print(
                  f"Chinese SRT: {chinese_srt}"
              )

              print(
                  f"Vietnamese SRT: {vietnamese_srt}"
              )

              print(
                  f"Region: {region_file}"
              )

              print()

              print(
                  "FINAL REGION:"
              )

              print(
                  json.dumps(
                      region,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print()

          if __name__ == "__main__":
              main()

          PY


      # ==========================================================
      # RUN PROCESS
      # ==========================================================

      - name: OCR → Translate → Render
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}

          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

        run: |

          set -euo pipefail

          python process.py


      # ==========================================================
      # CHECK OUTPUT
      # ==========================================================

      - name: Check output
        run: |

          set -e

          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          ls -lh output/

          echo ""
          echo "Subtitles:"

          ls -lh \
            work/*.srt \
            work/*.ass \
            2>/dev/null || true

          echo ""
          echo "Subtitle region:"

          cat \
            work/subtitle_region.json \
            2>/dev/null || true

          echo ""
          echo "Final video information:"

          ffprobe \
            -hide_banner \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/video_vi.mp4


      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload result
        uses: actions/upload-artifact@v4

        with:

          name: bilibili-vietnamese-result

          path: |

            output/video_vi.mp4

            work/chinese.srt

            work/vietnamese.srt

            work/vietnamese.ass

            work/subtitle_region.json

          retention-days: 7


      # ==========================================================
      # DELETE COOKIE
      # ==========================================================

      - name: Cleanup cookies
        if: always()

        run: |

          rm -f \
            work/cookies.txt

          echo "Cookie removed."
