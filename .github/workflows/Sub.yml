name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:

      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_seconds:
        description: "Interval tìm subtitle ban đầu (giây)"
        required: false
        default: "1"
        type: string

      ocr_fps:
        description: "FPS OCR, 1-2 là phù hợp"
        required: false
        default: "2"
        type: string

jobs:

  process:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      HF_HOME: "${{ github.workspace }}/work/huggingface"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # PYTHON 3.11
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ==========================================================
      # SYSTEM
      # ==========================================================

      - name: Install system packages
        run: |

          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-core \
            fonts-dejavu \
            libgl1 \
            libglib2.0-0


      # ==========================================================
      # PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |

          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            yt-dlp \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            pillow \
            tqdm \
            pysubs2 \
            sentencepiece \
            safetensors \
            torch==2.4.1 \
            transformers==4.47.1

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install \
            paddleocr==3.3.2


      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare directories
        run: |

          set -eux

          mkdir -p work
          mkdir -p output

          echo "Workspace:"
          pwd

          echo ""
          echo "Repository:"
          ls -la


      # ==========================================================
      # PREPARE BILIBILI COOKIE
      # ==========================================================

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}

        run: |

          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then

            echo "::error::"
            echo "::error::GitHub Secret BILIBILI_COOKIES chưa được cấu hình."
            echo "::error::"

            exit 1

          fi

          printf '%s\n' \
            "$BILIBILI_COOKIES" \
            > work/cookies.txt

          chmod 600 work/cookies.txt

          echo "Cookie file created."

          echo "Cookie line count:"
          wc -l work/cookies.txt


      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "BILIBILI DOWNLOAD"
          echo "=========================================="

          echo ""
          echo "URL:"
          echo "$BILIBILI_URL"

          echo ""
          echo "yt-dlp:"
          yt-dlp --version

          echo ""
          echo "Downloading H.264 when available..."

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          echo ""
          echo "=========================================="
          echo "DOWNLOADED"
          echo "=========================================="

          ls -lh work/


      # ==========================================================
      # CHECK VIDEO
      # ==========================================================

      - name: Inspect video
        run: |

          set -e

          VIDEO="work/source.mp4"

          if [ ! -f "$VIDEO" ]; then

            echo "source.mp4 not found."

            echo "Available files:"
            find work -maxdepth 1 -type f -printf '%p\n'

            exit 1

          fi

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -hide_banner \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"


      # ==========================================================
      # CREATE PROCESSOR
      # ==========================================================

      - name: Create processing script
        run: |

          cat > process.py <<'PY'

          import os
          import re
          import json
          import subprocess
          from pathlib import Path

          import cv2
          import numpy as np
          import pysubs2

          from tqdm import tqdm

          from paddleocr import PaddleOCR

          from transformers import (
              AutoTokenizer,
              AutoModelForSeq2SeqLM
          )


          # ============================================================
          # CONFIG
          # ============================================================

          WORK = Path("work")
          OUTPUT = Path("output")

          VIDEO = WORK / "source.mp4"

          MODEL_NAME = "Helsinki-NLP/opus-mt-zh-vi"

          SCAN_SECONDS = float(
              os.environ.get(
                  "SCAN_SECONDS",
                  "1"
              )
          )

          OCR_FPS = float(
              os.environ.get(
                  "OCR_FPS",
                  "2"
              )
          )


          # ============================================================
          # FFPROBE
          # ============================================================

          def probe_video():

              command = [
                  "ffprobe",
                  "-hide_banner",
                  "-v",
                  "error",

                  "-select_streams",
                  "v:0",

                  "-show_entries",
                  "stream=width,height,r_frame_rate",

                  "-show_entries",
                  "format=duration",

                  "-of",
                  "json",

                  str(VIDEO)
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              rate = stream[
                  "r_frame_rate"
              ]

              a, b = rate.split("/")

              fps = (
                  float(a)
                  /
                  float(b)
              )

              duration = float(
                  data["format"]["duration"]
              )

              return (
                  width,
                  height,
                  fps,
                  duration
              )


          # ============================================================
          # DECODE ONE FRAME USING FFMPEG
          # ============================================================

          def get_frame(
              time_sec,
              width,
              height
          ):

              command = [
                  "ffmpeg",

                  "-hide_banner",
                  "-loglevel",
                  "error",

                  "-ss",
                  str(time_sec),

                  "-i",
                  str(VIDEO),

                  "-frames:v",
                  "1",

                  "-f",
                  "image2pipe",

                  "-vcodec",
                  "mjpeg",

                  "-"
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE
              )

              if result.returncode != 0:
                  return None

              if not result.stdout:
                  return None

              data = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8
              )

              frame = cv2.imdecode(
                  data,
                  cv2.IMREAD_COLOR
              )

              return frame


          # ============================================================
          # OCR INIT
          # ============================================================

          print()
          print("==========================================")
          print("Loading PaddleOCR")
          print("==========================================")
          print()

          ocr = PaddleOCR(
              lang="ch"
          )


          # ============================================================
          # OCR IMAGE
          # ============================================================

          def ocr_image(image):

              result = ocr.predict(
                  image
              )

              texts = []
              boxes = []

              for page in result:

                  data = None

                  try:

                      data = page.json

                      if callable(data):
                          data = data()

                  except Exception:

                      data = None

                  if isinstance(
                      data,
                      str
                  ):

                      try:
                          data = json.loads(
                              data
                          )

                      except Exception:
                          data = None

                  if data is None:

                      try:
                          data = page.res

                      except Exception:
                          data = None

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  rec_texts = data.get(
                      "rec_texts",
                      []
                  )

                  rec_scores = data.get(
                      "rec_scores",
                      []
                  )

                  rec_polys = data.get(
                      "rec_polys",
                      []
                  )

                  for i, text in enumerate(
                      rec_texts
                  ):

                      text = str(
                          text
                      ).strip()

                      if not text:
                          continue

                      score = 1.0

                      if i < len(
                          rec_scores
                      ):

                          try:

                              score = float(
                                  rec_scores[i]
                              )

                          except Exception:
                              pass

                      if score < 0.40:
                          continue

                      if i >= len(
                          rec_polys
                      ):
                          continue

                      points = np.asarray(
                          rec_polys[i]
                      )

                      if points.ndim != 2:
                          continue

                      if points.shape[1] != 2:
                          continue

                      x1 = int(
                          points[:, 0].min()
                      )

                      y1 = int(
                          points[:, 1].min()
                      )

                      x2 = int(
                          points[:, 0].max()
                      )

                      y2 = int(
                          points[:, 1].max()
                      )

                      texts.append(
                          text
                      )

                      boxes.append(
                          (
                              x1,
                              y1,
                              x2,
                              y2
                          )
                      )

              return (
                  texts,
                  boxes
              )


          # ============================================================
          # CHINESE TEXT TEST
          # ============================================================

          def chinese_count(text):

              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      text
                  )
              )


          # ============================================================
          # FIND SUBTITLE REGION
          # ============================================================

          def find_subtitle_region():

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              print()
              print("==========================================")
              print("VIDEO")
              print("==========================================")

              print(
                  f"Resolution: "
                  f"{width}x{height}"
              )

              print(
                  f"FPS: {fps:.2f}"
              )

              print(
                  f"Duration: "
                  f"{duration:.2f}s"
              )

              print()

              # Subtitle thường nằm ở
              # phần 55-100% chiều cao.

              y0 = int(
                  height * 0.55
              )

              max_scan = min(
                  duration,
                  90
              )

              time_sec = 0

              while time_sec <= max_scan:

                  print(
                      f"Scanning "
                      f"{time_sec:.1f}s"
                  )

                  frame = get_frame(
                      time_sec,
                      width,
                      height
                  )

                  if frame is None:

                      print(
                          "  Frame decode failed"
                      )

                      time_sec += SCAN_SECONDS

                      continue

                  crop = frame[
                      y0:height,
                      0:width
                  ]

                  texts, boxes = (
                      ocr_image(crop)
                  )

                  candidates = []

                  for text, box in zip(
                      texts,
                      boxes
                  ):

                      count = chinese_count(
                          text
                      )

                      if count < 2:
                          continue

                      x1, yy1, x2, yy2 = box

                      yy1 += y0
                      yy2 += y0

                      box_width = (
                          x2 - x1
                      )

                      box_height = (
                          yy2 - yy1
                      )

                      if box_width < 40:
                          continue

                      if box_height < 8:
                          continue

                      # Subtitle score.
                      #
                      # Ưu tiên:
                      # - nhiều chữ Trung
                      # - chiều rộng lớn
                      # - nằm thấp trong frame

                      bottom_score = (
                          yy2 / height
                      )

                      score = (
                          box_width
                          *
                          count
                          *
                          (
                              1
                              +
                              bottom_score
                          )
                      )

                      candidates.append(
                          (
                              score,
                              text,
                              (
                                  x1,
                                  yy1,
                                  x2,
                                  yy2
                              )
                          )
                      )

                  if candidates:

                      candidates.sort(
                          reverse=True
                      )

                      (
                          score,
                          text,
                          box
                      ) = candidates[0]

                      x1, y1, x2, y2 = box

                      # Padding
                      padx = int(
                          width * 0.015
                      )

                      pady = int(
                          height * 0.015
                      )

                      x1 = max(
                          0,
                          x1 - padx
                      )

                      y1 = max(
                          0,
                          y1 - pady
                      )

                      x2 = min(
                          width,
                          x2 + padx
                      )

                      y2 = min(
                          height,
                          y2 + pady
                      )

                      region = {
                          "x1": x1,
                          "y1": y1,
                          "x2": x2,
                          "y2": y2,

                          "width": width,
                          "height": height,

                          "fps": fps,

                          "found_at":
                              time_sec,

                          "sample_text":
                              text
                      }

                      print()
                      print(
                          "=========================================="
                      )

                      print(
                          "SUBTITLE REGION FOUND"
                      )

                      print(
                          "Text:",
                          text
                      )

                      print(
                          "Region:",
                          region
                      )

                      print(
                          "=========================================="
                      )

                      print()

                      return region

                  time_sec += SCAN_SECONDS

              raise RuntimeError(
                  "Không tìm thấy subtitle "
                  "tiếng Trung trong 90 giây đầu."
              )


          # ============================================================
          # OCR WHOLE VIDEO
          # ============================================================

          def extract_subtitles(
              region
          ):

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              x1 = region["x1"]
              y1 = region["y1"]
              x2 = region["x2"]
              y2 = region["y2"]

              samples = max(
                  1,
                  int(
                      duration
                      *
                      OCR_FPS
                  )
              )

              print()
              print(
                  "=========================================="
              )

              print(
                  f"OCR FPS: {OCR_FPS}"
              )

              print(
                  f"OCR samples: {samples}"
              )

              print(
                  "=========================================="
              )

              print()

              cues = []

              previous_text = ""

              start_time = None

              for i in tqdm(
                  range(samples),
                  desc="OCR video"
              ):

                  current_time = (
                      i
                      /
                      OCR_FPS
                  )

                  frame = get_frame(
                      current_time,
                      width,
                      height
                  )

                  if frame is None:
                      continue

                  crop = frame[
                      y1:y2,
                      x1:x2
                  ]

                  texts, _ = (
                      ocr_image(crop)
                  )

                  valid = []

                  for text in texts:

                      if chinese_count(
                          text
                      ) >= 2:

                          valid.append(
                              text
                          )

                  text = " ".join(
                      valid
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  # ------------------------------------
                  # Subtitle changed
                  # ------------------------------------

                  if text != previous_text:

                      # Close previous subtitle
                      if (
                          previous_text
                          and
                          start_time
                          is not None
                      ):

                          cues.append({
                              "start":
                                  start_time,

                              "end":
                                  current_time,

                              "text":
                                  previous_text
                          })

                      # New subtitle
                      if text:

                          previous_text = (
                              text
                          )

                          start_time = (
                              current_time
                          )

                      else:

                          previous_text = ""

                          start_time = None

              # Close last subtitle
              if (
                  previous_text
                  and
                  start_time
                  is not None
              ):

                  cues.append({
                      "start":
                          start_time,

                      "end":
                          duration,

                      "text":
                          previous_text
                  })

              # ------------------------------------
              # Cleanup
              # ------------------------------------

              cleaned = []

              for cue in cues:

                  text = cue["text"]

                  if len(text) < 2:
                      continue

                  cue_duration = (
                      cue["end"]
                      -
                      cue["start"]
                  )

                  if cue_duration < 0.15:
                      continue

                  if cleaned:

                      previous = (
                          cleaned[-1]
                      )

                      gap = (
                          cue["start"]
                          -
                          previous["end"]
                      )

                      if (
                          text
                          ==
                          previous["text"]
                          and
                          gap < 0.6
                      ):

                          previous["end"] = (
                              cue["end"]
                          )

                          continue

                  cleaned.append(
                      cue
                  )

              print()
              print(
                  f"Subtitle cues: "
                  f"{len(cleaned)}"
              )

              return cleaned


          # ============================================================
          # SAVE SRT
          # ============================================================

          def save_srt(
              cues,
              path,
              field
          ):

              subs = pysubs2.SSAFile()

              for cue in cues:

                  start = int(
                      cue["start"]
                      *
                      1000
                  )

                  end = int(
                      cue["end"]
                      *
                      1000
                  )

                  text = cue[
                      field
                  ]

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=start,
                          end=end,
                          text=text
                      )
                  )

              subs.save(
                  str(path),
                  encoding="utf-8"
              )


          # ============================================================
          # TRANSLATION
          # ============================================================

          def translate_cues(
              cues
          ):

              print()
              print(
                  "=========================================="
              )

              print(
                  "Loading translation model"
              )

              print(
                  MODEL_NAME
              )

              print(
                  "=========================================="
              )

              print()

              tokenizer = (
                  AutoTokenizer
                  .from_pretrained(
                      MODEL_NAME
                  )
              )

              model = (
                  AutoModelForSeq2SeqLM
                  .from_pretrained(
                      MODEL_NAME
                  )
              )

              model.eval()

              results = []

              batch_size = 8

              for offset in tqdm(
                  range(
                      0,
                      len(cues),
                      batch_size
                  ),
                  desc="Translate"
              ):

                  batch = cues[
                      offset:
                      offset
                      +
                      batch_size
                  ]

                  texts = [
                      x["text"]
                      for x in batch
                  ]

                  inputs = tokenizer(
                      texts,

                      return_tensors="pt",

                      padding=True,

                      truncation=True,

                      max_length=256
                  )

                  with __import__(
                      "torch"
                  ).no_grad():

                      output = (
                          model.generate(
                              **inputs,

                              max_length=256,

                              num_beams=4
                          )
                      )

                  translations = (
                      tokenizer.batch_decode(
                          output,
                          skip_special_tokens=True
                      )
                  )

                  for cue, vi in zip(
                      batch,
                      translations
                  ):

                      vi = vi.strip()

                      # Nếu model không dịch được,
                      # giữ nguyên text để không mất cue.

                      if not vi:
                          vi = cue["text"]

                      results.append({
                          "start":
                              cue["start"],

                          "end":
                              cue["end"],

                          "text":
                              cue["text"],

                          "vi":
                              vi
                      })

              return results


          # ============================================================
          # CREATE ASS
          # ============================================================

          def create_ass(
              cues,
              region
          ):

              width = region[
                  "width"
              ]

              height = region[
                  "height"
              ]

              y2 = region[
                  "y2"
              ]

              subs = pysubs2.SSAFile()

              style = pysubs2.SSAStyle()

              style.fontname = (
                  "Noto Sans CJK SC"
              )

              style.fontsize = max(
                  30,
                  int(
                      height
                      *
                      0.035
                  )
              )

              style.primarycolor = (
                  pysubs2.Color(
                      255,
                      255,
                      255,
                      0
                  )
              )

              style.secondarycolor = (
                  pysubs2.Color(
                      255,
                      255,
                      255,
                      0
                  )
              )

              style.outlinecolor = (
                  pysubs2.Color(
                      0,
                      0,
                      0,
                      0
                  )
              )

              style.backcolor = (
                  pysubs2.Color(
                      0,
                      0,
                      0,
                      0
                  )
              )

              style.outline = 3

              style.shadow = 0

              # Bottom-center
              style.alignment = 2

              style.marginl = 30
              style.marginr = 30

              # Giữ vị trí gần subtitle cũ.
              style.marginv = max(
                  15,
                  height - y2
              )

              subs.styles[
                  "Default"
              ] = style

              for cue in cues:

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=int(
                              cue["start"]
                              *
                              1000
                          ),

                          end=int(
                              cue["end"]
                              *
                              1000
                          ),

                          text=cue["vi"]
                      )
                  )

              path = (
                  WORK
                  /
                  "vietnamese.ass"
              )

              subs.save(
                  str(path),
                  encoding="utf-8"
              )

              return path


          # ============================================================
          # RENDER
          # ============================================================

          def render_video(
              ass,
              region
          ):

              width = region[
                  "width"
              ]

              height = region[
                  "height"
              ]

              x1 = region["x1"]
              y1 = region["y1"]
              x2 = region["x2"]
              y2 = region["y2"]

              # Mở rộng một chút để xóa hết
              # viền subtitle Trung.

              padx = int(
                  width * 0.012
              )

              pady = int(
                  height * 0.010
              )

              x1 = max(
                  0,
                  x1 - padx
              )

              y1 = max(
                  0,
                  y1 - pady
              )

              x2 = min(
                  width,
                  x2 + padx
              )

              y2 = min(
                  height,
                  y2 + pady
              )

              w = x2 - x1
              h = y2 - y1

              ass_path = (
                  str(ass)
                  .replace(
                      "\\",
                      "/"
                  )
                  .replace(
                      ":",
                      "\\:"
                  )
                  .replace(
                      "'",
                      "\\'"
                  )
              )

              video_filter = (
                  f"delogo="
                  f"x={x1}:"
                  f"y={y1}:"
                  f"w={w}:"
                  f"h={h}:"
                  f"show=0,"
                  f"ass='{ass_path}'"
              )

              output = (
                  OUTPUT
                  /
                  "video_vi.mp4"
              )

              command = [
                  "ffmpeg",

                  "-hide_banner",

                  "-y",

                  "-i",
                  str(VIDEO),

                  "-vf",
                  video_filter,

                  "-map",
                  "0:v:0",

                  "-map",
                  "0:a?",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "21",

                  "-pix_fmt",
                  "yuv420p",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-movflags",
                  "+faststart",

                  str(output)
              ]

              print()
              print(
                  "=========================================="
              )

              print(
                  "Rendering final video"
              )

              print(
                  "=========================================="
              )

              print()

              subprocess.run(
                  command,
                  check=True
              )

              return output


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      f"Video không tồn tại: {VIDEO}"
                  )

              (
                  width,
                  height,
                  fps,
                  duration
              ) = probe_video()

              # --------------------------------------------
              # 1. Find subtitle region
              # --------------------------------------------

              region = (
                  find_subtitle_region()
              )

              region_file = (
                  WORK
                  /
                  "subtitle_region.json"
              )

              region_file.write_text(
                  json.dumps(
                      region,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              # --------------------------------------------
              # 2. OCR
              # --------------------------------------------

              cues = (
                  extract_subtitles(
                      region
                  )
              )

              if not cues:

                  raise RuntimeError(
                      "OCR không tìm thấy subtitle."
                  )

              # --------------------------------------------
              # 3. Chinese SRT
              # --------------------------------------------

              chinese_srt = (
                  WORK
                  /
                  "chinese.srt"
              )

              save_srt(
                  cues,
                  chinese_srt,
                  "text"
              )

              # --------------------------------------------
              # 4. Translate
              # --------------------------------------------

              translated = (
                  translate_cues(
                      cues
                  )
              )

              # --------------------------------------------
              # 5. Vietnamese SRT
              # --------------------------------------------

              vietnamese_srt = (
                  WORK
                  /
                  "vietnamese.srt"
              )

              save_srt(
                  translated,
                  vietnamese_srt,
                  "vi"
              )

              # --------------------------------------------
              # 6. ASS
              # --------------------------------------------

              ass = (
                  create_ass(
                      translated,
                      region
                  )
              )

              # --------------------------------------------
              # 7. Render
              # --------------------------------------------

              output = (
                  render_video(
                      ass,
                      region
                  )
              )

              print()
              print(
                  "=========================================="
              )

              print(
                  "PROCESS COMPLETE"
              )

              print(
                  "=========================================="
              )

              print(
                  f"Video: {output}"
              )

              print(
                  f"Chinese SRT: {chinese_srt}"
              )

              print(
                  f"Vietnamese SRT: {vietnamese_srt}"
              )

              print(
                  f"Region: {region_file}"
              )

              print()

          if __name__ == "__main__":
              main()

          PY


      # ==========================================================
      # RUN PROCESS
      # ==========================================================

      - name: OCR → Translate → Render
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}

          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

        run: |

          set -euo pipefail

          python process.py


      # ==========================================================
      # CHECK OUTPUT
      # ==========================================================

      - name: Check output
        run: |

          set -e

          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          ls -lh output/

          echo ""
          echo "Subtitles:"

          ls -lh \
            work/*.srt \
            work/*.ass \
            2>/dev/null || true

          echo ""
          echo "Subtitle region:"

          cat \
            work/subtitle_region.json \
            2>/dev/null || true

          echo ""
          echo "Final video information:"

          ffprobe \
            -hide_banner \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/video_vi.mp4


      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload result
        uses: actions/upload-artifact@v4

        with:

          name: bilibili-vietnamese-result

          path: |

            output/video_vi.mp4

            work/chinese.srt

            work/vietnamese.srt

            work/vietnamese.ass

            work/subtitle_region.json

          retention-days: 7


      # ==========================================================
      # DELETE COOKIE
      # ==========================================================

      - name: Cleanup cookies
        if: always()

        run: |

          rm -f \
            work/cookies.txt

          echo "Cookie removed."
