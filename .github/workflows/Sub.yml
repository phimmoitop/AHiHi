name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string
      scan_seconds:
        description: "Interval tìm subtitle ban đầu (giây)"
        required: false
        default: "1"
        type: string
      ocr_fps:
        description: "FPS OCR, 2-4 cho timing chuẩn hơn"
        required: false
        default: "2"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-core fonts-dejavu fonts-liberation libgl1 libglib2.0-0
          fc-list | grep -Ei "Noto Sans CJK|DejaVu Sans|Liberation" | head -30 || true

      - name: Prepare custom subtitle font
        run: |
          set -euo pipefail
          mkdir -p work/fonts
          FONT_TTF="work/fonts/UVNLaXanh.ttf"
          FONT_URL_TTF="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.TTF"
          FONT_URL_WOFF2="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.woff2"

          if curl -fsSL "$FONT_URL_TTF" -o "$FONT_TTF" && [ -s "$FONT_TTF" ]; then
            echo "Tải TTF thành công."
          else
            rm -f "$FONT_TTF"
            TMP_WOFF2="work/fonts/UVNLaXanh.woff2"
            if curl -fsSL "$FONT_URL_WOFF2" -o "$TMP_WOFF2" && [ -s "$TMP_WOFF2" ]; then
              python -m pip install --quiet fonttools brotli
              python3 - <<'PYCONV'
          from fontTools.ttLib import TTFont
          src = "work/fonts/UVNLaXanh.woff2"
          dst = "work/fonts/UVNLaXanh.ttf"
          try:
              font = TTFont(src)
              font.flavor = None
              font.save(dst)
              print("Convert OK:", dst)
          except Exception as e:
              print("Convert failed:", repr(e))
          PYCONV
            else
              echo "Khong tai duoc font UVNLaXanh."
            fi
          fi

          if [ -f "$FONT_TTF" ] && [ -s "$FONT_TTF" ]; then
            mkdir -p "$HOME/.local/share/fonts"
            cp "$FONT_TTF" "$HOME/.local/share/fonts/"
            fc-cache -f "$HOME/.local/share/fonts" >/dev/null 2>&1 || true
            FONT_FAMILY="$(fc-scan --format '%{family[0]}\n' "$FONT_TTF" 2>/dev/null | head -1 | tr -d '\r')"
            if [ -z "$FONT_FAMILY" ]; then
              FONT_FAMILY="Arial"
            fi
          else
            FONT_FAMILY="Arial"
          fi

          echo "FONT_FAMILY=$FONT_FAMILY" >> "$GITHUB_ENV"
          echo "Font su dung: $FONT_FAMILY"
          fc-list | grep -i "$FONT_FAMILY" || true

      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install yt-dlp numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow tqdm pysubs2 google-genai
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.3.2

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work output
          pwd
          ls -la

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::GitHub Secret BILIBILI_COOKIES chua duoc cau hinh."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt
          wc -l work/cookies.txt

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          echo "URL: $BILIBILI_URL"
          yt-dlp --version
          yt-dlp --cookies work/cookies.txt --no-playlist --extractor-retries 5 --fragment-retries 5 --retries 5 --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"
          ls -lh work/

      - name: Inspect video
        run: |
          set -e
          VIDEO="work/source.mp4"
          if [ ! -f "$VIDEO" ]; then
            echo "source.mp4 not found."
            find work -maxdepth 1 -type f -printf '%p\n'
            exit 1
          fi
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration -of default=noprint_wrappers=1 "$VIDEO"

      - name: Create processing script
        run: |
          cat > process.py <<'PY'
          import os, re, json, time, random, subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm
          from paddleocr import PaddleOCR
          from google import genai
          from google.genai import types

          WORK = Path("work")
          OUTPUT = Path("output")
          VIDEO = WORK / "source.mp4"

          SCAN_SECONDS = float(os.environ.get("SCAN_SECONDS", "1"))
          OCR_FPS = float(os.environ.get("OCR_FPS", "2"))
          SAMPLE_STEP = 1.0 / OCR_FPS
          FONT_NAME = os.environ.get("FONT_NAME", "Arial")

          SCAN_Y_RATIO = 0.75

          FONT_SIZE = 30
          LETTER_SPACING = -1
          OUTLINE_SIZE = 1
          SHADOW_SIZE = 0

          BOX_BACKGROUND_ENABLED = True
          BOX_BACKGROUND_ALPHA = 140

          BLUR_PAD_Y_TOP = 8
          BLUR_PAD_Y_BOTTOM = 10

          BLUR_BAND_WIDTH_RATIO = 2 / 3
          BLUR_FEATHER_RATIO = 0.25

          BLUR_SIGMA = 9
          MIN_BOTTOM_GAP = 8
          MIN_BLUR_HEIGHT = 24
          MIN_FEATHER_PX = 6

          MIN_CHINESE_COUNT = 2
          MIN_BOX_WIDTH = 40
          MIN_BOX_HEIGHT = 8

          CUE_SIMILARITY_THRESHOLD = 0.5
          CUE_MERGE_MAX_GAP = 0.6

          GEMINI_MODEL = "gemini-2.5-flash"
          GEMINI_BATCH_SIZE = 100
          GEMINI_MAX_RETRIES = 10

          RAW_GEMINI_KEYS = os.environ.get("GEMINI_API_KEYS", "")
          GEMINI_API_KEYS = [k.strip() for k in RAW_GEMINI_KEYS.strip().splitlines() if k.strip()]

          SYSTEM_INSTRUCTION = (
              "You are a professional video subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context of the whole video.\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text.\n"
              "6. PRONOUN SAFETY (VERY IMPORTANT): The source is Chinese, where family/relationship terms "
              "(mother, older brother, uncle, etc.) are usually explicit in the dialogue itself. When translating "
              "to Vietnamese, ALWAYS use the correct relational pronoun based on the clear relationship stated or "
              "implied (mẹ/con, anh/em, cô/cháu, etc.) — never swap the roles.\n"
              "7. If the relationship between speaker and listener is AMBIGUOUS or CANNOT be determined from the "
              "given line alone, DO NOT guess a specific relational pronoun. Instead, rephrase the sentence to be "
              "SHORTER and more NEUTRAL — using no pronoun, an implied subject, or a generic/neutral phrasing — "
              "so the sentence still sounds natural in Vietnamese without committing to an incorrect relationship."
          )


          def log(msg):
              print(msg, flush=True)


          def probe_video():
              cmd = ["ffprobe", "-hide_banner", "-v", "error", "-select_streams", "v:0",
                     "-show_entries", "stream=width,height,r_frame_rate",
                     "-show_entries", "format=duration", "-of", "json", str(VIDEO)]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
              data = json.loads(result.stdout)
              stream = data["streams"][0]
              width, height = int(stream["width"]), int(stream["height"])
              a, b = stream["r_frame_rate"].split("/")
              fps = float(a) / float(b)
              duration = float(data["format"]["duration"])
              return width, height, fps, duration


          def get_frame(time_sec, width, height):
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-ss", str(time_sec),
                     "-i", str(VIDEO), "-frames:v", "1", "-f", "image2pipe", "-vcodec", "mjpeg", "-"]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0 or not result.stdout:
                  return None
              data = np.frombuffer(result.stdout, dtype=np.uint8)
              return cv2.imdecode(data, cv2.IMREAD_COLOR)


          log("Loading PaddleOCR")
          ocr = PaddleOCR(lang="ch")


          def ocr_image(image):
              result = ocr.predict(image)
              texts, boxes = [], []
              for page in result:
                  try:
                      data = page.json
                      if callable(data):
                          data = data()
                  except Exception as e:
                      log(f"page.json ERROR: {e!r}")
                      continue
                  if isinstance(data, str):
                      try:
                          data = json.loads(data)
                      except Exception:
                          data = None
                  if not isinstance(data, dict):
                      continue
                  if isinstance(data.get("res"), dict):
                      data = data["res"]
                  rec_texts = data.get("rec_texts", [])
                  rec_scores = data.get("rec_scores", [])
                  rec_polys = data.get("rec_polys", [])
                  for i, text in enumerate(rec_texts):
                      text = str(text).strip()
                      if not text:
                          continue
                      score = 1.0
                      if i < len(rec_scores):
                          try:
                              score = float(rec_scores[i])
                          except Exception:
                              pass
                      if score < 0.30 or i >= len(rec_polys):
                          continue
                      points = np.asarray(rec_polys[i])
                      if points.ndim != 2 or points.shape[1] != 2:
                          continue
                      x1, y1 = int(points[:, 0].min()), int(points[:, 1].min())
                      x2, y2 = int(points[:, 0].max()), int(points[:, 1].max())
                      texts.append(text)
                      boxes.append((x1, y1, x2, y2))
              return texts, boxes


          def chinese_count(text):
              return len(re.findall(r"[\u3400-\u9fff]", text))


          def find_subtitle_region():
              width, height, fps, duration = probe_video()
              log(f"VIDEO: {width}x{height} FPS={fps:.2f} Duration={duration:.2f}s")

              y0 = int(height * SCAN_Y_RATIO)
              max_scan = min(duration, 90)
              time_sec = 0

              while time_sec <= max_scan:
                  frame = get_frame(time_sec, width, height)
                  if frame is None:
                      time_sec += SCAN_SECONDS
                      continue

                  crop = frame[y0:height, 0:width]
                  texts, boxes = ocr_image(crop)
                  candidates = []
                  for text, box in zip(texts, boxes):
                      count = chinese_count(text)
                      if count < MIN_CHINESE_COUNT:
                          continue
                      x1, yy1, x2, yy2 = box
                      yy1 += y0
                      yy2 += y0
                      box_width, box_height = x2 - x1, yy2 - yy1
                      if box_width < MIN_BOX_WIDTH or box_height < MIN_BOX_HEIGHT:
                          continue
                      bottom_score = yy2 / height
                      score = box_width * count * (1 + bottom_score)
                      candidates.append((score, text, (x1, yy1, x2, yy2)))

                  if candidates:
                      candidates.sort(reverse=True)
                      score, text, box = candidates[0]
                      x1, y1, x2, y2 = box
                      padx = int(width * 0.01)
                      pady = int(height * 0.01)
                      x1 = max(0, x1 - padx)
                      y1 = max(0, y1 - pady)
                      x2 = min(width - 1, x2 + padx)
                      y2 = min(height - MIN_BOTTOM_GAP, y2 + pady)

                      region = {"x1": x1, "y1": y1, "x2": x2, "y2": y2, "width": width, "height": height,
                                "fps": fps, "found_at": time_sec, "sample_text": text}
                      log(f"INITIAL SUBTITLE REGION FOUND: {region}")
                      return region

                  time_sec += SCAN_SECONDS

              raise RuntimeError("Khong tim thay subtitle tieng Trung trong 90 giay dau.")


          def extract_subtitles(initial_region):
              width, height, fps, duration = probe_video()
              rx1, ry1, rx2, ry2 = (initial_region[k] for k in ("x1", "y1", "x2", "y2"))
              samples = max(1, int(duration * OCR_FPS))
              log(f"OCR FPS: {OCR_FPS} OCR samples: {samples}")

              cues = []
              previous_text = ""
              start_time = None
              subtitle_boxes = []

              for i in tqdm(range(samples), desc="OCR video"):
                  current_time = i / OCR_FPS
                  frame = get_frame(current_time, width, height)
                  if frame is None:
                      continue

                  crop = frame[ry1:ry2, rx1:rx2]
                  texts, boxes = ocr_image(crop)

                  valid = []
                  for text, box in zip(texts, boxes):
                      if chinese_count(text) < MIN_CHINESE_COUNT:
                          continue
                      x1, y1, x2, y2 = box
                      abs_x1, abs_y1, abs_x2, abs_y2 = x1 + rx1, y1 + ry1, x2 + rx1, y2 + ry1
                      if (abs_x2 - abs_x1) < MIN_BOX_WIDTH or (abs_y2 - abs_y1) < MIN_BOX_HEIGHT:
                          continue
                      valid.append((text, (abs_x1, abs_y1, abs_x2, abs_y2)))

                  valid.sort(key=lambda item: item[1][0])
                  text = re.sub(r"\s+", " ", " ".join(item[0] for item in valid)).strip()

                  if valid:
                      all_x1 = min(item[1][0] for item in valid)
                      all_y1 = min(item[1][1] for item in valid)
                      all_x2 = max(item[1][2] for item in valid)
                      all_y2 = max(item[1][3] for item in valid)
                      geometry = {"x1": all_x1, "y1": all_y1, "x2": all_x2, "y2": all_y2,
                                  "width": all_x2 - all_x1, "height": all_y2 - all_y1,
                                  "center_x": (all_x1 + all_x2) / 2, "center_y": (all_y1 + all_y2) / 2}
                      subtitle_boxes.append({"time": current_time, "text": text, "box": geometry})

                  if text != previous_text:
                      if previous_text and start_time is not None:
                          cues.append({"start": start_time, "end": current_time, "text": previous_text})
                      if text:
                          previous_text, start_time = text, current_time
                      else:
                          previous_text, start_time = "", None

              if previous_text and start_time is not None:
                  cues.append({"start": start_time, "end": duration, "text": previous_text})

              raw_cues = [c for c in cues if len(c["text"]) >= 2 and (c["end"] - c["start"]) >= 0.15]

              def text_similarity(a, b):
                  if not a or not b:
                      return 0.0
                  return SequenceMatcher(None, a, b).ratio()

              merge_groups = []
              for cue in raw_cues:
                  variant_span = cue["end"] - cue["start"]
                  if merge_groups:
                      group = merge_groups[-1]
                      gap = cue["start"] - group["end"]
                      best_variant = max(group["variants"].items(), key=lambda kv: kv[1])[0]
                      sim = text_similarity(cue["text"], best_variant)
                      if gap < CUE_MERGE_MAX_GAP and sim >= CUE_SIMILARITY_THRESHOLD:
                          group["end"] = cue["end"]
                          group["variants"][cue["text"]] = group["variants"].get(cue["text"], 0.0) + variant_span
                          continue
                  merge_groups.append({
                      "start": cue["start"], "end": cue["end"],
                      "variants": {cue["text"]: variant_span},
                  })

              cleaned = []
              for group in merge_groups:
                  canonical_text, _ = max(group["variants"].items(), key=lambda kv: kv[1])
                  cleaned.append({"start": group["start"], "end": group["end"], "text": canonical_text})

              log(f"Raw cues: {len(raw_cues)} -> Sau khi gop: {len(cleaned)}")

              half_step = SAMPLE_STEP / 2.0
              for cue in cleaned:
                  new_start = max(0.0, cue["start"] - half_step)
                  new_end = max(new_start + 0.05, cue["end"] - half_step)
                  cue["start"] = new_start
                  cue["end"] = min(duration, new_end)

              log(f"Subtitle cues: {len(cleaned)}")

              if not subtitle_boxes:
                  raise RuntimeError("Khong co geometry subtitle.")

              band_width = int(width * BLUR_BAND_WIDTH_RATIO)
              blur_x1 = int(width / 2 - band_width / 2)
              blur_x2 = blur_x1 + band_width

              heights_all = sorted(item["box"]["height"] for item in subtitle_boxes)
              text_height = heights_all[len(heights_all) // 2]

              blur_height = int(text_height + BLUR_PAD_Y_TOP + BLUR_PAD_Y_BOTTOM)
              blur_height = max(blur_height, MIN_BLUR_HEIGHT)

              centers_y = [item["box"]["center_y"] for item in subtitle_boxes]
              subtitle_center_y = float(np.median(centers_y))

              blur_y1 = int(subtitle_center_y - blur_height / 2)
              blur_y2 = blur_y1 + blur_height

              blur_x1 = max(0, blur_x1)
              blur_x2 = min(width, blur_x2)
              blur_y1 = max(0, blur_y1)

              if blur_y2 > height - MIN_BOTTOM_GAP:
                  shift_up = blur_y2 - (height - MIN_BOTTOM_GAP)
                  blur_y1 -= shift_up
                  blur_y2 -= shift_up

              blur_y1 = max(0, blur_y1)
              blur_y2 = min(height - MIN_BOTTOM_GAP, blur_y2)

              feather_px = int((blur_x2 - blur_x1) * BLUR_FEATHER_RATIO)
              feather_px = max(MIN_FEATHER_PX, feather_px)
              feather_px = min(feather_px, (blur_x2 - blur_x1) // 2, (blur_y2 - blur_y1) // 2)
              feather_px = max(MIN_FEATHER_PX, feather_px)

              final_region = {
                  "x1": int(blur_x1), "y1": int(blur_y1), "x2": int(blur_x2), "y2": int(blur_y2),
                  "width": width, "height": height, "fps": fps,
                  "found_at": initial_region["found_at"], "sample_text": initial_region["sample_text"],
                  "text_height": int(text_height),
                  "blur_width": int(blur_x2 - blur_x1), "blur_height": int(blur_y2 - blur_y1),
                  "bottom_gap": int(height - blur_y2),
                  "feather_px": int(feather_px),
              }

              log(f"FINAL BLUR REGION: {final_region}")

              output_cues = [{"start": c["start"], "end": c["end"], "text": c["text"]} for c in cleaned]
              return output_cues, final_region


          def save_srt(cues, path, field):
              subs = pysubs2.SSAFile()
              for cue in cues:
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=cue[field]))
              subs.save(str(path), encoding="utf-8")


          def get_random_gemini_client():
              key = random.choice(GEMINI_API_KEYS)
              return genai.Client(api_key=key), key


          def call_gemini_with_retry(prompt_text, max_retries=GEMINI_MAX_RETRIES):
              for attempt in range(max_retries):
                  wait = 6 * (2 ** attempt)
                  client, key = get_random_gemini_client()
                  key_idx = GEMINI_API_KEYS.index(key) + 1
                  log(f">> GUI GEMINI - Lan {attempt + 1}/{max_retries} | Key #{key_idx} | {time.strftime('%H:%M:%S')}")
                  try:
                      t_start = time.time()
                      response = client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=SYSTEM_INSTRUCTION,
                              temperature=0.3,
                          )
                      )
                      elapsed = time.time() - t_start
                      log(f"<< NHAN KET QUA - Thanh cong sau {elapsed:.1f}s")
                      return response.text
                  except Exception as e:
                      error_str = str(e)
                      log(f"<< LOI API: {error_str}")
                      if "503" in error_str or "429" in error_str or "UNAVAILABLE" in error_str or "500" in error_str:
                          log(f"   Server ban/qua tai/limit. Doi key va cho {wait}s...")
                          time.sleep(wait)
                      else:
                          log("   Loi khong the retry. Dung thu lai.")
                          break
              return None


          def parse_translated(response_text):
              translated_dict = {}
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          parts = line.split("]", 1)
                          idx_str = parts[0].replace("[", "").strip()
                          val = parts[1].strip()
                          if val == "...":
                              val = ""
                          translated_dict[int(idx_str)] = val
                      except Exception:
                          pass
              return translated_dict


          def translate_cues(cues):
              if not GEMINI_API_KEYS:
                  raise RuntimeError("Chua cau hinh GEMINI_API_KEYS trong GitHub Secrets.")

              total_lines = len(cues)
              total_batches = (total_lines + GEMINI_BATCH_SIZE - 1) // GEMINI_BATCH_SIZE
              log(f"BAT DAU DICH - {total_lines} dong / {total_batches} batch")

              results = []

              for i in range(0, total_lines, GEMINI_BATCH_SIZE):
                  batch = cues[i:i + GEMINI_BATCH_SIZE]
                  batch_num = (i // GEMINI_BATCH_SIZE) + 1
                  line_start = i + 1
                  line_end = min(i + GEMINI_BATCH_SIZE, total_lines)

                  log(f"[BATCH {batch_num}/{total_batches}] Dong {line_start}-{line_end} ({len(batch)} dong)")

                  prompt_text = ""
                  for idx, cue in enumerate(batch):
                      clean_text = cue["text"].strip() or "..."
                      prompt_text += f"[{idx}] {clean_text}\n"

                  log(">> NOI DUNG GUI LEN API:")
                  for line in prompt_text.strip().split("\n"):
                      log(f"   {line}")

                  response_text = call_gemini_with_retry(prompt_text)
                  if response_text is None:
                      raise RuntimeError(f"[THAT BAI] Khong the dich batch {batch_num} sau nhieu lan thu.")

                  log(">> KET QUA DICH TU AI:")
                  for line in response_text.strip().split("\n"):
                      log(f"   {line}")

                  translated_dict = parse_translated(response_text)

                  missing_indices = [idx for idx in range(len(batch)) if idx not in translated_dict or not translated_dict.get(idx)]
                  if missing_indices:
                      log(f">> CANH BAO: AI bo sot {len(missing_indices)} dong: {missing_indices}. Retry...")

                      retry_prompt = "You missed some lines in your previous translation. Please translate ONLY these missing lines:\n\n"
                      for idx in missing_indices:
                          clean_text = batch[idx]["text"].strip() or "..."
                          retry_prompt += f"[{idx}] {clean_text}\n"
                      retry_prompt += "\nOutput ONLY the missing lines with their exact [index] prefix."

                      retry_response = call_gemini_with_retry(retry_prompt)
                      if retry_response:
                          log(">> KET QUA RETRY:")
                          for line in retry_response.strip().split("\n"):
                              log(f"   {line}")
                          retry_dict = parse_translated(retry_response)
                          translated_dict.update(retry_dict)

                  fallback_count = 0
                  for idx, cue in enumerate(batch):
                      abs_line = i + idx + 1
                      if idx in translated_dict and translated_dict[idx]:
                          vi = translated_dict[idx]
                      else:
                          vi = cue["text"]
                          fallback_count += 1
                          log(f"   [{abs_line:04d}] FALLBACK (giu nguyen goc): {cue['text']!r}")
                      results.append({"start": cue["start"], "end": cue["end"], "text": cue["text"], "vi": vi})

                  if fallback_count > 0:
                      log(f">> Batch {batch_num}: {fallback_count} dong giu nguyen tieng Trung do AI bo sot.")

                  log(f"[BATCH {batch_num}/{total_batches}] Hoan thanh")
                  time.sleep(3)

              debug_path = WORK / "translation_debug.txt"
              with open(debug_path, "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh_len, vi_len = len(r["text"]), len(r["vi"])
                      flag = " [SUSPICIOUS]" if vi_len < zh_len * 0.6 else ""
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s{flag}\n")
                      f.write(f"  ZH ({zh_len}): {r['text']}\n")
                      f.write(f"  VI ({vi_len}): {r['vi']}\n\n")

              return results


          def create_feather_mask(region):
              width, height = region["width"], region["height"]
              x1, y1, x2, y2 = region["x1"], region["y1"], region["x2"], region["y2"]
              feather = region["feather_px"]

              crop_x1 = max(0, x1 - feather)
              crop_y1 = max(0, y1 - feather)
              crop_x2 = min(width, x2 + feather)
              crop_y2 = min(height, y2 + feather)

              crop_w = crop_x2 - crop_x1
              crop_h = crop_y2 - crop_y1

              mask = np.zeros((crop_h, crop_w), dtype=np.uint8)
              inner_x1 = x1 - crop_x1
              inner_y1 = y1 - crop_y1
              inner_x2 = x2 - crop_x1
              inner_y2 = y2 - crop_y1
              mask[inner_y1:inner_y2, inner_x1:inner_x2] = 255

              ksize = int(feather) * 2 + 1
              sigma = max(1.0, feather / 2.0)
              mask = cv2.GaussianBlur(mask, (ksize, ksize), sigma)

              mask_path = WORK / "blur_mask.png"
              cv2.imwrite(str(mask_path), mask)

              region["crop_x1"] = int(crop_x1)
              region["crop_y1"] = int(crop_y1)
              region["crop_x2"] = int(crop_x2)
              region["crop_y2"] = int(crop_y2)

              log(f"FEATHER MASK: crop=({crop_x1},{crop_y1})-({crop_x2},{crop_y2}) size={crop_w}x{crop_h} feather={feather}px")

              return mask_path


          def create_ass(cues, region):
              width = int(region["width"])
              height = int(region["height"])

              blur_x1 = int(region["x1"])
              blur_x2 = int(region["x2"])
              blur_y1 = int(region["y1"])
              blur_y2 = int(region["y2"])
              subtitle_x = (blur_x1 + blur_x2) // 2
              subtitle_y = (blur_y1 + blur_y2) // 2

              font_name = FONT_NAME
              log(f"SUBTITLE STYLE Font: {font_name} Size: {FONT_SIZE}")

              subs = pysubs2.SSAFile()
              subs.info["PlayResX"] = width
              subs.info["PlayResY"] = height
              subs.info["ScaledBorderAndShadow"] = "yes"

              style = pysubs2.SSAStyle()
              style.fontname = font_name
              style.fontsize = FONT_SIZE
              style.primarycolor = pysubs2.Color(255, 255, 255, 0)
              style.secondarycolor = pysubs2.Color(255, 255, 255, 0)
              style.outlinecolor = pysubs2.Color(0, 0, 0, 0)
              style.backcolor = pysubs2.Color(0, 0, 0, 255 - BOX_BACKGROUND_ALPHA) if BOX_BACKGROUND_ENABLED \
                  else pysubs2.Color(0, 0, 0, 0)
              style.borderstyle = 3 if BOX_BACKGROUND_ENABLED else 1
              style.outline = OUTLINE_SIZE
              style.shadow = SHADOW_SIZE
              style.alignment = 5
              style.marginl = 30
              style.marginr = 30
              style.marginv = 0
              subs.styles["Default"] = style

              for cue in cues:
                  text = (
                      "{\\an5"
                      f"\\pos({subtitle_x},{subtitle_y})"
                      f"\\fsp{LETTER_SPACING}"
                      "\\q2}"
                      + cue["vi"]
                  )
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=text))

              path = WORK / "vietnamese.ass"
              subs.save(str(path), encoding="utf-8")

              invalid = [ev for ev in subs.events if ev.end <= ev.start]
              log(f"ASS EVENTS WRITTEN: {len(subs.events)} (loi end<=start: {len(invalid)})")
              if len(subs.events) == 0:
                  raise RuntimeError("Khong co event nao duoc ghi vao file .ass.")
              if invalid:
                  raise RuntimeError(f"Co {len(invalid)} event end<=start.")

              return path


          def render_video(ass, region, mask_path):
              width, height = int(region["width"]), int(region["height"])
              cx1, cy1 = int(region["crop_x1"]), int(region["crop_y1"])
              cx2, cy2 = int(region["crop_x2"]), int(region["crop_y2"])
              cw, ch = cx2 - cx1, cy2 - cy1

              if cx1 < 0 or cy1 < 0 or cx2 > width or cy2 > height or cw <= 0 or ch <= 0:
                  raise RuntimeError(f"Invalid feather crop region: x1={cx1} y1={cy1} x2={cx2} y2={cy2}")

              log(f"FEATHER CROP REGION x={cx1} y={cy1} w={cw} h={ch} sigma={BLUR_SIGMA}")

              ass_path = str(ass).replace("\\", "/").replace(":", "\\:").replace("'", "\\'")
              mask_str = str(mask_path)

              video_filter = (
                  f"[0:v]format=yuv420p,split=2[base1][base2];"
                  f"[base1]crop=w={cw}:h={ch}:x={cx1}:y={cy1},"
                  f"boxblur=luma_radius={BLUR_SIGMA}:luma_power=1:chroma_radius={BLUR_SIGMA}:chroma_power=1,"
                  f"format=yuv420p[blur_crop];"
                  f"[1:v]format=gray,scale={cw}:{ch}[mask];"
                  f"[blur_crop][mask]alphamerge,format=yuva420p[blur_rgba];"
                  f"[base2][blur_rgba]overlay=x={cx1}:y={cy1}:format=yuv420[ov];"
                  f"[ov]ass='{ass_path}',format=yuv420p[vout]"
              )

              output = OUTPUT / "video_vi.mp4"
              if output.exists():
                  output.unlink()

              cmd = ["ffmpeg", "-hide_banner", "-y",
                     "-i", str(VIDEO),
                     "-loop", "1", "-i", mask_str,
                     "-filter_complex", video_filter,
                     "-map", "[vout]", "-map", "0:a?",
                     "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
                     "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k",
                     "-movflags", "+faststart", "-shortest", str(output)]
              subprocess.run(cmd, check=True)

              if not output.exists():
                  raise RuntimeError("FFmpeg khong tao duoc video output.")
              if output.stat().st_size < 10000:
                  raise RuntimeError("Output video bat thuong (file qua nho).")
              return output


          def main():
              if not VIDEO.exists():
                  raise RuntimeError(f"Video khong ton tai: {VIDEO}")

              initial_region = find_subtitle_region()
              cues, region = extract_subtitles(initial_region)
              if not cues:
                  raise RuntimeError("OCR khong tim thay subtitle.")

              mask_path = create_feather_mask(region)

              region_file = WORK / "subtitle_region.json"
              region_file.write_text(json.dumps(region, ensure_ascii=False, indent=2), encoding="utf-8")

              chinese_srt = WORK / "chinese.srt"
              save_srt(cues, chinese_srt, "text")

              translated = translate_cues(cues)

              vietnamese_srt = WORK / "vietnamese.srt"
              save_srt(translated, vietnamese_srt, "vi")

              ass = create_ass(translated, region)
              output = render_video(ass, region, mask_path)

              log("PROCESS COMPLETE")
              log(f"Video: {output}")
              log(f"Chinese SRT: {chinese_srt}")
              log(f"Vietnamese SRT: {vietnamese_srt}")
              log(f"Translation debug: {WORK / 'translation_debug.txt'}")
              log(f"Region: {region_file}")


          if __name__ == "__main__":
              main()
          PY

      - name: OCR → Translate → Render
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}
          FONT_NAME: ${{ env.FONT_FAMILY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          set -euo pipefail
          python process.py

      - name: Check output
        run: |
          set -e
          ls -lh output/
          ls -lh work/*.srt work/*.ass 2>/dev/null || true
          cat work/subtitle_region.json 2>/dev/null || true
          cat work/translation_debug.txt 2>/dev/null || true
          ffprobe -hide_banner -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/video_vi.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-vietnamese-result
          path: |
            output/video_vi.mp4
            work/chinese.srt
            work/vietnamese.srt
            work/vietnamese.ass
            work/subtitle_region.json
            work/translation_debug.txt
            work/blur_mask.png
          retention-days: 7

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
