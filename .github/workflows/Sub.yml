name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_seconds:
        description: "Khoảng cách quét để tìm frame subtitle đầu tiên"
        required: false
        default: "1"
        type: string

      ocr_fps:
        description: "FPS OCR. 2-3 là đủ cho subtitle thông thường"
        required: false
        default: "2"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # SYSTEM
      # --------------------------------------------------

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-core \
            libgl1 \
            libglib2.0-0


      # --------------------------------------------------
      # PYTHON PACKAGES
      # --------------------------------------------------

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt


      # --------------------------------------------------
      # CREATE DIRECTORIES
      # --------------------------------------------------

      - name: Prepare directories
        run: |
          mkdir -p work
          mkdir -p output


      # --------------------------------------------------
      # DOWNLOAD BILIBILI
      # --------------------------------------------------

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}

        run: |

          echo "Downloading:"
          echo "$BILIBILI_URL"

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            --format "bv*+ba/b" \
            --output "work/source.%(ext)s" \
            "$BILIBILI_URL"

          echo ""
          echo "Downloaded files:"
          ls -lh work/


      # --------------------------------------------------
      # PROCESS
      # --------------------------------------------------

      - name: OCR → Translate → Burn subtitle
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}

          PYTHONUNBUFFERED: "1"

          HF_HOME: "${{ github.workspace }}/work/huggingface"

        run: |

          python process.py


      # --------------------------------------------------
      # SHOW OUTPUT
      # --------------------------------------------------

      - name: Show output
        run: |

          echo "=============================="
          echo "OUTPUT"
          echo "=============================="

          ls -lh output/
          ls -lh work/*.srt 2>/dev/null || true


      # --------------------------------------------------
      # UPLOAD RESULT
      # --------------------------------------------------

      - name: Upload result
        uses: actions/upload-artifact@v4

        with:
          name: bilibili-vietnamese-result

          path: |
            output/video_vi.mp4
            work/chinese.srt
            work/vietnamese.srt
            work/subtitle_region.json

          retention-days: 7
