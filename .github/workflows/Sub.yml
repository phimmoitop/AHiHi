name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      # ---------- ASR ----------
      model_size:
        description: "faster-whisper model. medium = cân bằng tốt trên CPU runner; large-v3 chính xác nhất nhưng chậm hơn nhiều (video dài có thể chạm timeout)"
        required: false
        default: "medium"
        type: choice
        options:
          - "small"
          - "medium"
          - "large-v3"

      language:
        description: "Mã ngôn ngữ nguồn (zh = tiếng Trung). Để trống để tự nhận diện"
        required: false
        default: "zh"
        type: string

      beam_size:
        description: "Beam size khi decode. Tăng lên (8-10) cho kết quả ổn định hơn nhưng chậm hơn"
        required: false
        default: "5"
        type: string

      vad_min_silence_ms:
        description: "Silero VAD: khoảng lặng tối thiểu (ms) để coi là ranh giới giữa 2 đoạn thoại"
        required: false
        default: "300"
        type: string

      max_word_gap:
        description: "Khoảng lặng (giây) giữa 2 từ để buộc tách thành 2 câu sub. Giảm nếu 2 câu bị gộp, tăng nếu 1 câu bị tách vụn"
        required: false
        default: "0.45"
        type: string

      max_cue_duration:
        description: "Cue dài quá giá trị này (giây) sẽ bị ép tách tại khoảng lặng gần nhất"
        required: false
        default: "6.0"
        type: string

      speech_pad_seconds:
        description: "Nới thêm đầu/cuối mỗi cue (giây)"
        required: false
        default: "0.08"
        type: string

      min_cue_duration:
        description: "Loại bỏ cue ngắn hơn giá trị này (giây)"
        required: false
        default: "0.12"
        type: string

      # ---------- BLUR ----------
      # Vùng blur giờ CỐ ĐỊNH cho toàn bộ video (không dò theo từng thời điểm):
      # bề rộng luôn bằng 3/4 chiều rộng video (canh giữa), chỉ cần xác định
      # đúng vị trí trên/dưới theo 2 tỉ lệ bên dưới.
      sub_y1_ratio:
        description: "Mép trên vùng blur theo tỉ lệ chiều cao video (vị trí bắt đầu dòng sub cứng)"
        required: false
        default: "0.86"
        type: string

      sub_y2_ratio:
        description: "Mép dưới vùng blur theo tỉ lệ chiều cao video (vị trí kết thúc dòng sub cứng)"
        required: false
        default: "0.96"
        type: string

      # ---------- RENDER ----------
      font_size:
        description: "Cỡ chữ phụ đề tiếng Việt"
        required: false
        default: "35"
        type: string

      blur_sigma:
        description: "Độ mạnh blur che sub cứng cũ"
        required: false
        default: "9"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-core fonts-dejavu fonts-liberation libgl1 libglib2.0-0

      - name: Prepare custom subtitle font
        run: |
          set -euo pipefail
          mkdir -p work/fonts
          FONT_TTF="work/fonts/UVNLaXanh.ttf"
          FONT_URL_TTF="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.TTF"
          FONT_URL_WOFF2="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.woff2"

          if curl -fsSL "$FONT_URL_TTF" -o "$FONT_TTF" && [ -s "$FONT_TTF" ]; then
            echo "Tải TTF thành công."
          else
            rm -f "$FONT_TTF"
            TMP_WOFF2="work/fonts/UVNLaXanh.woff2"
            if curl -fsSL "$FONT_URL_WOFF2" -o "$TMP_WOFF2" && [ -s "$TMP_WOFF2" ]; then
              python -m pip install --quiet fonttools brotli
              python3 - <<'PYCONV'
          from fontTools.ttLib import TTFont
          src = "work/fonts/UVNLaXanh.woff2"
          dst = "work/fonts/UVNLaXanh.ttf"
          try:
              font = TTFont(src)
              font.flavor = None
              font.save(dst)
              print("Convert OK:", dst)
          except Exception as e:
              print("Convert failed:", repr(e))
          PYCONV
            else
              echo "Khong tai duoc font UVNLaXanh."
            fi
          fi

          if [ -f "$FONT_TTF" ] && [ -s "$FONT_TTF" ]; then
            mkdir -p "$HOME/.local/share/fonts"
            cp "$FONT_TTF" "$HOME/.local/share/fonts/"
            fc-cache -f "$HOME/.local/share/fonts" >/dev/null 2>&1 || true
            FONT_FAMILY="$(fc-scan --format '%{family[0]}\n' "$FONT_TTF" 2>/dev/null | head -1 | tr -d '\r')"
            [ -z "$FONT_FAMILY" ] && FONT_FAMILY="Arial"
          else
            FONT_FAMILY="Arial"
          fi

          echo "FONT_FAMILY=$FONT_FAMILY" >> "$GITHUB_ENV"
          echo "Font su dung: $FONT_FAMILY"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # Khong con PaddleOCR/PaddlePaddle. opencv chi dung de do vung blur (so pixel,
      # khong nhan dang chu).
      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            yt-dlp \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            pysubs2 \
            faster-whisper \
            google-genai

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work output

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::GitHub Secret BILIBILI_COOKIES chua duoc cau hinh."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          yt-dlp --cookies work/cookies.txt --no-playlist \
            --extractor-retries 5 --fragment-retries 5 --retries 5 --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b" \
            -S "res,codec:avc1:h264,ext:mp4:m4a" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::work/source.mp4 khong ton tai."
            find work -maxdepth 2 -type f -ls
            exit 1
          fi
          ls -lh work/

      - name: Extract audio track
        run: |
          set -eux
          ffmpeg -hide_banner -loglevel error -y \
            -i work/source.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le \
            work/audio.wav
          ls -lh work/audio.wav

      - name: Create processing script
        run: |
          cat > process.py <<'PY'
          """
          ALL-IN-ONE: video -> sub tieng Trung (tu AUDIO) -> dich -> xoa sub cung -> render.

          Toan bo pipeline khong dung OCR o bat ky buoc nao.

          1) ASR: faster-whisper (CTranslate2 port cua Whisper) voi Silero VAD
             (vad_filter=True) loc nhac nen/khoang cam, tra ve timestamp theo TUNG TU
             (word_timestamps=True). Text tieng Trung lay luon tu day, nen khong con
             loi nhan dang ky tu nhu OCR.
          2) Gom tu thanh cue: khong gop qua ranh gioi segment cua Whisper; trong 1
             segment thi tach tai khoang lang >= MAX_WORD_GAP, va ep tach neu cue dai
             qua MAX_CUE_DURATION (y tuong "regroup" giong stable-ts).
          3) Do vung sub cung de blur: dung chinh timing vua tao lam nhan. Lay N frame
             o GIUA cac cue (chac chan co sub cung) va N frame trong KHOANG LANG giua
             2 cue (chac chan khong co sub), roi voi moi pixel nua duoi khung hinh tinh
             tan suat "co net chu sang" cua nhom ON tru nhom OFF. Pixel nao chi sang
             khi co thoai -> do la vung chu. Khong can nhan dang chu.
          4) Dich tung batch bang Gemini, co retry + bat dong bi bo sot.
          5) Render: blur vung sub cung (co feather) roi burn phu de tieng Viet.

          Luu y: buoc 3 gia dinh sub cung xuat hien dung luc co thoai. Dung cho phim/
          drama Bilibili thong thuong.
          """

          import os, re, json, time, random, subprocess
          from pathlib import Path

          import cv2
          import numpy as np
          import pysubs2
          from faster_whisper import WhisperModel
          from google import genai
          from google.genai import types

          WORK = Path("work")
          OUTPUT = Path("output")
          VIDEO = WORK / "source.mp4"
          AUDIO = WORK / "audio.wav"

          def env_f(name, default):
              return float(os.environ.get(name, default) or default)

          def env_s(name, default):
              return (os.environ.get(name) or default).strip()

          # ---- ASR ----
          MODEL_SIZE = env_s("MODEL_SIZE", "medium")
          LANGUAGE = os.environ.get("LANGUAGE", "").strip() or None
          BEAM_SIZE = int(env_f("BEAM_SIZE", "5"))
          VAD_MIN_SILENCE_MS = int(env_f("VAD_MIN_SILENCE_MS", "300"))
          MAX_WORD_GAP = env_f("MAX_WORD_GAP", "0.45")
          MAX_CUE_DURATION = env_f("MAX_CUE_DURATION", "6.0")
          SPEECH_PAD_SECONDS = env_f("SPEECH_PAD_SECONDS", "0.08")
          MIN_CUE_DURATION = env_f("MIN_CUE_DURATION", "0.12")
          CPU_THREADS = max(1, os.cpu_count() or 4)

          # ---- BLUR ----
          # Vung blur co dinh cho toan bo video: rong = 3/4 chieu rong video (canh giua),
          # vi tri tren/duoi lay theo SUB_Y1_RATIO / SUB_Y2_RATIO. Khong con do/sample gi ca.
          BLUR_X_RATIO = 0.75
          SUB_Y1_RATIO = env_f("SUB_Y1_RATIO", "0.86")
          SUB_Y2_RATIO = env_f("SUB_Y2_RATIO", "0.96")
          MIN_BOTTOM_GAP = 8
          MIN_BLUR_HEIGHT = 24
          BLUR_FEATHER_RATIO = 0.25
          MIN_FEATHER_PX = 6
          BLUR_SIGMA = int(env_f("BLUR_SIGMA", "9"))

          # ---- STYLE ----
          FONT_NAME = env_s("FONT_NAME", "Arial")
          FONT_SIZE = int(env_f("FONT_SIZE", "40"))
          LETTER_SPACING = -1
          OUTLINE_SIZE = 1
          SHADOW_SIZE = 0
          BOX_BACKGROUND_ENABLED = True
          BOX_BACKGROUND_ALPHA = 140

          # ---- GEMINI ----
          GEMINI_MODEL = "gemini-2.5-flash"
          GEMINI_BATCH_SIZE = 100
          GEMINI_MAX_RETRIES = 10
          RAW_GEMINI_KEYS = os.environ.get("GEMINI_API_KEYS", "")
          GEMINI_API_KEYS = [k.strip() for k in RAW_GEMINI_KEYS.strip().splitlines() if k.strip()]

          SYSTEM_INSTRUCTION = (
              "You are a professional video subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context of the whole video.\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text.\n"
              "6. PRONOUN SAFETY (VERY IMPORTANT): The source is Chinese, where family/relationship terms "
              "(mother, older brother, uncle, etc.) are usually explicit in the dialogue itself. When translating "
              "to Vietnamese, ALWAYS use the correct relational pronoun based on the clear relationship stated or "
              "implied (mẹ/con, anh/em, cô/cháu, etc.) — never swap the roles.\n"
              "7. If the relationship between speaker and listener is AMBIGUOUS or CANNOT be determined from the "
              "given line alone, DO NOT guess a specific relational pronoun. Instead, rephrase the sentence to be "
              "SHORTER and more NEUTRAL — using no pronoun, an implied subject, or a generic/neutral phrasing — "
              "so the sentence still sounds natural in Vietnamese without committing to an incorrect relationship."
          )


          def log(msg):
              print(msg, flush=True)


          def probe_video():
              cmd = ["ffprobe", "-hide_banner", "-v", "error", "-select_streams", "v:0",
                     "-show_entries", "stream=width,height,r_frame_rate",
                     "-show_entries", "format=duration", "-of", "json", str(VIDEO)]
              r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
              data = json.loads(r.stdout)
              st = data["streams"][0]
              a, b = st["r_frame_rate"].split("/")
              return (int(st["width"]), int(st["height"]),
                      float(a) / float(b), float(data["format"]["duration"]))


          # ============================================================
          # BUOC 1-2: ASR -> CUE TIENG TRUNG
          # ============================================================
          def transcribe():
              log(f"Loading faster-whisper model={MODEL_SIZE} (cpu_threads={CPU_THREADS})")
              model = WhisperModel(MODEL_SIZE, device="cpu", compute_type="int8", cpu_threads=CPU_THREADS)

              log(f"Transcribing (language={LANGUAGE or 'auto'}, beam_size={BEAM_SIZE}) ...")
              segments, info = model.transcribe(
                  str(AUDIO),
                  language=LANGUAGE,
                  beam_size=BEAM_SIZE,
                  word_timestamps=True,
                  vad_filter=True,
                  vad_parameters=dict(min_silence_duration_ms=VAD_MIN_SILENCE_MS),
                  condition_on_previous_text=False,
              )
              log(f"Detected language={info.language} (p={info.language_probability:.3f})")

              words = []
              for seg in segments:
                  seg_words = list(seg.words or [])
                  if not seg_words:
                      words.append({"start": float(seg.start), "end": float(seg.end),
                                    "text": seg.text.strip(), "seg": float(seg.start)})
                      continue
                  for w in seg_words:
                      words.append({"start": float(w.start), "end": float(w.end),
                                    "text": str(w.word).strip(), "seg": float(seg.start)})

              log(f"ASR words = {len(words)}")
              return words


          def group_words(words):
              cues, current, prev = [], None, None

              def flush():
                  nonlocal current
                  if current and current["words"]:
                      cues.append(current)
                  current = None

              for w in words:
                  gap = (w["start"] - prev["end"]) if prev else None
                  new_seg = prev is not None and w["seg"] != prev["seg"]

                  start_new = current is None or new_seg
                  if not start_new and gap is not None and gap >= MAX_WORD_GAP:
                      start_new = True
                  if (not start_new and current
                          and (w["end"] - current["start"]) > MAX_CUE_DURATION
                          and gap is not None and gap > 0.02):
                      start_new = True

                  if start_new:
                      flush()
                      current = {"start": w["start"], "end": w["end"], "words": [w]}
                  else:
                      current["end"] = w["end"]
                      current["words"].append(w)
                  prev = w

              flush()
              return cues


          def finalize_cues(grouped, duration):
              padded = []
              for c in grouped:
                  st = max(0.0, c["start"] - SPEECH_PAD_SECONDS)
                  en = min(duration, c["end"] + SPEECH_PAD_SECONDS)
                  text = re.sub(r"\s+", "", "".join(w["text"] for w in c["words"])).strip()
                  if text:
                      padded.append({"start": st, "end": en, "text": text})

              padded.sort(key=lambda c: (c["start"], c["end"]))
              final = []
              for c in padded:
                  st, en = c["start"], c["end"]
                  if final and st < final[-1]["end"]:
                      mid = (st + final[-1]["end"]) / 2.0
                      final[-1]["end"] = mid
                      st = mid
                  if en - st < MIN_CUE_DURATION:
                      continue
                  final.append({"start": st, "end": en, "text": c["text"]})

              log(f"CHINESE CUES = {len(final)}")
              if not final:
                  raise RuntimeError("ASR khong tao duoc cue nao.")
              return final


          # ============================================================
          # BUOC 3: VUNG BLUR CO DINH (khong dò, ap dung cho toan bo video)
          # ============================================================
          def build_blur_region(width, height):
              band_w = int(width * BLUR_X_RATIO)
              x1 = int(width / 2 - band_w / 2)
              x2 = x1 + band_w
              y1 = int(height * SUB_Y1_RATIO)
              y2 = int(height * SUB_Y2_RATIO)

              x1 = max(0, x1); x2 = min(width, x2)
              y1 = max(0, y1); y2 = min(height - MIN_BOTTOM_GAP, y2)
              if y2 - y1 < MIN_BLUR_HEIGHT:
                  y2 = min(height - MIN_BOTTOM_GAP, y1 + MIN_BLUR_HEIGHT)
              if (x2 - x1) % 2:
                  x2 -= 1
              if (y2 - y1) % 2:
                  y2 -= 1

              feather = max(MIN_FEATHER_PX, int((x2 - x1) * BLUR_FEATHER_RATIO))
              feather = min(feather, (x2 - x1) // 2, (y2 - y1) // 2)
              feather = max(MIN_FEATHER_PX, feather)

              region = {
                  "source": "fixed",
                  "x1": int(x1), "y1": int(y1), "x2": int(x2), "y2": int(y2),
                  "width": int(width), "height": int(height),
                  "blur_width": int(x2 - x1), "blur_height": int(y2 - y1),
                  "bottom_gap": int(height - y2), "feather_px": int(feather),
              }
              log(f"FIXED BLUR REGION (toan bo video): {region}")
              return region


          def create_feather_mask(region):
              width, height = region["width"], region["height"]
              x1, y1, x2, y2 = region["x1"], region["y1"], region["x2"], region["y2"]
              feather = region["feather_px"]

              cx1 = max(0, x1 - feather); cy1 = max(0, y1 - feather)
              cx2 = min(width, x2 + feather); cy2 = min(height, y2 + feather)
              if (cx2 - cx1) % 2:
                  cx2 -= 1
              if (cy2 - cy1) % 2:
                  cy2 -= 1

              cw, ch = cx2 - cx1, cy2 - cy1
              if cw <= 0 or ch <= 0:
                  raise RuntimeError(f"Invalid mask size: {cw}x{ch}")

              mask = np.zeros((ch, cw), dtype=np.uint8)
              mask[max(0, y1 - cy1):min(ch, y2 - cy1), max(0, x1 - cx1):min(cw, x2 - cx1)] = 255
              mask = cv2.GaussianBlur(mask, (feather * 2 + 1, feather * 2 + 1), max(1.0, feather / 2.0))

              mask_path = WORK / "blur_mask.png"
              if not cv2.imwrite(str(mask_path), mask):
                  raise RuntimeError("Khong ghi duoc blur_mask.png")

              region.update({"crop_x1": int(cx1), "crop_y1": int(cy1),
                             "crop_x2": int(cx2), "crop_y2": int(cy2)})
              log(f"FEATHER MASK: crop=({cx1},{cy1})-({cx2},{cy2}) size={cw}x{ch} feather={feather}px")
              return mask_path


          # ============================================================
          # BUOC 4: DICH
          # ============================================================
          def get_random_gemini_client():
              key = random.choice(GEMINI_API_KEYS)
              return genai.Client(api_key=key), key


          def call_gemini_with_retry(prompt_text, max_retries=GEMINI_MAX_RETRIES):
              for attempt in range(max_retries):
                  wait = 6 * (2 ** attempt)
                  client, key = get_random_gemini_client()
                  log(f">> GUI GEMINI - Lan {attempt + 1}/{max_retries} | Key #{GEMINI_API_KEYS.index(key) + 1} | {time.strftime('%H:%M:%S')}")
                  try:
                      t0 = time.time()
                      response = client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=SYSTEM_INSTRUCTION,
                              temperature=0.3,
                          )
                      )
                      log(f"<< NHAN KET QUA - Thanh cong sau {time.time() - t0:.1f}s")
                      return response.text
                  except Exception as e:
                      err = str(e)
                      log(f"<< LOI API: {err}")
                      if any(c in err for c in ("503", "429", "500", "UNAVAILABLE")):
                          log(f"   Server ban/qua tai/limit. Doi key va cho {wait}s...")
                          time.sleep(wait)
                      else:
                          log("   Loi khong the retry. Dung thu lai.")
                          break
              return None


          def parse_translated(response_text):
              out = {}
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          head, val = line.split("]", 1)
                          val = val.strip()
                          out[int(head.replace("[", "").strip())] = "" if val == "..." else val
                      except Exception:
                          pass
              return out


          def translate_cues(cues):
              if not GEMINI_API_KEYS:
                  raise RuntimeError("Chua cau hinh GEMINI_API_KEYS trong GitHub Secrets.")

              total = len(cues)
              total_batches = (total + GEMINI_BATCH_SIZE - 1) // GEMINI_BATCH_SIZE
              log(f"BAT DAU DICH - {total} dong / {total_batches} batch")

              results = []
              for i in range(0, total, GEMINI_BATCH_SIZE):
                  batch = cues[i:i + GEMINI_BATCH_SIZE]
                  bn = i // GEMINI_BATCH_SIZE + 1
                  log(f"[BATCH {bn}/{total_batches}] Dong {i + 1}-{min(i + GEMINI_BATCH_SIZE, total)}")

                  prompt_text = "".join(f"[{idx}] {c['text'].strip() or '...'}\n" for idx, c in enumerate(batch))
                  log(">> NOI DUNG GUI LEN API:")
                  for line in prompt_text.strip().split("\n"):
                      log(f"   {line}")

                  response_text = call_gemini_with_retry(prompt_text)
                  if response_text is None:
                      raise RuntimeError(f"[THAT BAI] Khong the dich batch {bn}.")

                  log(">> KET QUA DICH TU AI:")
                  for line in response_text.strip().split("\n"):
                      log(f"   {line}")

                  translated = parse_translated(response_text)

                  missing = [idx for idx in range(len(batch)) if not translated.get(idx)]
                  if missing:
                      log(f">> CANH BAO: AI bo sot {len(missing)} dong: {missing}. Retry...")
                      rp = "You missed some lines in your previous translation. Please translate ONLY these missing lines:\n\n"
                      rp += "".join(f"[{idx}] {batch[idx]['text'].strip() or '...'}\n" for idx in missing)
                      rp += "\nOutput ONLY the missing lines with their exact [index] prefix."
                      rr = call_gemini_with_retry(rp)
                      if rr:
                          log(">> KET QUA RETRY:")
                          for line in rr.strip().split("\n"):
                              log(f"   {line}")
                          translated.update(parse_translated(rr))

                  fallback = 0
                  for idx, cue in enumerate(batch):
                      if translated.get(idx):
                          vi = translated[idx]
                      else:
                          vi = cue["text"]
                          fallback += 1
                          log(f"   [{i + idx + 1:04d}] FALLBACK (giu nguyen goc): {cue['text']!r}")
                      results.append({"start": cue["start"], "end": cue["end"],
                                      "text": cue["text"], "vi": vi})

                  if fallback:
                      log(f">> Batch {bn}: {fallback} dong giu nguyen tieng Trung.")
                  log(f"[BATCH {bn}/{total_batches}] Hoan thanh")
                  time.sleep(3)

              with open(WORK / "translation_debug.txt", "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh, vi = len(r["text"]), len(r["vi"])
                      flag = " [SUSPICIOUS]" if vi < zh * 0.6 else ""
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s{flag}\n")
                      f.write(f"  ZH ({zh}): {r['text']}\n")
                      f.write(f"  VI ({vi}): {r['vi']}\n\n")

              return results


          # ============================================================
          # BUOC 5: ASS + RENDER
          # ============================================================
          def save_srt(cues, path, field):
              subs = pysubs2.SSAFile()
              for c in cues:
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(c["start"] * 1000), end=int(c["end"] * 1000), text=c[field]))
              subs.save(str(path), encoding="utf-8")


          def create_ass(cues, region):
              width, height = int(region["width"]), int(region["height"])
              sx = (int(region["x1"]) + int(region["x2"])) // 2
              sy = (int(region["y1"]) + int(region["y2"])) // 2
              log(f"SUBTITLE STYLE Font: {FONT_NAME} Size: {FONT_SIZE} Pos: ({sx},{sy})")

              subs = pysubs2.SSAFile()
              subs.info["PlayResX"] = width
              subs.info["PlayResY"] = height
              subs.info["ScaledBorderAndShadow"] = "yes"

              style = pysubs2.SSAStyle()
              style.fontname = FONT_NAME
              style.fontsize = FONT_SIZE
              style.primarycolor = pysubs2.Color(255, 255, 255, 0)
              style.secondarycolor = pysubs2.Color(255, 255, 255, 0)
              style.outlinecolor = pysubs2.Color(0, 0, 0, 0)
              style.backcolor = pysubs2.Color(0, 0, 0, 255 - BOX_BACKGROUND_ALPHA) if BOX_BACKGROUND_ENABLED \
                  else pysubs2.Color(0, 0, 0, 0)
              style.borderstyle = 3 if BOX_BACKGROUND_ENABLED else 1
              style.outline = OUTLINE_SIZE
              style.shadow = SHADOW_SIZE
              style.alignment = 5
              style.marginl = 30
              style.marginr = 30
              style.marginv = 0
              subs.styles["Default"] = style

              for c in cues:
                  text = ("{\\an5" f"\\pos({sx},{sy})" f"\\fsp{LETTER_SPACING}" "\\q2}") + c["vi"]
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(c["start"] * 1000), end=int(c["end"] * 1000), text=text))

              path = WORK / "vietnamese.ass"
              subs.save(str(path), encoding="utf-8")

              invalid = [ev for ev in subs.events if ev.end <= ev.start]
              log(f"ASS EVENTS WRITTEN: {len(subs.events)} (loi end<=start: {len(invalid)})")
              if not subs.events:
                  raise RuntimeError("Khong co event nao trong file .ass.")
              if invalid:
                  raise RuntimeError(f"Co {len(invalid)} event end<=start.")
              return path


          def render_video(ass, region, mask_path):
              width, height = int(region["width"]), int(region["height"])
              cx1, cy1 = int(region["crop_x1"]), int(region["crop_y1"])
              cx2, cy2 = int(region["crop_x2"]), int(region["crop_y2"])
              cw, ch = cx2 - cx1, cy2 - cy1

              if cx1 < 0 or cy1 < 0 or cx2 > width or cy2 > height or cw <= 0 or ch <= 0:
                  raise RuntimeError(f"Invalid feather crop region: {cx1},{cy1} -> {cx2},{cy2}")
              if cw % 2 or ch % 2:
                  raise RuntimeError(f"Crop size must be even for yuv420p: {cw}x{ch}")

              mask_img = cv2.imread(str(mask_path), cv2.IMREAD_GRAYSCALE)
              if mask_img is None:
                  raise RuntimeError(f"Cannot read mask: {mask_path}")
              mh, mw = mask_img.shape[:2]
              log(f"RENDER CROP: {cw}x{ch} | MASK: {mw}x{mh}")
              if mw != cw or mh != ch:
                  log(f"WARNING: Resize mask {mw}x{mh} -> {cw}x{ch}")
                  cv2.imwrite(str(mask_path), cv2.resize(mask_img, (cw, ch), interpolation=cv2.INTER_NEAREST))

              ass_path = str(ass).replace("\\", "/").replace(":", "\\:").replace("'", "\\'")

              video_filter = (
                  f"[0:v]format=yuv420p,split=2[base1][base2];"
                  f"[base1]crop=w={cw}:h={ch}:x={cx1}:y={cy1},"
                  f"boxblur=luma_radius={BLUR_SIGMA}:luma_power=1:chroma_radius={BLUR_SIGMA}:chroma_power=1,"
                  f"format=yuv420p,setsar=1[blur_crop];"
                  f"[1:v]format=gray,scale=w={cw}:h={ch}:flags=neighbor,setsar=1[mask];"
                  f"[blur_crop][mask]alphamerge,format=yuva420p[blur_rgba];"
                  f"[base2][blur_rgba]overlay=x={cx1}:y={cy1}:format=yuv420[ov];"
                  f"[ov]ass='{ass_path}',format=yuv420p[vout]"
              )

              output = OUTPUT / "video_vi.mp4"
              if output.exists():
                  output.unlink()

              subprocess.run([
                  "ffmpeg", "-hide_banner", "-y",
                  "-i", str(VIDEO),
                  "-loop", "1", "-i", str(mask_path),
                  "-filter_complex", video_filter,
                  "-map", "[vout]", "-map", "0:a?",
                  "-c:v", "libx264", "-preset", "fast", "-crf", "21",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-movflags", "+faststart",
                  "-shortest", str(output)
              ], check=True)

              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError("Output video bat thuong.")
              return output


          def main():
              if not VIDEO.exists():
                  raise RuntimeError(f"Video khong ton tai: {VIDEO}")
              if not AUDIO.exists():
                  raise RuntimeError(f"Audio khong ton tai: {AUDIO}")

              width, height, fps, duration = probe_video()
              log(f"VIDEO: {width}x{height} FPS={fps:.2f} Duration={duration:.2f}s")

              # 1-2. ASR -> cue tieng Trung
              cues = finalize_cues(group_words(transcribe()), duration)
              save_srt(cues, WORK / "chinese.srt", "text")
              for i, c in enumerate(cues, 1):
                  log("[%04d] %.3f -> %.3f | %s" % (i, c["start"], c["end"], c["text"]))

              # 3. Vung blur (co dinh, khong can dò)
              region = build_blur_region(width, height)
              mask_path = create_feather_mask(region)
              (WORK / "subtitle_region.json").write_text(
                  json.dumps(region, ensure_ascii=False, indent=2), encoding="utf-8")

              # 4. Dich
              translated = translate_cues(cues)
              save_srt(translated, WORK / "vietnamese.srt", "vi")

              # 5. Render
              ass = create_ass(translated, region)
              output = render_video(ass, region, mask_path)

              log("PROCESS COMPLETE")
              log(f"Video        : {output}")
              log(f"Chinese SRT  : {WORK / 'chinese.srt'}")
              log(f"Vietnamese   : {WORK / 'vietnamese.srt'}")


          if __name__ == "__main__":
              main()
          PY

      - name: ASR → Translate → Render
        env:
          MODEL_SIZE: ${{ inputs.model_size }}
          LANGUAGE: ${{ inputs.language }}
          BEAM_SIZE: ${{ inputs.beam_size }}
          VAD_MIN_SILENCE_MS: ${{ inputs.vad_min_silence_ms }}
          MAX_WORD_GAP: ${{ inputs.max_word_gap }}
          MAX_CUE_DURATION: ${{ inputs.max_cue_duration }}
          SPEECH_PAD_SECONDS: ${{ inputs.speech_pad_seconds }}
          MIN_CUE_DURATION: ${{ inputs.min_cue_duration }}
          SUB_Y1_RATIO: ${{ inputs.sub_y1_ratio }}
          SUB_Y2_RATIO: ${{ inputs.sub_y2_ratio }}
          FONT_SIZE: ${{ inputs.font_size }}
          BLUR_SIGMA: ${{ inputs.blur_sigma }}
          FONT_NAME: ${{ env.FONT_FAMILY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          python process.py

      - name: Check output
        run: |
          set -e
          ls -lh output/
          cat work/subtitle_region.json || true
          echo "===== CHINESE SRT (head) ====="
          head -40 work/chinese.srt || true
          ffprobe -hide_banner -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/video_vi.mp4

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-vietnamese-result
          path: |
            output/video_vi.mp4
            work/chinese.srt
            work/vietnamese.srt
            work/vietnamese.ass
            work/subtitle_region.json
            work/translation_debug.txt
            work/blur_mask.png
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
