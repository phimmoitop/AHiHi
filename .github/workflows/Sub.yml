name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string
      scan_seconds:
        description: "Interval tìm subtitle ban đầu (giây)"
        required: false
        default: "1"
        type: string
      ocr_fps:
        description: "FPS OCR, 2-4 cho timing chuẩn hơn"
        required: false
        default: "2"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      HF_HOME: "${{ github.workspace }}/work/huggingface"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-core fonts-dejavu libgl1 libglib2.0-0
          echo "AVAILABLE FONTS"
          fc-list | grep -Ei "Oward|Noto Sans CJK|DejaVu Sans" | head -30 || true

      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install yt-dlp numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow tqdm pysubs2 sentencepiece safetensors torch==2.4.1 transformers==4.47.1
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.3.2

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work output
          pwd
          ls -la

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::GitHub Secret BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt
          wc -l work/cookies.txt

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          echo "URL: $BILIBILI_URL"
          yt-dlp --version
          yt-dlp --cookies work/cookies.txt --no-playlist --extractor-retries 5 --fragment-retries 5 --retries 5 --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"
          ls -lh work/

      - name: Inspect video
        run: |
          set -e
          VIDEO="work/source.mp4"
          if [ ! -f "$VIDEO" ]; then
            echo "source.mp4 not found."
            find work -maxdepth 1 -type f -printf '%p\n'
            exit 1
          fi
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration -of default=noprint_wrappers=1 "$VIDEO"

      - name: Create processing script
        run: |
          cat > process.py <<'PY'
          import os, re, json, subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm
          from paddleocr import PaddleOCR
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM

          # ============================== CONFIG ==============================
          WORK = Path("work")
          OUTPUT = Path("output")
          VIDEO = WORK / "source.mp4"
          MODEL_NAME = "Helsinki-NLP/opus-mt-zh-vi"

          SCAN_SECONDS = float(os.environ.get("SCAN_SECONDS", "1"))
          OCR_FPS = float(os.environ.get("OCR_FPS", "2"))
          SAMPLE_STEP = 1.0 / OCR_FPS

          # ------------------------------------------------------------
          # Vùng quét tìm subtitle gốc ban đầu.
          #
          # Chỉ quét 1/4 chiều cao DƯỚI CÙNG của video (0.75 -> 1.0),
          # tránh bắt nhầm chữ/logo nằm ở phía trên khung hình.
          # ------------------------------------------------------------
          SCAN_Y_RATIO = 0.75

          # Subtitle style (chữ Việt)
          FONT_SIZE = 30
          LETTER_SPACING = -1
          OUTLINE_SIZE = 1
          SHADOW_SIZE = 0

          # Khung nền bán trong suốt phía sau chữ, đảm bảo tương phản dù
          # nền video sau khi làm mờ sáng/tối/nhiều màu ra sao (chữ trắng
          # viền mỏng RẤT dễ chìm vào nền sáng, khiến tưởng như sub bị
          # mất dù thực ra vẫn render). BOX_BACKGROUND_ALPHA: 0=trong suốt
          # hoàn toàn, 255=đen đặc hoàn toàn (khuyến nghị 120-180).
          BOX_BACKGROUND_ENABLED = True
          BOX_BACKGROUND_ALPHA = 140

          # ------------------------------------------------------------
          # BLUR CONFIG
          #
          # Chiều rộng vùng blur giờ CỐ ĐỊNH = 2/3 chiều rộng video,
          # LUÔN CĂN GIỮA khung hình theo phương ngang, áp dụng chung
          # cho toàn bộ video (không tính theo OCR/từng cue nữa).
          # Viền 2 bên của vùng blur được làm MỜ DẦN (feather) thay vì
          # cắt cứng, để chuyển tiếp mượt hơn với phần ảnh gốc.
          #
          # Chiều cao blur vẫn tính từ dữ liệu OCR thực tế (chiều cao
          # chữ trung bình + vị trí trung tâm), vì đây là thứ camera
          # ghi nhận được chính xác theo video, không cần cố định.
          # ------------------------------------------------------------
          BLUR_PAD_Y_TOP = 8
          BLUR_PAD_Y_BOTTOM = 10

          BLUR_BAND_WIDTH_RATIO = 2 / 3   # chiều rộng vùng blur = 2/3 chiều rộng video, cố định
          BLUR_FEATHER_RATIO = 0.25       # tỉ lệ (trên chiều rộng band) làm mờ dần ở mỗi bên mép

          BLUR_SIGMA = 9
          MIN_BOTTOM_GAP = 8
          MIN_BLUR_HEIGHT = 24

          MIN_CHINESE_COUNT = 2
          MIN_BOX_WIDTH = 40
          MIN_BOX_HEIGHT = 8

          # ------------------------------------------------------------
          # GỘP CUE THEO ĐỘ TƯƠNG ĐỒNG (chống OCR đọc lệch giữa các frame
          # của CÙNG MỘT dòng sub, ví dụ "知天上公雀" / "不知天上公雀" /
          # "下知天上公雀" chỉ lệch 1 ký tự do OCR nhận nhầm).
          #
          # Nếu 2 cue liền kề (khoảng cách < CUE_MERGE_MAX_GAP) có độ
          # tương đồng text >= CUE_SIMILARITY_THRESHOLD -> coi là cùng
          # 1 dòng sub, gộp lại. Text cuối cùng chọn theo biến thể có
          # TỔNG THỜI LƯỢNG xuất hiện nhiều nhất (majority vote theo
          # duration), không phải bản đọc cuối cùng.
          # ------------------------------------------------------------
          CUE_SIMILARITY_THRESHOLD = 0.5
          CUE_MERGE_MAX_GAP = 0.6


          # ============================== FFPROBE ==============================
          def probe_video():
              cmd = ["ffprobe", "-hide_banner", "-v", "error", "-select_streams", "v:0",
                     "-show_entries", "stream=width,height,r_frame_rate",
                     "-show_entries", "format=duration", "-of", "json", str(VIDEO)]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
              data = json.loads(result.stdout)
              stream = data["streams"][0]
              width, height = int(stream["width"]), int(stream["height"])
              a, b = stream["r_frame_rate"].split("/")
              fps = float(a) / float(b)
              duration = float(data["format"]["duration"])
              return width, height, fps, duration


          # ============================== DECODE FRAME ==============================
          def get_frame(time_sec, width, height):
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-ss", str(time_sec),
                     "-i", str(VIDEO), "-frames:v", "1", "-f", "image2pipe", "-vcodec", "mjpeg", "-"]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0 or not result.stdout:
                  return None
              data = np.frombuffer(result.stdout, dtype=np.uint8)
              return cv2.imdecode(data, cv2.IMREAD_COLOR)


          # ============================== OCR INIT ==============================
          print("\n==========================================")
          print("Loading PaddleOCR")
          print("==========================================\n")
          ocr = PaddleOCR(lang="ch")


          # ============================== OCR IMAGE ==============================
          def ocr_image(image):
              result = ocr.predict(image)
              texts, boxes = [], []
              for page in result:
                  try:
                      data = page.json
                      if callable(data):
                          data = data()
                  except Exception as e:
                      print("page.json ERROR:", repr(e))
                      continue
                  if isinstance(data, str):
                      try:
                          data = json.loads(data)
                      except Exception:
                          data = None
                  if not isinstance(data, dict):
                      continue
                  if isinstance(data.get("res"), dict):
                      data = data["res"]
                  rec_texts = data.get("rec_texts", [])
                  rec_scores = data.get("rec_scores", [])
                  rec_polys = data.get("rec_polys", [])
                  for i, text in enumerate(rec_texts):
                      text = str(text).strip()
                      if not text:
                          continue
                      score = 1.0
                      if i < len(rec_scores):
                          try:
                              score = float(rec_scores[i])
                          except Exception:
                              pass
                      if score < 0.30 or i >= len(rec_polys):
                          continue
                      points = np.asarray(rec_polys[i])
                      if points.ndim != 2 or points.shape[1] != 2:
                          continue
                      x1, y1 = int(points[:, 0].min()), int(points[:, 1].min())
                      x2, y2 = int(points[:, 0].max()), int(points[:, 1].max())
                      texts.append(text)
                      boxes.append((x1, y1, x2, y2))
              return texts, boxes


          # ============================== CHINESE TEXT TEST ==============================
          def chinese_count(text):
              return len(re.findall(r"[\u3400-\u9fff]", text))


          # ============================== FIND INITIAL SUBTITLE REGION ==============================
          def find_subtitle_region():
              width, height, fps, duration = probe_video()
              print(f"\nVIDEO: {width}x{height}  FPS={fps:.2f}  Duration={duration:.2f}s\n")

              # Chỉ quét 1/4 chiều cao dưới cùng của video.
              y0 = int(height * SCAN_Y_RATIO)
              max_scan = min(duration, 90)
              time_sec = 0

              while time_sec <= max_scan:
                  print(f"Scanning {time_sec:.1f}s")
                  frame = get_frame(time_sec, width, height)
                  if frame is None:
                      time_sec += SCAN_SECONDS
                      continue

                  crop = frame[y0:height, 0:width]
                  texts, boxes = ocr_image(crop)
                  candidates = []
                  for text, box in zip(texts, boxes):
                      count = chinese_count(text)
                      if count < MIN_CHINESE_COUNT:
                          continue
                      x1, yy1, x2, yy2 = box
                      yy1 += y0
                      yy2 += y0
                      box_width, box_height = x2 - x1, yy2 - yy1
                      if box_width < MIN_BOX_WIDTH or box_height < MIN_BOX_HEIGHT:
                          continue
                      bottom_score = yy2 / height
                      score = box_width * count * (1 + bottom_score)
                      candidates.append((score, text, (x1, yy1, x2, yy2)))

                  if candidates:
                      candidates.sort(reverse=True)
                      score, text, box = candidates[0]
                      x1, y1, x2, y2 = box
                      # Padding rất nhỏ ở bước tìm vùng ban đầu.
                      # Vùng blur thật sẽ được tính lại sau khi OCR cả video.
                      padx = int(width * 0.01)
                      pady = int(height * 0.01)
                      x1 = max(0, x1 - padx)
                      y1 = max(0, y1 - pady)
                      x2 = min(width - 1, x2 + padx)
                      y2 = min(height - MIN_BOTTOM_GAP, y2 + pady)

                      region = {"x1": x1, "y1": y1, "x2": x2, "y2": y2, "width": width, "height": height,
                                "fps": fps, "found_at": time_sec, "sample_text": text}
                      print(f"\nINITIAL SUBTITLE REGION FOUND\nText: {text}\nRegion: {region}\n")
                      return region

                  time_sec += SCAN_SECONDS

              raise RuntimeError("Không tìm thấy subtitle tiếng Trung trong 90 giây đầu.")


          # ============================== OCR WHOLE VIDEO ==============================
          def extract_subtitles(initial_region):
              width, height, fps, duration = probe_video()
              rx1, ry1, rx2, ry2 = (initial_region[k] for k in ("x1", "y1", "x2", "y2"))
              samples = max(1, int(duration * OCR_FPS))
              print(f"\nOCR FPS: {OCR_FPS}  OCR samples: {samples}\n")

              cues = []
              previous_text = ""
              start_time = None
              subtitle_boxes = []  # {"time","text","box"}

              for i in tqdm(range(samples), desc="OCR video"):
                  current_time = i / OCR_FPS
                  frame = get_frame(current_time, width, height)
                  if frame is None:
                      continue

                  crop = frame[ry1:ry2, rx1:rx2]
                  texts, boxes = ocr_image(crop)

                  valid = []
                  for text, box in zip(texts, boxes):
                      if chinese_count(text) < MIN_CHINESE_COUNT:
                          continue
                      x1, y1, x2, y2 = box
                      abs_x1, abs_y1, abs_x2, abs_y2 = x1 + rx1, y1 + ry1, x2 + rx1, y2 + ry1
                      if (abs_x2 - abs_x1) < MIN_BOX_WIDTH or (abs_y2 - abs_y1) < MIN_BOX_HEIGHT:
                          continue
                      valid.append((text, (abs_x1, abs_y1, abs_x2, abs_y2)))

                  valid.sort(key=lambda item: item[1][0])
                  text = re.sub(r"\s+", " ", " ".join(item[0] for item in valid)).strip()

                  if valid:
                      all_x1 = min(item[1][0] for item in valid)
                      all_y1 = min(item[1][1] for item in valid)
                      all_x2 = max(item[1][2] for item in valid)
                      all_y2 = max(item[1][3] for item in valid)
                      geometry = {"x1": all_x1, "y1": all_y1, "x2": all_x2, "y2": all_y2,
                                  "width": all_x2 - all_x1, "height": all_y2 - all_y1,
                                  "center_x": (all_x1 + all_x2) / 2, "center_y": (all_y1 + all_y2) / 2}
                      subtitle_boxes.append({"time": current_time, "text": text, "box": geometry})

                  if text != previous_text:
                      if previous_text and start_time is not None:
                          cues.append({"start": start_time, "end": current_time, "text": previous_text})
                      if text:
                          previous_text, start_time = text, current_time
                      else:
                          previous_text, start_time = "", None

              if previous_text and start_time is not None:
                  cues.append({"start": start_time, "end": duration, "text": previous_text})

              # Cleanup cơ bản (bỏ cue quá ngắn / quá ít ký tự)
              raw_cues = [c for c in cues if len(c["text"]) >= 2 and (c["end"] - c["start"]) >= 0.15]

              # --------------------------------------------------------------
              # GỘP CUE THEO ĐỘ TƯƠNG ĐỒNG
              #
              # cue liền kề (gap nhỏ) có text gần giống nhau -> rất có thể là
              # CÙNG một dòng sub, chỉ khác nhau do OCR đọc lệch giữa các
              # frame. Gộp lại và chọn biến thể xuất hiện lâu nhất làm text
              # chính thức, thay vì để mỗi biến thể tạo ra 1 cue riêng rồi
              # dịch trùng nhiều lần.
              # --------------------------------------------------------------
              def text_similarity(a, b):
                  if not a or not b:
                      return 0.0
                  return SequenceMatcher(None, a, b).ratio()

              merge_groups = []  # mỗi phần tử: {"start","end","variants": {text: total_duration}}
              for cue in raw_cues:
                  duration = cue["end"] - cue["start"]
                  if merge_groups:
                      group = merge_groups[-1]
                      gap = cue["start"] - group["end"]
                      best_variant = max(group["variants"].items(), key=lambda kv: kv[1])[0]
                      sim = text_similarity(cue["text"], best_variant)
                      if gap < CUE_MERGE_MAX_GAP and sim >= CUE_SIMILARITY_THRESHOLD:
                          group["end"] = cue["end"]
                          group["variants"][cue["text"]] = group["variants"].get(cue["text"], 0.0) + duration
                          continue
                  merge_groups.append({
                      "start": cue["start"], "end": cue["end"],
                      "variants": {cue["text"]: duration},
                  })

              cleaned = []
              for group in merge_groups:
                  canonical_text, _ = max(group["variants"].items(), key=lambda kv: kv[1])
                  cleaned.append({"start": group["start"], "end": group["end"], "text": canonical_text})
                  if len(group["variants"]) > 1:
                      variants_str = ", ".join(f"{t!r}({d:.1f}s)" for t, d in
                                                sorted(group["variants"].items(), key=lambda kv: -kv[1]))
                      print(f"[MERGE] {group['start']:.2f}s-{group['end']:.2f}s -> chọn {canonical_text!r} "
                            f"trong số các biến thể OCR: {variants_str}")

              print(f"\nRaw cues (trước khi gộp): {len(raw_cues)}  ->  Sau khi gộp theo độ tương đồng: {len(cleaned)}\n")

              # --------------------------------------------------------------
              # BÙ TRỄ TIMING
              #
              # Vì lấy mẫu OCR mỗi SAMPLE_STEP giây, một subtitle chỉ được
              # phát hiện SAU khi nó đã thực sự xuất hiện (trễ tối đa 1 step).
              # Lùi cả start/end lại nửa bước lấy mẫu để bù trung bình,
              # giúp thời gian hiển thị khớp thực tế hơn.
              # --------------------------------------------------------------
              half_step = SAMPLE_STEP / 2.0
              for cue in cleaned:
                  new_start = max(0.0, cue["start"] - half_step)
                  new_end = max(new_start + 0.05, cue["end"] - half_step)
                  cue["start"] = new_start
                  cue["end"] = min(duration, new_end)

              print(f"\nSubtitle cues: {len(cleaned)}")
              print(f"Timing compensation: -{half_step:.3f}s (half of {SAMPLE_STEP:.3f}s sample step)\n")

              if not subtitle_boxes:
                  raise RuntimeError("Không có geometry subtitle.")

              # --------------------------------------------------------------
              # VÙNG BLUR CỐ ĐỊNH THEO CHIỀU NGANG
              #
              # Không tính theo OCR/từng cue nữa. Chiều rộng = 2/3 chiều
              # rộng video, LUÔN căn giữa khung hình, dùng chung cho toàn
              # bộ video. Viền 2 bên sẽ được làm mờ dần (feather) ở bước
              # render, xem BLUR_FEATHER_RATIO.
              # --------------------------------------------------------------
              band_width = int(width * BLUR_BAND_WIDTH_RATIO)
              blur_x1 = int(width / 2 - band_width / 2)
              blur_x2 = blur_x1 + band_width
              print(f"BLUR BAND (cố định): {BLUR_BAND_WIDTH_RATIO * 100:.0f}% chiều rộng video = {band_width}px, "
                    f"căn giữa khung hình -> x1={blur_x1} x2={blur_x2}\n")

              # --------------------------------------------------------------
              # CHIỀU CAO / VỊ TRÍ DỌC: vẫn lấy từ dữ liệu OCR thực tế
              # (median chiều cao chữ + vị trí trung tâm trên toàn bộ
              # observation), vì đây là thông tin camera ghi nhận chính
              # xác theo video, không cần/không nên cố định.
              # --------------------------------------------------------------
              heights_all = sorted(item["box"]["height"] for item in subtitle_boxes)
              text_height = heights_all[len(heights_all) // 2]

              blur_height = int(text_height + BLUR_PAD_Y_TOP + BLUR_PAD_Y_BOTTOM)
              blur_height = max(blur_height, MIN_BLUR_HEIGHT)

              centers_y = [item["box"]["center_y"] for item in subtitle_boxes]
              subtitle_center_y = float(np.median(centers_y))

              blur_y1 = int(subtitle_center_y - blur_height / 2)
              blur_y2 = blur_y1 + blur_height

              # --------------------------------------------------------------
              # Clamp
              # --------------------------------------------------------------
              blur_x1 = max(0, blur_x1)
              blur_x2 = min(width, blur_x2)
              blur_y1 = max(0, blur_y1)

              if blur_y2 > height - MIN_BOTTOM_GAP:
                  shift_up = blur_y2 - (height - MIN_BOTTOM_GAP)
                  blur_y1 -= shift_up
                  blur_y2 -= shift_up

              blur_y1 = max(0, blur_y1)
              blur_y2 = min(height - MIN_BOTTOM_GAP, blur_y2)

              feather_px = max(1, int((blur_x2 - blur_x1) * BLUR_FEATHER_RATIO))

              final_region = {
                  "x1": int(blur_x1), "y1": int(blur_y1), "x2": int(blur_x2), "y2": int(blur_y2),
                  "width": width, "height": height, "fps": fps,
                  "found_at": initial_region["found_at"], "sample_text": initial_region["sample_text"],
                  "text_height": int(text_height),
                  "blur_width": int(blur_x2 - blur_x1), "blur_height": int(blur_y2 - blur_y1),
                  "bottom_gap": int(height - blur_y2),
                  "feather_px": feather_px,
              }

              print("\nFINAL BLUR REGION")
              print(f"x1={blur_x1} y1={blur_y1} x2={blur_x2} y2={blur_y2}")
              print(f"Blur width={blur_x2 - blur_x1}  Blur height={blur_y2 - blur_y1}  (text_height={text_height})")
              print(f"Feather={feather_px}px mỗi bên  Bottom gap={height - blur_y2}px\n")

              # trả về cue sạch (bỏ field tạm _x1/_x2/_height)
              output_cues = [{"start": c["start"], "end": c["end"], "text": c["text"]} for c in cleaned]
              return output_cues, final_region


          # ============================== SAVE SRT ==============================
          def save_srt(cues, path, field):
              subs = pysubs2.SSAFile()
              for cue in cues:
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=cue[field]))
              subs.save(str(path), encoding="utf-8")


          # ============================== TRANSLATION ==============================
          def translate_cues(cues):
              print(f"\nLoading translation model: {MODEL_NAME}\n")
              tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)
              model = AutoModelForSeq2SeqLM.from_pretrained(MODEL_NAME)
              model.eval()

              results = []
              batch_size = 8
              import torch
              for offset in tqdm(range(0, len(cues), batch_size), desc="Translate"):
                  batch = cues[offset:offset + batch_size]
                  texts = [x["text"] for x in batch]
                  inputs = tokenizer(texts, return_tensors="pt", padding=True, truncation=True, max_length=256)
                  with torch.no_grad():
                      output = model.generate(**inputs, max_length=256, num_beams=4)
                  translations = tokenizer.batch_decode(output, skip_special_tokens=True)
                  for idx, (cue, vi) in enumerate(zip(batch, translations), start=offset):
                      vi = vi.strip() or cue["text"]
                      results.append({"start": cue["start"], "end": cue["end"], "text": cue["text"], "vi": vi})

                      # ---------------------------------------------------------
                      # DEBUG: in ra từng dòng gốc (ZH) và dịch (VI) để đối chiếu
                      # trực tiếp trong log của step "OCR → Translate → Render".
                      # Đánh dấu ⚠ SUSPICIOUS khi câu Việt ngắn bất thường so với
                      # câu Hán gốc (dấu hiệu model dịch bị cụt/degenerate output).
                      # ---------------------------------------------------------
                      zh_len, vi_len = len(cue["text"]), len(vi)
                      flag = "  ⚠ SUSPICIOUS (VI quá ngắn so với ZH)" if vi_len < zh_len * 0.6 else ""
                      print(f"[{idx:03d}] {cue['start']:.2f}s-{cue['end']:.2f}s | "
                            f"ZH({zh_len}): {cue['text']!r}  ->  VI({vi_len}): {vi!r}{flag}")

              # Ghi file debug đầy đủ để tải về xem lại sau khi workflow chạy xong
              debug_path = WORK / "translation_debug.txt"
              with open(debug_path, "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh_len, vi_len = len(r["text"]), len(r["vi"])
                      flag = " [SUSPICIOUS]" if vi_len < zh_len * 0.6 else ""
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s{flag}\n")
                      f.write(f"  ZH ({zh_len} ky tu): {r['text']}\n")
                      f.write(f"  VI ({vi_len} ky tu): {r['vi']}\n\n")

              return results


          # ============================== FIND FONT ==============================
          def find_font():
              candidates = ["Oward", "Oward.ttf", "Oward.otf", "Noto Sans CJK SC", "Noto Sans CJK TC", "Noto Sans CJK"]
              for candidate in candidates:
                  try:
                      result = subprocess.run(["fc-match", "-f", "%{family}\\n", candidate],
                                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      family = result.stdout.strip()
                      if family and "Oward" in family:
                          print("Font selected:", family)
                          return family
                  except Exception:
                      pass
              print("Oward not found. Using Noto Sans CJK SC.")
              return "Noto Sans CJK SC"


          # ============================== CREATE ASS ==============================
          def create_ass(cues, region):
              width = int(region["width"])
              height = int(region["height"])

              # ------------------------------------------------------------
              # Neo sub Việt vào ĐÚNG TÂM (giữa-giữa) của vùng blur, theo
              # cả 2 hướng ngang và dọc, thay vì chỉ bám đáy như trước.
              # ------------------------------------------------------------
              blur_x1 = int(region["x1"])
              blur_x2 = int(region["x2"])
              blur_y1 = int(region["y1"])
              blur_y2 = int(region["y2"])
              subtitle_x = (blur_x1 + blur_x2) // 2
              subtitle_y = (blur_y1 + blur_y2) // 2

              font_name = find_font()
              print(f"\nSUBTITLE STYLE\nFont: {font_name}  Size: {FONT_SIZE}  Spacing: {LETTER_SPACING}  Outline: {OUTLINE_SIZE}")
              print(f"Subtitle anchor (center of blur box): x={subtitle_x} y={subtitle_y}  "
                    f"(blur box: x1={blur_x1} y1={blur_y1} x2={blur_x2} y2={blur_y2})\n")

              subs = pysubs2.SSAFile()

              # ----------------------------------------------------------
              # QUAN TRỌNG:
              #
              # Phải khai báo PlayResX/PlayResY khớp với độ phân giải
              # video thật. Nếu không, libass sẽ dùng độ phân giải mặc
              # định (thường 384x288) để quy đổi toạ độ \pos(), khiến
              # subtitle bị đẩy lệch hẳn ra ngoài khung hình -> KHÔNG
              # HIỆN. Đây chính là lý do sub Việt bị mất ở bản trước.
              # ----------------------------------------------------------
              subs.info["PlayResX"] = width
              subs.info["PlayResY"] = height
              subs.info["ScaledBorderAndShadow"] = "yes"

              style = pysubs2.SSAStyle()
              style.fontname = font_name
              style.fontsize = FONT_SIZE
              style.primarycolor = pysubs2.Color(255, 255, 255, 0)
              style.secondarycolor = pysubs2.Color(255, 255, 255, 0)
              style.outlinecolor = pysubs2.Color(0, 0, 0, 0)
              # ------------------------------------------------------------
              # AN TOÀN HIỂN THỊ: dùng BorderStyle=3 (khung nền, thay vì
              # chỉ viền outline mỏng) với nền đen bán trong suốt phía sau
              # chữ. Việc này đảm bảo chữ LUÔN đọc được dù nền video sau
              # khi làm mờ là màu sáng/nhạt (chữ trắng viền mỏng rất dễ bị
              # "chìm" vào nền sáng, khiến trông như sub bị mất dù thực ra
              # vẫn render). Đổi BOX_BACKGROUND_ENABLED = False bên dưới
              # nếu muốn quay lại kiểu chỉ có outline như trước.
              # ------------------------------------------------------------
              style.backcolor = pysubs2.Color(0, 0, 0, 255 - BOX_BACKGROUND_ALPHA) if BOX_BACKGROUND_ENABLED \
                  else pysubs2.Color(0, 0, 0, 0)
              style.borderstyle = 3 if BOX_BACKGROUND_ENABLED else 1
              style.outline = OUTLINE_SIZE
              style.shadow = SHADOW_SIZE
              style.alignment = 5  # middle-center (giữa-giữa)
              style.marginl = 30
              style.marginr = 30
              style.marginv = 0
              subs.styles["Default"] = style

              for cue in cues:
                  # \an5 + \pos() neo chữ vào ĐÚNG TÂM vùng blur (cả ngang lẫn dọc).
                  text = (
                      "{\\an5"
                      f"\\pos({subtitle_x},{subtitle_y})"
                      f"\\fsp{LETTER_SPACING}"
                      "\\q2}"
                      + cue["vi"]
                  )
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=text))

              path = WORK / "vietnamese.ass"
              subs.save(str(path), encoding="utf-8")

              # ------------------------------------------------------------
              # DEBUG: in số lượng event thực tế đã ghi + vài dòng mẫu, để
              # nếu sub vẫn không hiện thì biết ngay là do DỮ LIỆU (cues
              # rỗng/text rỗng) hay do PHẦN RENDER (dữ liệu có nhưng ffmpeg/
              # libass không vẽ ra được).
              # ------------------------------------------------------------
              print(f"\nASS EVENTS WRITTEN: {len(subs.events)}")
              for ev in subs.events[:3]:
                  print(f"  {ev.start}ms -> {ev.end}ms : {ev.text}")
              if len(subs.events) == 0:
                  raise RuntimeError("KHÔNG có event nào được ghi vào file .ass — cues rỗng, kiểm tra lại bước dịch.")

              return path


          # ============================== RENDER ==============================
          def render_video(ass, region):
              width, height = int(region["width"]), int(region["height"])
              x1, y1, x2, y2 = int(region["x1"]), int(region["y1"]), int(region["x2"]), int(region["y2"])
              w, h = x2 - x1, y2 - y1

              if x1 < 0 or y1 < 0 or x2 > width or y2 > height or w <= 0 or h <= 0:
                  raise RuntimeError(f"Invalid blur region: x1={x1} y1={y1} x2={x2} y2={y2}")

              print(f"\nBLUR REGION  x={x1} y={y1} w={w} h={h}  bottom_gap={height - y2}px  sigma={BLUR_SIGMA}\n")

              ass_path = str(ass).replace("\\", "/").replace(":", "\\:").replace("'", "\\'")

              # format=yuv420p ở đầu, sau boxblur, sau overlay và sau ass
              # để tránh lỗi "Failed to inject frame into filter network"
              # do pixel format không khớp giữa các nhánh split.
              video_filter = (
                  f"format=yuv420p,split=2[main][blur];"
                  f"[blur]crop=w={w}:h={h}:x={x1}:y={y1},"
                  f"boxblur=luma_radius={BLUR_SIGMA}:luma_power=1:chroma_radius={BLUR_SIGMA}:chroma_power=1,"
                  f"format=yuv420p[blurred];"
                  f"[main][blurred]overlay=x={x1}:y={y1}:format=yuv420:eof_action=pass[ov];"
                  f"[ov]ass='{ass_path}',format=yuv420p[vout]"
              )

              output = OUTPUT / "video_vi.mp4"
              if output.exists():
                  output.unlink()

              print("\nRendering final video\n")
              cmd = ["ffmpeg", "-hide_banner", "-y", "-i", str(VIDEO), "-filter_complex", video_filter,
                     "-map", "[vout]", "-map", "0:a?", "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
                     "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", str(output)]
              subprocess.run(cmd, check=True)

              if not output.exists():
                  raise RuntimeError("FFmpeg không tạo được video output.")
              if output.stat().st_size < 10000:
                  raise RuntimeError("Output video bất thường (file quá nhỏ).")
              return output


          # ============================== MAIN ==============================
          def main():
              if not VIDEO.exists():
                  raise RuntimeError(f"Video không tồn tại: {VIDEO}")

              initial_region = find_subtitle_region()
              cues, region = extract_subtitles(initial_region)
              if not cues:
                  raise RuntimeError("OCR không tìm thấy subtitle.")

              region_file = WORK / "subtitle_region.json"
              region_file.write_text(json.dumps(region, ensure_ascii=False, indent=2), encoding="utf-8")

              chinese_srt = WORK / "chinese.srt"
              save_srt(cues, chinese_srt, "text")

              translated = translate_cues(cues)

              vietnamese_srt = WORK / "vietnamese.srt"
              save_srt(translated, vietnamese_srt, "vi")

              ass = create_ass(translated, region)
              output = render_video(ass, region)

              print("\nPROCESS COMPLETE")
              print(f"Video: {output}")
              print(f"Chinese SRT: {chinese_srt}")
              print(f"Vietnamese SRT: {vietnamese_srt}")
              print(f"Translation debug: {WORK / 'translation_debug.txt'}")
              print(f"Region: {region_file}\n")
              print("FINAL REGION:")
              print(json.dumps(region, ensure_ascii=False, indent=2))


          if __name__ == "__main__":
              main()
          PY

      - name: OCR → Translate → Render
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}
          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          set -euo pipefail
          python process.py

      - name: Check output
        run: |
          set -e
          ls -lh output/
          echo "Subtitles:"
          ls -lh work/*.srt work/*.ass 2>/dev/null || true
          echo "Subtitle region:"
          cat work/subtitle_region.json 2>/dev/null || true
          echo "Translation debug (ZH vs VI, per line):"
          cat work/translation_debug.txt 2>/dev/null || true
          echo "Final video information:"
          ffprobe -hide_banner -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/video_vi.mp4

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-vietnamese-result
          path: |
            output/video_vi.mp4
            work/chinese.srt
            work/vietnamese.srt
            work/vietnamese.ass
            work/subtitle_region.json
            work/translation_debug.txt
          retention-days: 7

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
