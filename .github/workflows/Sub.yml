name: Bilibili → Vietnamese

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL (phải đúng video đã dùng để tạo file SRT)"
        required: true
        type: string

      srt_file:
        description: "Đường dẫn file SRT tiếng Trung đã có sẵn trong repo (kết quả từ workflow trích xuất timing/ASR)"
        required: false
        default: "chinese.srt"
        type: string

      blur_mode:
        description: "auto = tự dò vùng sub cứng bằng cách so sánh frame LÚC CÓ SUB với frame LÚC KHÔNG CÓ SUB (dựa vào chính timing trong SRT, không cần OCR). manual = dùng 4 giá trị tỉ lệ bên dưới"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "manual"

      manual_x_ratio:
        description: "manual: bề rộng vùng blur theo tỉ lệ chiều rộng video (vd 0.70 = 70%, canh giữa)"
        required: false
        default: "0.70"
        type: string

      manual_y1_ratio:
        description: "manual: mép trên vùng blur theo tỉ lệ chiều cao video"
        required: false
        default: "0.86"
        type: string

      manual_y2_ratio:
        description: "manual: mép dưới vùng blur theo tỉ lệ chiều cao video"
        required: false
        default: "0.96"
        type: string

      detect_samples:
        description: "auto: số frame lấy mẫu cho mỗi nhóm (có sub / không sub). Tăng lên nếu dò vùng chưa chuẩn, nhưng chậm hơn"
        required: false
        default: "40"
        type: string

      font_size:
        description: "Cỡ chữ phụ đề tiếng Việt"
        required: false
        default: "40"
        type: string

      blur_sigma:
        description: "Độ mạnh của blur che sub cứng cũ"
        required: false
        default: "9"
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-core fonts-dejavu fonts-liberation libgl1 libglib2.0-0

      - name: Prepare custom subtitle font
        run: |
          set -euo pipefail
          mkdir -p work/fonts
          FONT_TTF="work/fonts/UVNLaXanh.ttf"
          FONT_URL_TTF="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.TTF"
          FONT_URL_WOFF2="https://raw.githubusercontent.com/phimmoitop/AHiHi/main/UVNLaXanh.woff2"

          if curl -fsSL "$FONT_URL_TTF" -o "$FONT_TTF" && [ -s "$FONT_TTF" ]; then
            echo "Tải TTF thành công."
          else
            rm -f "$FONT_TTF"
            TMP_WOFF2="work/fonts/UVNLaXanh.woff2"
            if curl -fsSL "$FONT_URL_WOFF2" -o "$TMP_WOFF2" && [ -s "$TMP_WOFF2" ]; then
              python -m pip install --quiet fonttools brotli
              python3 - <<'PYCONV'
          from fontTools.ttLib import TTFont
          src = "work/fonts/UVNLaXanh.woff2"
          dst = "work/fonts/UVNLaXanh.ttf"
          try:
              font = TTFont(src)
              font.flavor = None
              font.save(dst)
              print("Convert OK:", dst)
          except Exception as e:
              print("Convert failed:", repr(e))
          PYCONV
            else
              echo "Khong tai duoc font UVNLaXanh."
            fi
          fi

          if [ -f "$FONT_TTF" ] && [ -s "$FONT_TTF" ]; then
            mkdir -p "$HOME/.local/share/fonts"
            cp "$FONT_TTF" "$HOME/.local/share/fonts/"
            fc-cache -f "$HOME/.local/share/fonts" >/dev/null 2>&1 || true
            FONT_FAMILY="$(fc-scan --format '%{family[0]}\n' "$FONT_TTF" 2>/dev/null | head -1 | tr -d '\r')"
            if [ -z "$FONT_FAMILY" ]; then
              FONT_FAMILY="Arial"
            fi
          else
            FONT_FAMILY="Arial"
          fi

          echo "FONT_FAMILY=$FONT_FAMILY" >> "$GITHUB_ENV"
          echo "Font su dung: $FONT_FAMILY"

      # PaddleOCR/PaddlePaddle đã được bỏ hoàn toàn: không còn bước OCR nào.
      # Chỉ giữ opencv cho bước dò vùng blur (so sánh pixel, không nhận dạng chữ).
      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install yt-dlp numpy==1.26.4 opencv-python-headless==4.10.0.84 tqdm pysubs2 google-genai

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work output

      - name: Verify source SRT exists
        env:
          SRT_FILE: ${{ inputs.srt_file }}
        run: |
          set -euo pipefail
          if [ ! -s "$SRT_FILE" ]; then
            echo "::error::Khong tim thay file SRT: $SRT_FILE"
            ls -la
            exit 1
          fi
          echo "Dung SRT: $SRT_FILE"
          head -40 "$SRT_FILE"

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::GitHub Secret BILIBILI_COOKIES chua duoc cau hinh."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          yt-dlp --cookies work/cookies.txt --no-playlist --extractor-retries 5 --fragment-retries 5 --retries 5 --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"
          ls -lh work/

      - name: Create processing script
        run: |
          cat > process.py <<'PY'
          """
          SRT -> Vietnamese video.

          Khac voi ban cu: KHONG con OCR. Timing va text tieng Trung lay truc tiep
          tu file SRT da co san (ket qua cua workflow trich xuat timing/ASR), nen:
            - khong can PaddleOCR/PaddlePaddle (tiet kiem rat nhieu thoi gian cai dat
              va thoi gian chay),
            - text dua di dich la text ban da xac nhan la chuan, khong bi loi OCR,
            - timing khong bi lam tron theo OCR_FPS nua.

          Van de con lai: ban cu suy ra vung blur (de xoa sub cung) tu bounding box
          cua OCR. Khong co OCR thi phai xac dinh vung do bang cach khac. O day dung
          chinh timing trong SRT lam "nhan":
            - lay N frame tai giua cac cue  -> chac chan CO sub cung tren man hinh,
            - lay N frame trong cac khoang trong giua 2 cue -> chac chan KHONG co sub,
            - voi moi pixel o nua duoi khung hinh, do tan suat no "sang/co net chu"
              trong nhom CO sub tru tan suat trong nhom KHONG co sub.
          Pixel nao chi sang khi co sub -> do chinh la vung chu. Cach nay khong can
          nhan dang chu, chi can biet luc nao sub bat/tat, ma dieu do SRT da cho san.
          """

          import os, re, json, time, random, subprocess
          from pathlib import Path

          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm
          from google import genai
          from google.genai import types

          WORK = Path("work")
          OUTPUT = Path("output")
          VIDEO = WORK / "source.mp4"

          SRT_FILE = Path(os.environ.get("SRT_FILE", "chinese.srt"))
          BLUR_MODE = os.environ.get("BLUR_MODE", "auto").strip().lower()
          MANUAL_X_RATIO = float(os.environ.get("MANUAL_X_RATIO", "0.70"))
          MANUAL_Y1_RATIO = float(os.environ.get("MANUAL_Y1_RATIO", "0.86"))
          MANUAL_Y2_RATIO = float(os.environ.get("MANUAL_Y2_RATIO", "0.96"))
          DETECT_SAMPLES = int(float(os.environ.get("DETECT_SAMPLES", "40")))
          FONT_NAME = os.environ.get("FONT_NAME", "Arial")
          FONT_SIZE = int(float(os.environ.get("FONT_SIZE", "40")))
          BLUR_SIGMA = int(float(os.environ.get("BLUR_SIGMA", "9")))

          LETTER_SPACING = -1
          OUTLINE_SIZE = 1
          SHADOW_SIZE = 0
          BOX_BACKGROUND_ENABLED = True
          BOX_BACKGROUND_ALPHA = 140

          # Vung tim sub cung: chi xet nua duoi khung hinh.
          DETECT_Y_RATIO = 0.55
          # Pixel phai "sang khi co sub" nhieu hon "sang khi khong co sub" it nhat
          # bao nhieu (ty le frame) thi moi tinh la pixel chu.
          DETECT_MIN_DELTA = 0.22
          # Nguong cat bien cua bounding box theo profile hang/cot.
          PROFILE_CUT = 0.08

          BLUR_PAD_X = 10
          BLUR_PAD_Y_TOP = 8
          BLUR_PAD_Y_BOTTOM = 10
          MIN_BOTTOM_GAP = 8
          MIN_BLUR_HEIGHT = 24
          BLUR_FEATHER_RATIO = 0.25
          MIN_FEATHER_PX = 6

          GEMINI_MODEL = "gemini-2.5-flash"
          GEMINI_BATCH_SIZE = 100
          GEMINI_MAX_RETRIES = 10

          RAW_GEMINI_KEYS = os.environ.get("GEMINI_API_KEYS", "")
          GEMINI_API_KEYS = [k.strip() for k in RAW_GEMINI_KEYS.strip().splitlines() if k.strip()]

          SYSTEM_INSTRUCTION = (
              "You are a professional video subtitle translator. Translate the text into natural, fluent Vietnamese.\n"
              "CRITICAL RULES:\n"
              "1. You MUST output EVERY line with its exact index. Never skip any index.\n"
              "2. Maintain the exact same line identifiers like [0], [1], [2], etc. Do not merge, skip, or group any lines.\n"
              "3. If a line is empty or just '...', output the identifier with '...'.\n"
              "4. Translate naturally based on the surrounding context of the whole video.\n"
              "5. Output ONLY the translated numbered lines. No markdown, no notes, no extra text.\n"
              "6. PRONOUN SAFETY (VERY IMPORTANT): The source is Chinese, where family/relationship terms "
              "(mother, older brother, uncle, etc.) are usually explicit in the dialogue itself. When translating "
              "to Vietnamese, ALWAYS use the correct relational pronoun based on the clear relationship stated or "
              "implied (mẹ/con, anh/em, cô/cháu, etc.) — never swap the roles.\n"
              "7. If the relationship between speaker and listener is AMBIGUOUS or CANNOT be determined from the "
              "given line alone, DO NOT guess a specific relational pronoun. Instead, rephrase the sentence to be "
              "SHORTER and more NEUTRAL — using no pronoun, an implied subject, or a generic/neutral phrasing — "
              "so the sentence still sounds natural in Vietnamese without committing to an incorrect relationship."
          )


          def log(msg):
              print(msg, flush=True)


          def probe_video():
              cmd = ["ffprobe", "-hide_banner", "-v", "error", "-select_streams", "v:0",
                     "-show_entries", "stream=width,height,r_frame_rate",
                     "-show_entries", "format=duration", "-of", "json", str(VIDEO)]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
              data = json.loads(result.stdout)
              stream = data["streams"][0]
              width, height = int(stream["width"]), int(stream["height"])
              a, b = stream["r_frame_rate"].split("/")
              fps = float(a) / float(b)
              duration = float(data["format"]["duration"])
              return width, height, fps, duration


          def get_frame(time_sec):
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-ss", f"{max(0.0, time_sec):.3f}",
                     "-i", str(VIDEO), "-frames:v", "1", "-f", "image2pipe", "-vcodec", "mjpeg", "-q:v", "2", "-"]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0 or not result.stdout:
                  return None
              data = np.frombuffer(result.stdout, dtype=np.uint8)
              return cv2.imdecode(data, cv2.IMREAD_COLOR)


          # ============================================================
          # 1. DOC SRT
          # ============================================================
          def load_cues():
              subs = pysubs2.load(str(SRT_FILE), encoding="utf-8")
              cues = []
              for ev in subs.events:
                  text = re.sub(r"\s+", " ", ev.plaintext.replace("\\N", " ")).strip()
                  if not text:
                      continue
                  start = ev.start / 1000.0
                  end = ev.end / 1000.0
                  if end <= start:
                      continue
                  cues.append({"start": start, "end": end, "text": text})

              cues.sort(key=lambda c: c["start"])
              log(f"SRT CUES: {len(cues)}")
              if not cues:
                  raise RuntimeError(f"Khong doc duoc cue nao tu {SRT_FILE}")

              placeholder = sum(1 for c in cues if re.fullmatch(r"\[TIMING_\d+\]", c["text"]))
              if placeholder:
                  raise RuntimeError(
                      f"{placeholder}/{len(cues)} cue van con la placeholder [TIMING_xxxx]. "
                      "File SRT nay chi co timing, chua co text tieng Trung."
                  )
              return cues


          # ============================================================
          # 2. DO VUNG SUB CUNG (khong OCR)
          # ============================================================
          def text_mask(gray):
              """Mask cac cau truc sang/manh giong chu (tophat + nguong)."""
              kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (31, 9))
              tophat = cv2.morphologyEx(gray, cv2.MORPH_TOPHAT, kernel)
              _, mask = cv2.threshold(tophat, 22, 255, cv2.THRESH_BINARY)
              bright = cv2.inRange(gray, 165, 255)
              return cv2.bitwise_and(mask, bright)


          def sample_times(cues, duration, n):
              """Thoi diem CHAC CHAN co sub va CHAC CHAN khong co sub."""
              on_times, off_times = [], []

              for c in cues:
                  if c["end"] - c["start"] >= 0.25:
                      on_times.append((c["start"] + c["end"]) / 2.0)

              prev_end = 0.0
              for c in cues:
                  gap = c["start"] - prev_end
                  if gap >= 0.8:
                      off_times.append(prev_end + gap / 2.0)
                  prev_end = max(prev_end, c["end"])
              if duration - prev_end >= 1.0:
                  off_times.append(prev_end + (duration - prev_end) / 2.0)

              def spread(values, count):
                  if len(values) <= count:
                      return values
                  step = len(values) / float(count)
                  return [values[int(i * step)] for i in range(count)]

              return spread(on_times, n), spread(off_times, n)


          def detect_subtitle_band(cues, width, height, duration):
              y0 = int(height * DETECT_Y_RATIO)
              on_times, off_times = sample_times(cues, duration, DETECT_SAMPLES)
              log(f"DETECT: {len(on_times)} frame CO sub / {len(off_times)} frame KHONG sub")

              if len(on_times) < 5 or len(off_times) < 3:
                  log("DETECT: khong du mau, chuyen sang manual ratio.")
                  return None

              def accumulate(times, label):
                  acc = None
                  used = 0
                  for t in tqdm(times, desc=label):
                      frame = get_frame(t)
                      if frame is None:
                          continue
                      crop = frame[y0:height, 0:width]
                      gray = cv2.cvtColor(crop, cv2.COLOR_BGR2GRAY)
                      mask = (text_mask(gray) > 0).astype(np.float32)
                      acc = mask if acc is None else acc + mask
                      used += 1
                  if used == 0:
                      return None
                  return acc / used

              on_freq = accumulate(on_times, "Sampling ON")
              off_freq = accumulate(off_times, "Sampling OFF")
              if on_freq is None or off_freq is None:
                  return None

              delta = on_freq - off_freq
              band = (delta >= DETECT_MIN_DELTA).astype(np.float32)
              if band.sum() < 50:
                  log("DETECT: tin hieu qua yeu, chuyen sang manual ratio.")
                  return None

              row_profile = band.sum(axis=1)
              col_profile = band.sum(axis=0)

              def bounds(profile):
                  peak = profile.max()
                  if peak <= 0:
                      return None
                  idx = np.nonzero(profile >= peak * PROFILE_CUT)[0]
                  return int(idx.min()), int(idx.max())

              rb = bounds(row_profile)
              cb = bounds(col_profile)
              if rb is None or cb is None:
                  return None

              y1 = y0 + rb[0]
              y2 = y0 + rb[1]
              x1, x2 = cb

              log(f"DETECT RAW BAND: x={x1}..{x2} y={y1}..{y2}")
              return {"x1": x1, "y1": y1, "x2": x2, "y2": y2}


          def build_blur_region(cues, width, height, fps, duration):
              detected = None
              if BLUR_MODE == "auto":
                  detected = detect_subtitle_band(cues, width, height, duration)

              if detected is None:
                  band_w = int(width * MANUAL_X_RATIO)
                  x1 = int(width / 2 - band_w / 2)
                  x2 = x1 + band_w
                  y1 = int(height * MANUAL_Y1_RATIO)
                  y2 = int(height * MANUAL_Y2_RATIO)
                  source = "manual"
              else:
                  x1 = detected["x1"] - BLUR_PAD_X
                  x2 = detected["x2"] + BLUR_PAD_X
                  y1 = detected["y1"] - BLUR_PAD_Y_TOP
                  y2 = detected["y2"] + BLUR_PAD_Y_BOTTOM
                  # Sub luon canh giua -> ep doi xung qua truc giua cho dep va an toan.
                  half = max(width / 2 - x1, x2 - width / 2)
                  x1 = int(width / 2 - half)
                  x2 = int(width / 2 + half)
                  source = "auto"

              x1 = max(0, x1)
              x2 = min(width, x2)
              y1 = max(0, y1)
              y2 = min(height - MIN_BOTTOM_GAP, y2)

              if y2 - y1 < MIN_BLUR_HEIGHT:
                  y2 = min(height - MIN_BOTTOM_GAP, y1 + MIN_BLUR_HEIGHT)

              if (x2 - x1) % 2 != 0:
                  x2 -= 1
              if (y2 - y1) % 2 != 0:
                  y2 -= 1

              feather = int((x2 - x1) * BLUR_FEATHER_RATIO)
              feather = max(MIN_FEATHER_PX, feather)
              feather = min(feather, (x2 - x1) // 2, (y2 - y1) // 2)
              feather = max(MIN_FEATHER_PX, feather)

              region = {
                  "source": source,
                  "x1": int(x1), "y1": int(y1), "x2": int(x2), "y2": int(y2),
                  "width": int(width), "height": int(height), "fps": float(fps),
                  "blur_width": int(x2 - x1), "blur_height": int(y2 - y1),
                  "bottom_gap": int(height - y2), "feather_px": int(feather),
              }
              log(f"FINAL BLUR REGION: {region}")
              return region


          # ============================================================
          # 3. MASK + DICH + ASS + RENDER  (giu nguyen logic ban cu)
          # ============================================================
          def create_feather_mask(region):
              width, height = region["width"], region["height"]
              x1, y1, x2, y2 = region["x1"], region["y1"], region["x2"], region["y2"]
              feather = region["feather_px"]

              crop_x1 = max(0, x1 - feather)
              crop_y1 = max(0, y1 - feather)
              crop_x2 = min(width, x2 + feather)
              crop_y2 = min(height, y2 + feather)

              if (crop_x2 - crop_x1) % 2 != 0:
                  crop_x2 -= 1
              if (crop_y2 - crop_y1) % 2 != 0:
                  crop_y2 -= 1

              crop_w = crop_x2 - crop_x1
              crop_h = crop_y2 - crop_y1
              if crop_w <= 0 or crop_h <= 0:
                  raise RuntimeError(f"Invalid mask size: {crop_w}x{crop_h}")

              mask = np.zeros((crop_h, crop_w), dtype=np.uint8)
              inner_x1 = max(0, x1 - crop_x1)
              inner_y1 = max(0, y1 - crop_y1)
              inner_x2 = min(crop_w, x2 - crop_x1)
              inner_y2 = min(crop_h, y2 - crop_y1)
              mask[inner_y1:inner_y2, inner_x1:inner_x2] = 255

              ksize = int(feather) * 2 + 1
              sigma = max(1.0, feather / 2.0)
              mask = cv2.GaussianBlur(mask, (ksize, ksize), sigma)

              mask_path = WORK / "blur_mask.png"
              if not cv2.imwrite(str(mask_path), mask):
                  raise RuntimeError("Khong ghi duoc blur_mask.png")

              region["crop_x1"] = int(crop_x1)
              region["crop_y1"] = int(crop_y1)
              region["crop_x2"] = int(crop_x2)
              region["crop_y2"] = int(crop_y2)

              log(f"FEATHER MASK: crop=({crop_x1},{crop_y1})-({crop_x2},{crop_y2}) size={crop_w}x{crop_h} feather={feather}px")
              return mask_path


          def get_random_gemini_client():
              key = random.choice(GEMINI_API_KEYS)
              return genai.Client(api_key=key), key


          def call_gemini_with_retry(prompt_text, max_retries=GEMINI_MAX_RETRIES):
              for attempt in range(max_retries):
                  wait = 6 * (2 ** attempt)
                  client, key = get_random_gemini_client()
                  key_idx = GEMINI_API_KEYS.index(key) + 1
                  log(f">> GUI GEMINI - Lan {attempt + 1}/{max_retries} | Key #{key_idx} | {time.strftime('%H:%M:%S')}")
                  try:
                      t_start = time.time()
                      response = client.models.generate_content(
                          model=GEMINI_MODEL,
                          contents=prompt_text,
                          config=types.GenerateContentConfig(
                              system_instruction=SYSTEM_INSTRUCTION,
                              temperature=0.3,
                          )
                      )
                      elapsed = time.time() - t_start
                      log(f"<< NHAN KET QUA - Thanh cong sau {elapsed:.1f}s")
                      return response.text
                  except Exception as e:
                      error_str = str(e)
                      log(f"<< LOI API: {error_str}")
                      if any(code in error_str for code in ("503", "429", "500", "UNAVAILABLE")):
                          log(f"   Server ban/qua tai/limit. Doi key va cho {wait}s...")
                          time.sleep(wait)
                      else:
                          log("   Loi khong the retry. Dung thu lai.")
                          break
              return None


          def parse_translated(response_text):
              translated_dict = {}
              for line in response_text.strip().split("\n"):
                  if "]" in line:
                      try:
                          parts = line.split("]", 1)
                          idx_str = parts[0].replace("[", "").strip()
                          val = parts[1].strip()
                          if val == "...":
                              val = ""
                          translated_dict[int(idx_str)] = val
                      except Exception:
                          pass
              return translated_dict


          def translate_cues(cues):
              if not GEMINI_API_KEYS:
                  raise RuntimeError("Chua cau hinh GEMINI_API_KEYS trong GitHub Secrets.")

              total_lines = len(cues)
              total_batches = (total_lines + GEMINI_BATCH_SIZE - 1) // GEMINI_BATCH_SIZE
              log(f"BAT DAU DICH - {total_lines} dong / {total_batches} batch")

              results = []

              for i in range(0, total_lines, GEMINI_BATCH_SIZE):
                  batch = cues[i:i + GEMINI_BATCH_SIZE]
                  batch_num = (i // GEMINI_BATCH_SIZE) + 1
                  log(f"[BATCH {batch_num}/{total_batches}] Dong {i + 1}-{min(i + GEMINI_BATCH_SIZE, total_lines)}")

                  prompt_text = ""
                  for idx, cue in enumerate(batch):
                      prompt_text += f"[{idx}] {cue['text'].strip() or '...'}\n"

                  log(">> NOI DUNG GUI LEN API:")
                  for line in prompt_text.strip().split("\n"):
                      log(f"   {line}")

                  response_text = call_gemini_with_retry(prompt_text)
                  if response_text is None:
                      raise RuntimeError(f"[THAT BAI] Khong the dich batch {batch_num}.")

                  log(">> KET QUA DICH TU AI:")
                  for line in response_text.strip().split("\n"):
                      log(f"   {line}")

                  translated_dict = parse_translated(response_text)

                  missing = [idx for idx in range(len(batch)) if not translated_dict.get(idx)]
                  if missing:
                      log(f">> CANH BAO: AI bo sot {len(missing)} dong: {missing}. Retry...")
                      retry_prompt = "You missed some lines in your previous translation. Please translate ONLY these missing lines:\n\n"
                      for idx in missing:
                          retry_prompt += f"[{idx}] {batch[idx]['text'].strip() or '...'}\n"
                      retry_prompt += "\nOutput ONLY the missing lines with their exact [index] prefix."
                      retry_response = call_gemini_with_retry(retry_prompt)
                      if retry_response:
                          log(">> KET QUA RETRY:")
                          for line in retry_response.strip().split("\n"):
                              log(f"   {line}")
                          translated_dict.update(parse_translated(retry_response))

                  fallback_count = 0
                  for idx, cue in enumerate(batch):
                      if translated_dict.get(idx):
                          vi = translated_dict[idx]
                      else:
                          vi = cue["text"]
                          fallback_count += 1
                          log(f"   [{i + idx + 1:04d}] FALLBACK (giu nguyen goc): {cue['text']!r}")
                      results.append({"start": cue["start"], "end": cue["end"], "text": cue["text"], "vi": vi})

                  if fallback_count:
                      log(f">> Batch {batch_num}: {fallback_count} dong giu nguyen tieng Trung.")

                  log(f"[BATCH {batch_num}/{total_batches}] Hoan thanh")
                  time.sleep(3)

              with open(WORK / "translation_debug.txt", "w", encoding="utf-8") as f:
                  for idx, r in enumerate(results):
                      zh_len, vi_len = len(r["text"]), len(r["vi"])
                      flag = " [SUSPICIOUS]" if vi_len < zh_len * 0.6 else ""
                      f.write(f"[{idx:03d}] {r['start']:.2f}s -> {r['end']:.2f}s{flag}\n")
                      f.write(f"  ZH ({zh_len}): {r['text']}\n")
                      f.write(f"  VI ({vi_len}): {r['vi']}\n\n")

              return results


          def save_srt(cues, path, field):
              subs = pysubs2.SSAFile()
              for cue in cues:
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=cue[field]))
              subs.save(str(path), encoding="utf-8")


          def create_ass(cues, region):
              width = int(region["width"])
              height = int(region["height"])
              subtitle_x = (int(region["x1"]) + int(region["x2"])) // 2
              subtitle_y = (int(region["y1"]) + int(region["y2"])) // 2

              log(f"SUBTITLE STYLE Font: {FONT_NAME} Size: {FONT_SIZE} Pos: ({subtitle_x},{subtitle_y})")

              subs = pysubs2.SSAFile()
              subs.info["PlayResX"] = width
              subs.info["PlayResY"] = height
              subs.info["ScaledBorderAndShadow"] = "yes"

              style = pysubs2.SSAStyle()
              style.fontname = FONT_NAME
              style.fontsize = FONT_SIZE
              style.primarycolor = pysubs2.Color(255, 255, 255, 0)
              style.secondarycolor = pysubs2.Color(255, 255, 255, 0)
              style.outlinecolor = pysubs2.Color(0, 0, 0, 0)
              style.backcolor = pysubs2.Color(0, 0, 0, 255 - BOX_BACKGROUND_ALPHA) if BOX_BACKGROUND_ENABLED \
                  else pysubs2.Color(0, 0, 0, 0)
              style.borderstyle = 3 if BOX_BACKGROUND_ENABLED else 1
              style.outline = OUTLINE_SIZE
              style.shadow = SHADOW_SIZE
              style.alignment = 5
              style.marginl = 30
              style.marginr = 30
              style.marginv = 0
              subs.styles["Default"] = style

              for cue in cues:
                  text = (
                      "{\\an5"
                      f"\\pos({subtitle_x},{subtitle_y})"
                      f"\\fsp{LETTER_SPACING}"
                      "\\q2}"
                      + cue["vi"]
                  )
                  subs.events.append(pysubs2.SSAEvent(
                      start=int(cue["start"] * 1000), end=int(cue["end"] * 1000), text=text))

              path = WORK / "vietnamese.ass"
              subs.save(str(path), encoding="utf-8")

              invalid = [ev for ev in subs.events if ev.end <= ev.start]
              log(f"ASS EVENTS WRITTEN: {len(subs.events)} (loi end<=start: {len(invalid)})")
              if not subs.events:
                  raise RuntimeError("Khong co event nao duoc ghi vao file .ass.")
              if invalid:
                  raise RuntimeError(f"Co {len(invalid)} event end<=start.")
              return path


          def render_video(ass, region, mask_path):
              width, height = int(region["width"]), int(region["height"])
              cx1, cy1 = int(region["crop_x1"]), int(region["crop_y1"])
              cx2, cy2 = int(region["crop_x2"]), int(region["crop_y2"])
              cw, ch = cx2 - cx1, cy2 - cy1

              if cx1 < 0 or cy1 < 0 or cx2 > width or cy2 > height or cw <= 0 or ch <= 0:
                  raise RuntimeError(f"Invalid feather crop region: x1={cx1} y1={cy1} x2={cx2} y2={cy2}")
              if cw % 2 != 0 or ch % 2 != 0:
                  raise RuntimeError(f"Crop size must be even for yuv420p: {cw}x{ch}")

              mask_img = cv2.imread(str(mask_path), cv2.IMREAD_GRAYSCALE)
              if mask_img is None:
                  raise RuntimeError(f"Cannot read mask: {mask_path}")
              mask_h, mask_w = mask_img.shape[:2]
              log(f"RENDER CROP: {cw}x{ch} | MASK: {mask_w}x{mask_h}")

              if mask_w != cw or mask_h != ch:
                  log(f"WARNING: Resize mask {mask_w}x{mask_h} -> {cw}x{ch}")
                  mask_img = cv2.resize(mask_img, (cw, ch), interpolation=cv2.INTER_NEAREST)
                  cv2.imwrite(str(mask_path), mask_img)

              ass_path = str(ass).replace("\\", "/").replace(":", "\\:").replace("'", "\\'")

              video_filter = (
                  f"[0:v]format=yuv420p,split=2[base1][base2];"
                  f"[base1]crop=w={cw}:h={ch}:x={cx1}:y={cy1},"
                  f"boxblur=luma_radius={BLUR_SIGMA}:luma_power=1:chroma_radius={BLUR_SIGMA}:chroma_power=1,"
                  f"format=yuv420p,setsar=1[blur_crop];"
                  f"[1:v]format=gray,scale=w={cw}:h={ch}:flags=neighbor,setsar=1[mask];"
                  f"[blur_crop][mask]alphamerge,format=yuva420p[blur_rgba];"
                  f"[base2][blur_rgba]overlay=x={cx1}:y={cy1}:format=yuv420[ov];"
                  f"[ov]ass='{ass_path}',format=yuv420p[vout]"
              )

              output = OUTPUT / "video_vi.mp4"
              if output.exists():
                  output.unlink()

              cmd = [
                  "ffmpeg", "-hide_banner", "-y",
                  "-i", str(VIDEO),
                  "-loop", "1", "-i", str(mask_path),
                  "-filter_complex", video_filter,
                  "-map", "[vout]", "-map", "0:a?",
                  "-c:v", "libx264", "-preset", "fast", "-crf", "21",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-movflags", "+faststart",
                  "-shortest", str(output)
              ]
              subprocess.run(cmd, check=True)

              if not output.exists() or output.stat().st_size < 10000:
                  raise RuntimeError("Output video bat thuong.")
              return output


          def main():
              if not VIDEO.exists():
                  raise RuntimeError(f"Video khong ton tai: {VIDEO}")

              width, height, fps, duration = probe_video()
              log(f"VIDEO: {width}x{height} FPS={fps:.2f} Duration={duration:.2f}s")

              cues = load_cues()
              region = build_blur_region(cues, width, height, fps, duration)
              mask_path = create_feather_mask(region)

              (WORK / "subtitle_region.json").write_text(
                  json.dumps(region, ensure_ascii=False, indent=2), encoding="utf-8")

              translated = translate_cues(cues)
              save_srt(translated, WORK / "vietnamese.srt", "vi")

              ass = create_ass(translated, region)
              output = render_video(ass, region, mask_path)

              log("PROCESS COMPLETE")
              log(f"Video: {output}")
              log(f"Vietnamese SRT: {WORK / 'vietnamese.srt'}")


          if __name__ == "__main__":
              main()
          PY

      - name: Translate → Render
        env:
          SRT_FILE: ${{ inputs.srt_file }}
          BLUR_MODE: ${{ inputs.blur_mode }}
          MANUAL_X_RATIO: ${{ inputs.manual_x_ratio }}
          MANUAL_Y1_RATIO: ${{ inputs.manual_y1_ratio }}
          MANUAL_Y2_RATIO: ${{ inputs.manual_y2_ratio }}
          DETECT_SAMPLES: ${{ inputs.detect_samples }}
          FONT_SIZE: ${{ inputs.font_size }}
          BLUR_SIGMA: ${{ inputs.blur_sigma }}
          FONT_NAME: ${{ env.FONT_FAMILY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          python process.py

      - name: Check output
        run: |
          set -e
          ls -lh output/
          cat work/subtitle_region.json || true
          ffprobe -hide_banner -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/video_vi.mp4

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-vietnamese-result
          path: |
            output/video_vi.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
