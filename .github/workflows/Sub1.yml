name: Bilibili Hard Subtitle Extractor — Native FPS Multi-Signal Timing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_fps:
        description: "FPS timing chính. 0 = tự dùng FPS gốc của video (khuyên dùng để không bỏ frame)"
        required: false
        default: "0"
        type: string

      fine_rescan_fps:
        description: "FPS quét lại các vùng dài; dùng để bắt boundary mà pass native-FPS còn bỏ sót"
        required: false
        default: "60"
        type: string

      fine_rescan_min_duration:
        description: "Fine-rescan vùng dài hơn giá trị này (giây); giảm để ưu tiên bắt đủ boundary"
        required: false
        default: "1.5"
        type: string

      refine_radius:
        description: "Khoảng refine quanh boundary, giây"
        required: false
        default: "0.35"
        type: string

      max_short_gap:
        description: "Chỉ bridge khoảng mất tín hiệu rất ngắn; để thấp để tránh gộp 2 câu"
        required: false
        default: "0.10"
        type: string

      min_cue_duration:
        description: "Loại bỏ cue cực ngắn sau khi timing; giữ thấp để tránh mất câu ngắn"
        required: false
        default: "0.12"
        type: string

      local_window_seconds:
        description: "Cửa sổ (giây) để tính nền cục bộ khi phát hiện sub yếu/ngắn (so với nền lân cận thay vì so với cả video)"
        required: false
        default: "2.0"
        type: string

      local_margin:
        description: "Biên độ tối thiểu (điểm số) để coi 1 frame là 'nổi bật hơn nền cục bộ' -> có sub"
        required: false
        default: "0.00006"
        type: string

      save_debug_frames:
        description: "Lưu frame timing để debug"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================
      - name: Install system packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      # ============================================================
      # PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            pandas==2.2.2 \
            opencv-python-headless==4.10.0.84 \
            tqdm \
            pysubs2 \
            yt-dlp

      # ============================================================
      # PREPARE
      # ============================================================
      - name: Prepare directories
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work work/debug_frames
          rm -f timing.srt process.py

      # ============================================================
      # BILIBILI COOKIES
      # ============================================================
      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euxo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt

      # ============================================================
      # DOWNLOAD
      # ============================================================
      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euxo pipefail
          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::work/source.mp4 không tồn tại."
            find work -maxdepth 2 -type f -ls
            exit 1
          fi
          ls -lh work/

      # ============================================================
      # CREATE PROCESS SCRIPT
      # ============================================================
      - name: Create subtitle extraction script
        run: |
          cat > process.py <<'PY'
          """
          TIMING ONLY — multi-signal hard-subtitle timing.
          
          Design borrowed from the useful timing ideas in open-source hard-sub extractors:
          - sample every source frame (SCAN_FPS=0 => source FPS), analogous to VideOCR's
            recommendation of frames_to_skip=0 for best timestamps;
          - use a temporal similarity/change signal between consecutive subtitle-band frames;
          - use a separate subtitle-presence signal so OCR recognition errors can never
            decide cue timing;
          - use a permissive first pass, hysteresis + short-gap recovery, then a high-FPS
            boundary rescan and frame-level boundary refinement.
          
          No OCR is used in this workflow.
          """
          
          import os
          import re
          import json
          import math
          import subprocess
          from pathlib import Path
          
          import cv2
          import numpy as np
          from tqdm import tqdm
          
          WORK = Path("work")
          VIDEO = WORK / "source.mp4"
          TIMING_JSON = WORK / "timing.json"
          DEBUG_JSON = WORK / "all_debug.json"
          OUTPUT_SRT = Path("timing.srt")
          DEBUG_FRAMES_DIR = WORK / "debug_frames"
          
          def env_float(name, default):
              return float(os.environ.get(name, default))
          
          def env_bool(name, default):
              return os.environ.get(name, default).strip().lower() == "true"
          
          # 0 = automatically use the video's native reported FPS.
          SCAN_FPS = env_float("SCAN_FPS", "0")
          FINE_RESCAN_FPS = env_float("FINE_RESCAN_FPS", "60")
          FINE_RESCAN_MIN_DURATION = env_float("FINE_RESCAN_MIN_DURATION", "1.5")
          REFINE_RADIUS = env_float("REFINE_RADIUS", "0.45")
          MAX_SHORT_GAP = env_float("MAX_SHORT_GAP", "0.12")
          MIN_CUE_DURATION = env_float("MIN_CUE_DURATION", "0.10")
          LOCAL_WINDOW_SECONDS = env_float("LOCAL_WINDOW_SECONDS", "1.5")
          LOCAL_MARGIN = env_float("LOCAL_MARGIN", "0.000035")
          LOCAL_K_MAD = 2.5
          SAVE_DEBUG_FRAMES = env_bool("SAVE_DEBUG_FRAMES", "true")
          
          # Subtitle band. Keep a little more vertical area than before to avoid clipping
          # top strokes/second lines.
          ROI_Y1_RATIO = 0.58
          ROI_Y2_RATIO = 0.99
          
          # White/yellow/outlined subtitle detector.
          BRIGHT_THRESHOLD = 145
          TOPHAT_KERNEL = (31, 9)
          EDGE_THRESHOLD_1 = 35
          EDGE_THRESHOLD_2 = 110
          
          # Temporal / segmentation.
          MIN_SEGMENT_DURATION = 0.10
          MIN_CHANGE_GAP_SECONDS = 0.08
          BOUNDARY_LOCAL_RADIUS = 0.18
          BOUNDARY_MIN_PROMINENCE = 0.012
          
          # Signature size: enough horizontal detail to distinguish adjacent Chinese cues.
          SIGNATURE_WIDTH = 320
          SIGNATURE_HEIGHT = 80
          
          def log(message):
              print(message, flush=True)
          
          def json_safe(obj):
              if isinstance(obj, np.integer):
                  return int(obj)
              if isinstance(obj, np.floating):
                  return float(obj)
              if isinstance(obj, np.bool_):
                  return bool(obj)
              if isinstance(obj, np.ndarray):
                  return [json_safe(x) for x in obj.tolist()]
              if isinstance(obj, dict):
                  return {str(k): json_safe(v) for k, v in obj.items()}
              if isinstance(obj, (list, tuple)):
                  return [json_safe(x) for x in obj]
              return obj
          
          def write_json(path, data):
              path.write_text(
                  json.dumps(json_safe(data), ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
          
          def probe_video():
              cmd = [
                  "ffprobe", "-hide_banner", "-v", "error",
                  "-select_streams", "v:0",
                  "-show_entries", "stream=width,height,r_frame_rate",
                  "-show_entries", "format=duration",
                  "-of", "json", str(VIDEO),
              ]
              result = subprocess.run(
                  cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, check=True
              )
              data = json.loads(result.stdout)
              stream = data["streams"][0]
              width = int(stream["width"])
              height = int(stream["height"])
              fps_num, fps_den = stream["r_frame_rate"].split("/")
              fps = float(fps_num) / float(fps_den)
              duration = float(data["format"]["duration"])
              return {"width": width, "height": height, "fps": fps, "duration": duration}
          
          def get_frame(time_sec):
              time_sec = max(0.0, float(time_sec))
              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-ss", f"{time_sec:.6f}", "-i", str(VIDEO),
                  "-frames:v", "1",
                  "-f", "image2pipe", "-vcodec", "mjpeg", "-q:v", "2", "-"
              ]
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0 or not result.stdout:
                  return None
              raw = np.frombuffer(result.stdout, dtype=np.uint8)
              return cv2.imdecode(raw, cv2.IMREAD_COLOR)
          
          def get_roi(frame, video_info):
              height = video_info["height"]
              width = video_info["width"]
              y1 = int(height * ROI_Y1_RATIO)
              y2 = int(height * ROI_Y2_RATIO)
              return frame[y1:y2, 0:width], y1, y2
          
          def subtitle_features(roi):
              """
              Returns several complementary signals.
          
              The previous version required BRIGHT AND EDGE. That is a major source of
              false negatives: a low-contrast/blurred subtitle can have one strong cue
              but not both. Here we retain:
                - bright mask,
                - local top-hat mask,
                - edge/text mask,
                - a permissive union mask.
              """
              if roi is None:
                  return None
          
              gray = cv2.cvtColor(roi, cv2.COLOR_BGR2GRAY)
          
              # Global bright text.
              bright = cv2.inRange(gray, BRIGHT_THRESHOLD, 255)
          
              # Local bright structures: catches white text over bright-ish backgrounds.
              kernel = cv2.getStructuringElement(cv2.MORPH_RECT, TOPHAT_KERNEL)
              tophat = cv2.morphologyEx(gray, cv2.MORPH_TOPHAT, kernel)
              local_bright = cv2.inRange(tophat, 18, 255)
          
              # Adaptive threshold catches thin/soft characters missed by a fixed cutoff.
              adaptive = cv2.adaptiveThreshold(
                  gray, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C,
                  cv2.THRESH_BINARY, 31, -4
              )
          
              edges = cv2.Canny(gray, EDGE_THRESHOLD_1, EDGE_THRESHOLD_2)
              edges = cv2.dilate(
                  edges,
                  cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3)),
                  iterations=1
              )
          
              # Prefer locally bright/adaptive text, but retain edge-only evidence.
              text = cv2.bitwise_or(bright, local_bright)
              text = cv2.bitwise_or(text, adaptive)
              text = cv2.bitwise_and(
                  text,
                  cv2.dilate(edges, cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3)))
              )
          
              # A second permissive channel: top-hat alone can preserve tiny characters
              # that disappear after the edge intersection.
              local_text = cv2.morphologyEx(
                  local_bright, cv2.MORPH_CLOSE,
                  cv2.getStructuringElement(cv2.MORPH_RECT, (5, 3))
              )
          
              # Clean small isolated noise while keeping short Chinese cues.
              text = cv2.morphologyEx(
                  text, cv2.MORPH_CLOSE,
                  cv2.getStructuringElement(cv2.MORPH_RECT, (5, 3))
              )
              text = cv2.morphologyEx(
                  text, cv2.MORPH_OPEN,
                  cv2.getStructuringElement(cv2.MORPH_RECT, (2, 2))
              )
          
              union = cv2.bitwise_or(text, local_text)
          
              return {
                  "gray": gray,
                  "mask": union,
                  "strict_mask": text,
              }
          
          def subtitle_score(features):
              if features is None:
                  return 0.0
          
              mask = features["mask"]
              h, w = mask.shape
              area = float(max(1, h * w))
              occupancy = float(np.count_nonzero(mask)) / area
          
              # Subtitle pixels tend to form one/two dense horizontal rows.
              row_counts = np.count_nonzero(mask, axis=1)
              peak = float(np.max(row_counts)) if row_counts.size else 0.0
              if peak <= 0:
                  return occupancy
          
              active_rows = np.count_nonzero(row_counts >= max(2.0, peak * 0.16))
              row_concentration = active_rows / max(1, h)
          
              # Connected components: reject a frame made only of scattered noise.
              num_labels, labels, stats, _ = cv2.connectedComponentsWithStats(mask, 8)
              components = 0
              largest = 0
              for i in range(1, num_labels):
                  area_i = int(stats[i, cv2.CC_STAT_AREA])
                  ww = int(stats[i, cv2.CC_STAT_WIDTH])
                  hh = int(stats[i, cv2.CC_STAT_HEIGHT])
                  if area_i >= 5 and ww >= 2 and hh >= 2:
                      components += 1
                      largest = max(largest, area_i)
          
              component_bonus = min(0.0020, components * 0.00008)
              largest_bonus = min(0.0020, largest / area * 0.12)
          
              return float(
                  occupancy
                  + row_concentration * 0.0045
                  + component_bonus
                  + largest_bonus
              )
          
          def make_signature(features):
              if features is None:
                  return None
          
              mask = cv2.resize(
                  features["mask"],
                  (SIGNATURE_WIDTH, SIGNATURE_HEIGHT),
                  interpolation=cv2.INTER_AREA
              )
              return (mask > 35).astype(np.float32)
          
          def make_gray_signature(features):
              if features is None:
                  return None
              gray = cv2.resize(
                  features["gray"],
                  (SIGNATURE_WIDTH, SIGNATURE_HEIGHT),
                  interpolation=cv2.INTER_AREA
              ).astype(np.float32) / 255.0
              return gray
          
          def signature_distance(a, b):
              if a is None or b is None:
                  return 1.0
              return float(np.mean(np.abs(a - b)))
          
          def ssim_distance(a, b):
              """
              Lightweight SSIM-like structural distance. No skimage dependency.
              0 = very similar, 1 = very different.
              """
              if a is None or b is None:
                  return 1.0
          
              a = a.astype(np.float32)
              b = b.astype(np.float32)
              mu_a = cv2.GaussianBlur(a, (0, 0), 1.2)
              mu_b = cv2.GaussianBlur(b, (0, 0), 1.2)
          
              sigma_a = cv2.GaussianBlur(a * a, (0, 0), 1.2) - mu_a * mu_a
              sigma_b = cv2.GaussianBlur(b * b, (0, 0), 1.2) - mu_b * mu_b
              sigma_ab = cv2.GaussianBlur(a * b, (0, 0), 1.2) - mu_a * mu_b
          
              c1 = 0.01 ** 2
              c2 = 0.03 ** 2
              ssim_map = (
                  ((2 * mu_a * mu_b + c1) * (2 * sigma_ab + c2))
                  / ((mu_a * mu_a + mu_b * mu_b + c1) * (sigma_a + sigma_b + c2) + 1e-9)
              )
              score = float(np.mean(np.clip(ssim_map, -1.0, 1.0)))
              return float(np.clip((1.0 - score) * 0.5, 0.0, 1.0))
          
          def temporal_change(prev, current):
              if prev is None or current is None:
                  return 1.0
          
              mask_change = signature_distance(prev["mask_sig"], current["mask_sig"])
              gray_change = ssim_distance(prev["gray_sig"], current["gray_sig"])
          
              # Mask difference is most subtitle-specific. SSIM adds sensitivity to
              # outline/anti-aliasing changes that binarization can miss.
              return float(0.72 * mask_change + 0.28 * gray_change)
          
          def calculate_global_threshold(scores):
              values = np.asarray(scores, dtype=np.float64)
              values = values[np.isfinite(values)]
              positive = values[values > 0]
          
              if values.size == 0 or not positive.size:
                  return 0.00035
          
              # Deliberately permissive: presence is allowed to over-detect. The next
              # temporal stages decide whether it is a real subtitle run.
              q25 = float(np.percentile(positive, 25))
              q50 = float(np.percentile(positive, 50))
              threshold = max(0.00035, min(q25, q50 * 0.72))
          
              log(
                  f"PRESENCE THRESHOLD = {threshold:.7f} "
                  f"(positive q25={q25:.7f}, q50={q50:.7f})"
              )
              return float(threshold)
          
          def calculate_local_active(scores, scan_fps):
              window_frames = max(3, int(round(LOCAL_WINDOW_SECONDS * scan_fps)))
              window = window_frames * 2 + 1
          
              series = np.asarray(scores, dtype=np.float64)
              med = cv2.blur(series.reshape(-1, 1), (1, window)).reshape(-1)
              # Rolling MAD without pandas: use a local median approximation plus
              # a robust global floor. This is intentionally sensitive.
              abs_dev = np.abs(series - med)
              mad = cv2.blur(abs_dev.reshape(-1, 1), (1, window)).reshape(-1)
              threshold = med + np.maximum(LOCAL_K_MAD * mad, LOCAL_MARGIN)
          
              active = series >= threshold
          
              # Do not let the adaptive detector erase frames that have a clearly
              # subtitle-like absolute score.
              global_floor = float(np.percentile(series[series > 0], 20)) if np.any(series > 0) else 0.0
              if global_floor > 0:
                  active |= series >= global_floor * 1.25
          
              log(
                  f"LOCAL ADAPTIVE: window={LOCAL_WINDOW_SECONDS:.2f}s "
                  f"k_mad={LOCAL_K_MAD:.2f} flagged={int(active.sum())}/{len(active)}"
              )
              return active
          
          def robust_threshold(values, floor=0.006):
              values = np.asarray(values, dtype=np.float64)
              values = values[np.isfinite(values)]
              if not values.size:
                  return floor
              med = float(np.median(values))
              mad = float(np.median(np.abs(values - med))) + 1e-9
              p75 = float(np.percentile(values, 75))
              # Lower than a classic outlier threshold because adjacent Chinese cues
              # can change very subtly.
              return float(max(floor, min(p75 * 0.55, med + 2.2 * mad, 0.12)))
          
          def compute_active_regions(samples, global_threshold, local_active_mask, duration, scan_fps):
              n = len(samples)
              if n == 0:
                  return []
          
              scores = np.asarray([s["score"] for s in samples], dtype=np.float64)
              active = (
                  (scores >= global_threshold)
                  | np.asarray(local_active_mask, dtype=bool)
              )
          
              # Hysteresis: once text is convincingly active, require a few consecutive
              # weak frames before turning it off. This is much safer than a single
              # threshold and prevents missing subtitles because of anti-aliasing.
              on_threshold = max(global_threshold, float(np.percentile(scores[scores > 0], 18)) if np.any(scores > 0) else global_threshold)
              positive = scores[scores > 0]
              off_threshold = max(global_threshold * 0.42, on_threshold * 0.35)
          
              state = np.zeros(n, dtype=np.uint8)
              on = False
              weak_run = 0
              max_weak = max(1, int(round(0.10 * scan_fps)))
          
              for i, score in enumerate(scores):
                  if not on:
                      if score >= on_threshold or active[i]:
                          on = True
                          state[i] = 1
                          weak_run = 0
                  else:
                      if score >= off_threshold or active[i]:
                          state[i] = 1
                          weak_run = 0
                      else:
                          weak_run += 1
                          if weak_run <= max_weak:
                              state[i] = 1
                          else:
                              on = False
                              weak_run = 0
          
              # Bridge only short real detection holes, using the same principle as
              # max_merge_gap in VideOCR, but keep the gap substantially shorter.
              max_gap_frames = max(1, int(round(MAX_SHORT_GAP * scan_fps)))
              i = 0
              while i < n:
                  if state[i]:
                      i += 1
                      continue
                  j = i
                  while j < n and not state[j]:
                      j += 1
                  if i > 0 and j < n and (j - i) <= max_gap_frames:
                      state[i:j] = 1
                  i = j
          
              for i, sample in enumerate(samples):
                  sample["active"] = bool(state[i])
          
              regions = []
              start = None
              for i, val in enumerate(state):
                  if val and start is None:
                      start = i
                  elif not val and start is not None:
                      regions.append((start, i - 1))
                      start = None
              if start is not None:
                  regions.append((start, n - 1))
          
              result = []
              for a, b in regions:
                  st = float(samples[a]["time"])
                  en = min(duration, float(samples[b]["time"] + 1.0 / scan_fps))
                  if en - st >= MIN_CUE_DURATION:
                      result.append({
                          "start_index": int(a),
                          "end_index": int(b),
                          "start": st,
                          "end": en,
                      })
              return result
          
          def boundary_is_real(samples, i, threshold):
              if i <= 1 or i >= len(samples) - 1:
                  return False
          
              left = samples[max(0, i-2):i]
              right = samples[i:min(len(samples), i+2)]
              if not left or not right:
                  return False
          
              left_sig = np.mean([x["score"] for x in left])
              right_sig = np.mean([x["score"] for x in right])
          
              # A real cue-to-cue change should have subtitle presence on both sides.
              if left_sig < threshold * 0.55 or right_sig < threshold * 0.55:
                  return False
          
              local_left = [x["change"] for x in samples[max(1, i-4):i]]
              local_right = [x["change"] for x in samples[i:min(len(samples), i+4)]]
              neighbor = np.asarray(local_left + local_right, dtype=np.float64)
              neighbor = neighbor[np.isfinite(neighbor)]
          
              if neighbor.size:
                  baseline = float(np.median(neighbor))
                  if samples[i]["change"] < max(BOUNDARY_MIN_PROMINENCE, baseline * 1.35):
                      return False
          
              return True
          
          def find_change_boundaries(samples, region, change_threshold, scan_fps):
              a = region["start_index"]
              b = region["end_index"]
              min_gap = max(1, int(round(MIN_CHANGE_GAP_SECONDS * scan_fps)))
              radius = max(1, int(round(BOUNDARY_LOCAL_RADIUS * scan_fps)))
          
              candidates = []
              for i in range(a + 1, b + 1):
                  if not (samples[i-1]["active"] and samples[i]["active"]):
                      continue
                  if samples[i]["change"] < change_threshold:
                      continue
          
                  lo = max(a + 1, i - radius)
                  hi = min(b, i + radius)
                  local_max = max(samples[j]["change"] for j in range(lo, hi + 1))
                  if samples[i]["change"] + 1e-9 < local_max:
                      continue
          
                  if not boundary_is_real(samples, i, change_threshold):
                      continue
          
                  candidates.append(i)
          
              # Non-maximum suppression: keep the strongest peak in each minimum-gap zone.
              selected = []
              for i in sorted(candidates, key=lambda x: samples[x]["change"], reverse=True):
                  if all(abs(i - j) >= min_gap for j in selected):
                      selected.append(i)
          
              return sorted(selected)
          
          def split_region_by_changes(samples, region, change_threshold, duration, scan_fps):
              boundaries = find_change_boundaries(samples, region, change_threshold, scan_fps)
              indexes = [region["start_index"], *boundaries, region["end_index"] + 1]
          
              cues = []
              for k in range(len(indexes) - 1):
                  a = indexes[k]
                  b = indexes[k + 1] - 1
                  if b < a:
                      continue
          
                  st = float(samples[a]["time"])
                  en = min(duration, float(samples[b]["time"] + 1.0 / scan_fps))
                  if en - st < MIN_SEGMENT_DURATION:
                      continue
          
                  cues.append({
                      "start": st,
                      "end": en,
                      "start_index": int(a),
                      "end_index": int(b),
                  })
              return cues
          
          def extract_region_frames(video_info, start, end, fps):
              width, height = video_info["width"], video_info["height"]
              y1 = int(height * ROI_Y1_RATIO)
              y2 = int(height * ROI_Y2_RATIO)
              roi_width, roi_height = width, y2 - y1
          
              pad = 0.20
              seek = max(0.0, start - pad)
              span = (end - start) + 2 * pad
          
              filter_graph = f"fps={fps},crop={roi_width}:{roi_height}:0:{y1}"
              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-ss", f"{seek:.6f}", "-i", str(VIDEO),
                  "-t", f"{span:.6f}",
                  "-vf", filter_graph, "-an", "-sn", "-dn",
                  "-pix_fmt", "bgr24", "-f", "rawvideo", "-"
              ]
              result = subprocess.run(
                  cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE
              )
              if result.returncode != 0:
                  log("FINE RESCAN ffmpeg error: " + result.stderr.decode("utf-8", errors="replace"))
                  return []
          
              frame_size = roi_width * roi_height * 3
              raw = result.stdout
              n_frames = len(raw) // frame_size
          
              frames = []
              prev = None
              for i in range(n_frames):
                  chunk = raw[i * frame_size:(i + 1) * frame_size]
                  roi = np.frombuffer(chunk, dtype=np.uint8).reshape((roi_height, roi_width, 3))
                  feat = subtitle_features(roi)
                  score = subtitle_score(feat)
                  current = {
                      "mask_sig": make_signature(feat),
                      "gray_sig": make_gray_signature(feat),
                  }
                  change = temporal_change(prev, current)
          
                  frames.append({
                      "time": float(seek + i / fps),
                      "score": float(score),
                      "change": float(change),
                  })
                  prev = current
              return frames
          
          def fine_rescan_region(video_info, region_start, region_end, base_change_threshold):
              fine_frames = extract_region_frames(
                  video_info, region_start, region_end, FINE_RESCAN_FPS
              )
              fine_frames = [
                  f for f in fine_frames
                  if region_start - 0.08 <= f["time"] <= region_end + 0.08
              ]
              if len(fine_frames) < 5:
                  return None
          
              changes = [f["change"] for f in fine_frames[1:]]
              fine_threshold = robust_threshold(changes, floor=BOUNDARY_MIN_PROMINENCE)
              fine_threshold = min(fine_threshold, max(BOUNDARY_MIN_PROMINENCE, base_change_threshold * 0.85))
          
              min_gap = max(1, int(round(MIN_CHANGE_GAP_SECONDS * FINE_RESCAN_FPS)))
              radius = max(1, int(round(BOUNDARY_LOCAL_RADIUS * FINE_RESCAN_FPS)))
          
              candidates = []
              for i in range(1, len(fine_frames) - 1):
                  if fine_frames[i]["change"] < fine_threshold:
                      continue
                  lo = max(1, i - radius)
                  hi = min(len(fine_frames) - 2, i + radius)
                  if fine_frames[i]["change"] < max(fine_frames[j]["change"] for j in range(lo, hi + 1)):
                      continue
          
                  # Require real subtitle presence around the peak.
                  left = np.mean([x["score"] for x in fine_frames[max(0, i-3):i]])
                  right = np.mean([x["score"] for x in fine_frames[i+1:min(len(fine_frames), i+4)]])
                  if left < 0.00035 or right < 0.00035:
                      continue
          
                  candidates.append(i)
          
              selected = []
              for i in sorted(candidates, key=lambda x: fine_frames[x]["change"], reverse=True):
                  if all(abs(i - j) >= min_gap for j in selected):
                      selected.append(i)
              selected = sorted(selected)
          
              if not selected:
                  return None
          
              indexes = [0, *selected, len(fine_frames)]
              cues = []
              for k in range(len(indexes) - 1):
                  a = indexes[k]
                  b = indexes[k + 1] - 1
                  if b < a:
                      continue
                  st = max(region_start, float(fine_frames[a]["time"]))
                  en = min(region_end, float(fine_frames[b]["time"] + 1.0 / FINE_RESCAN_FPS))
                  if en - st >= MIN_SEGMENT_DURATION:
                      cues.append({"start": st, "end": en})
          
              return cues if len(cues) > 1 else None
          
          def analyze_frame_time(time_sec, video_info):
              frame = get_frame(time_sec)
              if frame is None:
                  return {"score": 0.0}
              roi, _, _ = get_roi(frame, video_info)
              feat = subtitle_features(roi)
              return {"score": float(subtitle_score(feat))}
          
          def refine_start(approximate, threshold, video_info):
              fps = max(1.0, float(video_info["fps"]))
              step = 1.0 / fps
              left = max(0.0, approximate - REFINE_RADIUS)
              right = min(video_info["duration"], approximate + REFINE_RADIUS)
          
              # Search from early -> late and require two consecutive supporting frames.
              times = np.arange(left, right + step * 0.5, step)
              recent = []
              for time_sec in times:
                  score = analyze_frame_time(float(time_sec), video_info)["score"]
                  recent.append(score)
                  if len(recent) > 2:
                      recent.pop(0)
                  if len(recent) >= 2 and recent[-1] >= threshold and recent[-2] >= threshold:
                      return float(time_sec - step)
              return float(approximate)
          
          def refine_end(approximate, threshold, video_info):
              fps = max(1.0, float(video_info["fps"]))
              step = 1.0 / fps
              left = max(0.0, approximate - REFINE_RADIUS)
              right = min(video_info["duration"], approximate + REFINE_RADIUS)
          
              last_active = None
              weak_run = 0
              max_weak = max(1, int(round(0.06 * fps)))
          
              for time_sec in np.arange(left, right + step * 0.5, step):
                  score = analyze_frame_time(float(time_sec), video_info)["score"]
                  if score >= threshold:
                      last_active = float(time_sec)
                      weak_run = 0
                  else:
                      weak_run += 1
                      if last_active is not None and weak_run >= max_weak:
                          return min(video_info["duration"], last_active + step)
              if last_active is not None:
                  return min(video_info["duration"], last_active + step)
              return float(approximate)
          
          def refine_presence_boundaries(cues, threshold, video_info):
              # Very permissive threshold: we would rather extend a cue by a frame than
              # lose the first/last subtitle frame.
              refine_threshold = max(0.00035, threshold * 0.45)
              refined = []
              for cue in cues:
                  st = refine_start(cue["start"], refine_threshold, video_info)
                  en = refine_end(cue["end"], refine_threshold, video_info)
                  if en - st >= MIN_CUE_DURATION:
                      refined.append({"start": float(st), "end": float(en)})
              return refined
          
          def dedupe_and_fix_overlaps(cues, duration):
              if not cues:
                  return []
          
              cues = sorted(cues, key=lambda x: (x["start"], x["end"]))
              final = []
              for cue in cues:
                  st = max(0.0, float(cue["start"]))
                  en = min(duration, float(cue["end"]))
                  if en <= st:
                      continue
          
                  if final:
                      prev = final[-1]
                      # If two cues overlap only because boundary refinement expanded them,
                      # split at the midpoint instead of allowing invalid/ambiguous overlap.
                      if st < prev["end"]:
                          mid = (st + prev["end"]) / 2.0
                          prev["end"] = mid
                          st = mid
                      if en <= st:
                          continue
          
                  final.append({"start": st, "end": en})
          
              # Do not merge neighboring cues here: a short gap may be a genuine sentence
              # boundary, and missing a boundary is the user's main failure mode.
              return final
          
          def build_timing_cues(samples, global_threshold, local_active_mask, change_threshold, video_info, scan_fps):
              duration = video_info["duration"]
              regions = compute_active_regions(
                  samples, global_threshold, local_active_mask, duration, scan_fps
              )
              log(f"ACTIVE REGIONS = {len(regions)}")
          
              raw_cues = []
              fine_rescan_count = 0
          
              for region in regions:
                  parts = split_region_by_changes(
                      samples, region, change_threshold, duration, scan_fps
                  )
                  if not parts:
                      parts = [{"start": region["start"], "end": region["end"]}]
          
                  region_duration = region["end"] - region["start"]
          
                  # Unlike the old version, rescan *all* long regions, not only those that
                  # produced exactly one cue. This catches a long region where one boundary
                  # was found but two more were missed.
                  if region_duration >= FINE_RESCAN_MIN_DURATION:
                      log(
                          f"FINE RESCAN {region['start']:.3f}->{region['end']:.3f} "
                          f"({region_duration:.3f}s)"
                      )
                      fine_parts = fine_rescan_region(
                          video_info, region["start"], region["end"], change_threshold
                      )
                      if fine_parts and len(fine_parts) > len(parts):
                          fine_rescan_count += 1
                          log(f"FINE RESCAN improved {len(parts)} -> {len(fine_parts)} cues")
                          parts = fine_parts
          
                  raw_cues.extend(parts)
          
              log(
                  f"RAW TIMING CUES = {len(raw_cues)} "
                  f"(fine-rescanned regions = {fine_rescan_count})"
              )
          
              refined = refine_presence_boundaries(
                  raw_cues, global_threshold, video_info
              )
              final_cues = dedupe_and_fix_overlaps(refined, duration)
          
              final = []
              for index, cue in enumerate(final_cues):
                  st, en = float(cue["start"]), float(cue["end"])
                  if en <= st:
                      continue
                  final.append({
                      "index": int(index),
                      "start": st,
                      "end": en,
                      "duration": float(en - st),
                      "midpoint": float((st + en) / 2.0),
                  })
              return final
          
          def timing_pass():
              video_info = probe_video()
              width, height, duration = (
                  video_info["width"], video_info["height"], video_info["duration"]
              )
          
              actual_scan_fps = (
                  video_info["fps"] if SCAN_FPS <= 0 else min(SCAN_FPS, max(1.0, video_info["fps"] * 2.0))
              )
              roi_y1 = int(height * ROI_Y1_RATIO)
              roi_y2 = int(height * ROI_Y2_RATIO)
          
              log("\n==========================================")
              log("PASS 1 — NATIVE-FPS MULTI-SIGNAL TIMING")
              log("==========================================")
              log(f"VIDEO       : {width}x{height} @ {video_info['fps']:.6f}fps, {duration:.3f}s")
              log(f"SCAN FPS    : {actual_scan_fps:.6f} (0=input means native FPS)")
              log(f"FINE RESCAN : {FINE_RESCAN_FPS:.3f}fps")
              log(f"ROI         : y={roi_y1}..{roi_y2}")
              log(f"MAX_SHORT_GAP={MAX_SHORT_GAP}s | MIN_CUE_DURATION={MIN_CUE_DURATION}s")
          
              filter_graph = (
                  f"fps={actual_scan_fps:.6f},crop={width}:{roi_y2-roi_y1}:0:{roi_y1}"
              )
              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error",
                  "-i", str(VIDEO),
                  "-vf", filter_graph, "-an", "-sn", "-dn",
                  "-pix_fmt", "bgr24", "-f", "rawvideo", "-"
              ]
          
              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  bufsize=1024 * 1024 * 64
              )
          
              roi_width, roi_height = width, roi_y2 - roi_y1
              frame_size = roi_width * roi_height * 3
              expected = int(math.ceil(duration * actual_scan_fps))
          
              samples = []
              previous = None
              pbar = tqdm(total=expected, desc="Native timing scan")
              index = 0
          
              try:
                  while True:
                      raw = process.stdout.read(frame_size)
                      if len(raw) != frame_size:
                          break
          
                      roi = np.frombuffer(
                          raw, dtype=np.uint8
                      ).reshape((roi_height, roi_width, 3))
          
                      feat = subtitle_features(roi)
                      score = subtitle_score(feat)
          
                      current = {
                          "mask_sig": make_signature(feat),
                          "gray_sig": make_gray_signature(feat),
                      }
                      change = temporal_change(previous, current)
          
                      samples.append({
                          "index": int(index),
                          "time": float(index / actual_scan_fps),
                          "score": float(score),
                          "change": float(change),
                      })
          
                      previous = current
                      index += 1
                      pbar.update(1)
              finally:
                  pbar.close()
                  if process.stdout:
                      process.stdout.close()
                  stderr_data = b""
                  if process.stderr:
                      stderr_data = process.stderr.read()
                      process.stderr.close()
                  return_code = process.wait()
                  if return_code != 0:
                      raise RuntimeError(
                          "FFmpeg timing scan failed:\n"
                          + stderr_data.decode("utf-8", errors="replace")
                      )
          
              scores = [s["score"] for s in samples]
              global_threshold = calculate_global_threshold(scores)
              local_active_mask = calculate_local_active(scores, actual_scan_fps)
              compute_active_regions(
                  samples, global_threshold, local_active_mask, duration, actual_scan_fps
              )
          
              active_changes = [
                  samples[i]["change"]
                  for i in range(1, len(samples))
                  if samples[i]["active"] and samples[i-1]["active"]
              ]
              change_threshold = robust_threshold(
                  active_changes, floor=BOUNDARY_MIN_PROMINENCE
              )
          
              log(f"CHANGE THRESHOLD = {change_threshold:.6f}")
          
              timing_cues = build_timing_cues(
                  samples,
                  global_threshold,
                  local_active_mask,
                  change_threshold,
                  video_info,
                  actual_scan_fps
              )
          
              log(f"\nFINAL TIMING CUES = {len(timing_cues)}")
              for cue in timing_cues:
                  log(
                      "[%04d] %.6f -> %.6f mid=%.6f"
                      % (
                          cue["index"], cue["start"], cue["end"], cue["midpoint"]
                      )
                  )
          
              write_json(TIMING_JSON, {
                  "video": video_info,
                  "scan_fps_requested": float(SCAN_FPS),
                  "scan_fps_actual": float(actual_scan_fps),
                  "fine_rescan_fps": float(FINE_RESCAN_FPS),
                  "fine_rescan_min_duration": float(FINE_RESCAN_MIN_DURATION),
                  "roi": {"y1": int(roi_y1), "y2": int(roi_y2)},
                  "global_threshold": float(global_threshold),
                  "change_threshold": float(change_threshold),
                  "max_short_gap": float(MAX_SHORT_GAP),
                  "min_cue_duration": float(MIN_CUE_DURATION),
                  "local_window_seconds": float(LOCAL_WINDOW_SECONDS),
                  "samples": samples,
                  "cues": timing_cues,
              })
          
              return video_info, timing_cues
          
          def save_timing_srt(cues):
              lines = []
              for i, cue in enumerate(cues, 1):
                  start_ms = int(round(cue["start"] * 1000))
                  end_ms = int(round(cue["end"] * 1000))
                  if end_ms <= start_ms:
                      end_ms = start_ms + 100
          
                  def fmt(ms):
                      h = ms // 3600000
                      ms %= 3600000
                      m = ms // 60000
                      ms %= 60000
                      s = ms // 1000
                      milli = ms % 1000
                      return f"{h:02d}:{m:02d}:{s:02d},{milli:03d}"
          
                  lines.append(
                      f"{i}\n"
                      f"{fmt(start_ms)} --> {fmt(end_ms)}\n"
                      f"[TIMING_{i:04d}]\n"
                  )
          
              OUTPUT_SRT.write_text("\n".join(lines), encoding="utf-8")
          
          def main():
              if not VIDEO.exists():
                  raise RuntimeError(f"Video không tồn tại: {VIDEO}")
          
              video_info, timing_cues = timing_pass()
              save_timing_srt(timing_cues)
          
              write_json(DEBUG_JSON, {
                  "video": video_info,
                  "timing_cues": timing_cues,
              })
          
              log("\n==========================================")
              log("FINAL TIMING RESULT")
              log("==========================================")
              log(f"Timing cues : {len(timing_cues)}")
              log(f"Output      : {OUTPUT_SRT}")
          
              log("\n========== TIMING SRT ==========")
              if OUTPUT_SRT.exists():
                  print(OUTPUT_SRT.read_text(encoding="utf-8"))
              else:
                  log("Timing SRT không tồn tại.")
          
          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # RUN
      # ============================================================
      - name: Run subtitle extraction
        env:
          SCAN_FPS: ${{ inputs.scan_fps }}
          FINE_RESCAN_FPS: ${{ inputs.fine_rescan_fps }}
          FINE_RESCAN_MIN_DURATION: ${{ inputs.fine_rescan_min_duration }}
          REFINE_RADIUS: ${{ inputs.refine_radius }}
          MAX_SHORT_GAP: ${{ inputs.max_short_gap }}
          MIN_CUE_DURATION: ${{ inputs.min_cue_duration }}
          LOCAL_WINDOW_SECONDS: ${{ inputs.local_window_seconds }}
          LOCAL_MARGIN: ${{ inputs.local_margin }}
          SAVE_DEBUG_FRAMES: ${{ inputs.save_debug_frames }}
        run: |
          set -euxo pipefail
          python process.py

      # ============================================================
      # CHECK RESULT
      # ============================================================
      - name: Check timing result
        run: |
          set -euxo pipefail
          echo "=========================================="
          echo "FINAL TIMING SRT"
          echo "=========================================="

          if [ ! -s timing.srt ]; then
            echo "::error::timing.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          cat timing.srt

          echo ""
          echo "=========================================="
          echo "VALIDATE TIMING SRT"
          echo "=========================================="
          python - <<'PY'
          from pathlib import Path
          import re, sys

          text = Path("timing.srt").read_text(encoding="utf-8")
          blocks = [b for b in text.strip().split("\n\n") if b.strip()]
          timing_re = re.compile(
              r"^\d+\n"
              r"\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}\n"
              r"\[TIMING_\d{4}\]$"
          )

          print("Timing blocks:", len(blocks))

          if not blocks:
              print("::error::Không tìm thấy timing block.")
              sys.exit(1)

          for i, block in enumerate(blocks, 1):
              if not timing_re.match(block):
                  print(f"::error::Timing block {i} không đúng format SRT.")
                  print(block)
                  sys.exit(1)

          print("Timing SRT validation passed.")
          PY

          echo ""
          echo "=========================================="
          echo "TIMING JSON"
          echo "=========================================="
          if [ -f work/timing.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("work/timing.json").read_text(encoding="utf-8"))
          cues = data.get("cues", [])
          print("Timing cues:", len(cues))
          for cue in cues:
              print("[%04d] %.6f -> %.6f mid=%.6f" % (cue["index"], cue["start"], cue["end"], cue["midpoint"]))
          PY
          fi

      # ============================================================
      # UPLOAD DEBUG
      # ============================================================
      - name: Upload subtitle debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-debug
          path: |
            work/timing.json
            work/all_debug.json
            work/debug_frames/
            timing.srt
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # COMMIT SRT
      # ============================================================
      - name: Commit subtitle timing to repository
        run: |
          set -euxo pipefail
          if [ ! -s timing.srt ]; then
            echo "::error::timing.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timing.srt

          if git diff --cached --quiet; then
            echo "timing.srt không thay đổi, không cần commit."
          else
            git commit -m "extract: subtitle timing"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
