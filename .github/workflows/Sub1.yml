name: Bilibili Hard Subtitle Extractor — Audio/ASR Timing (faster-whisper + Silero VAD)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      model_size:
        description: "faster-whisper model. tiny/base/small = nhanh nhưng kém chính xác hơn với tiếng Trung nói nhanh/lẫn giọng vùng; medium = cân bằng tốt trên CPU của GitHub runner; large-v3 chính xác nhất nhưng chậm hơn nhiều (có thể vượt timeout job)"
        required: false
        default: "medium"
        type: choice
        options:
          - "tiny"
          - "base"
          - "small"
          - "medium"
          - "large-v3"

      language:
        description: "Mã ngôn ngữ ASR (zh = tiếng Trung). Để trống để faster-whisper tự nhận diện"
        required: false
        default: "zh"
        type: string

      compute_type:
        description: "CTranslate2 compute type trên CPU. int8 nhanh nhất/tốn ít RAM nhất, đổi sang float32 nếu cần chính xác số học cao hơn (hiếm khi cần cho việc này)"
        required: false
        default: "int8"
        type: string

      beam_size:
        description: "Beam size khi decode. Tăng lên (vd 8-10) có thể cho timestamp/nhận diện ổn định hơn nhưng chậm hơn"
        required: false
        default: "5"
        type: string

      vad_min_silence_ms:
        description: "Tham số vad_filter nội bộ của faster-whisper (dựa trên Silero VAD): khoảng lặng tối thiểu (ms) để coi là ranh giới giữa 2 đoạn thoại, dùng để loại nhạc nền/khoảng câm trước khi đưa vào ASR"
        required: false
        default: "300"
        type: string

      max_word_gap:
        description: "Khoảng lặng tối thiểu (giây) GIỮA 2 TỪ để buộc tách thành 2 câu sub khác nhau, kể cả khi cả 2 từ nằm trong cùng 1 segment mà Whisper tự nhận diện. Giảm xuống nếu 2 câu liền nhau bị gộp; tăng lên nếu 1 câu bị tách vụn giữa các từ"
        required: false
        default: "0.45"
        type: string

      max_cue_duration:
        description: "Nếu 1 cụm từ liên tục (không có khoảng lặng đủ lớn) kéo dài hơn giá trị này (giây), buộc tìm khoảng lặng nhỏ nhất gần giữa để tách — tránh 1 câu sub quá dài do thoại liên tục không ngắt hơi rõ"
        required: false
        default: "6.0"
        type: string

      speech_pad_seconds:
        description: "Nới thêm đầu/cuối mỗi cue (giây) vì mốc thời gian theo từ của Whisper đôi khi hơi khít so với lúc sub thực sự xuất hiện/biến mất trên hình"
        required: false
        default: "0.08"
        type: string

      min_cue_duration:
        description: "Loại bỏ cue cực ngắn sau khi xử lý (giây)"
        required: false
        default: "0.12"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      LC_ALL: "C.UTF-8"
      LANG: "C.UTF-8"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================
      # No opencv/libgl needed anymore — this pass never touches video frames.
      - name: Install system packages
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ============================================================
      # PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # CPU-only torch build (small download, no CUDA needed on the runner)
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            numpy \
            tqdm \
            faster-whisper \
            yt-dlp

      # ============================================================
      # PREPARE
      # ============================================================
      - name: Prepare directories
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work
          rm -f timing.srt process.py

      # ============================================================
      # BILIBILI COOKIES
      # ============================================================
      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euxo pipefail
          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi
          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt

      # ============================================================
      # DOWNLOAD
      # ============================================================
      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euxo pipefail
          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::work/source.mp4 không tồn tại."
            find work -maxdepth 2 -type f -ls
            exit 1
          fi
          ls -lh work/

      # ============================================================
      # EXTRACT AUDIO
      # ============================================================
      - name: Extract audio track
        run: |
          set -euxo pipefail
          # 16kHz mono PCM matches what Silero VAD / faster-whisper expect,
          # so no internal resampling surprises.
          ffmpeg -hide_banner -loglevel error -y \
            -i work/source.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le \
            work/audio.wav
          ls -lh work/audio.wav

      # ============================================================
      # CREATE PROCESS SCRIPT
      # ============================================================
      - name: Create subtitle timing script
        run: |
          cat > process.py <<'PY'
          """
          TIMING ONLY — audio/ASR-based hard-subtitle timing.

          Replaces the earlier pixel-diff (hard-sub image OCR-free detection)
          approach. That approach had to hand-tune per-video pixel thresholds
          for text color/edges/occupancy, which is fragile across fonts,
          outlines, busy backgrounds, and compression. Here, cue boundaries are
          derived from the AUDIO track instead, on the assumption that hard-sub
          cues track spoken dialogue (true for the vast majority of Bilibili
          drama/variety hard-subs).

          Pipeline, borrowing directly from well-established open-source
          speech-timing tools rather than reinventing signal processing:

          - faster-whisper (SYSTRAN/CTranslate2 port of OpenAI Whisper) does the
            heavy lifting: it decodes the audio with its own internal Silero VAD
            pre-filter (vad_filter=True) to strip music/silence before ASR, then
            returns per-WORD start/end timestamps (word_timestamps=True). Using
            a speech model instead of a raw energy/VAD threshold means the
            timing signal is robust to background music, sound effects, and
            noise in a way plain VAD or pixel analysis is not.
          - Whisper's own segments already correspond fairly well to spoken
            sentence-like chunks (this is analogous to what whisper-timestamped
            / stable-ts / WhisperX build on), but a segment can still bundle
            multiple subtitle lines together if the speaker doesn't pause much.
            So, similar in spirit to stable-ts's "regroup" step, we re-split
            each segment ourselves at its own internal word gaps
            (max_word_gap) and enforce a maximum cue duration
            (max_cue_duration) so one long uninterrupted line of dialogue does
            not become one giant subtitle cue. This mirrors the old script's
            "presence region -> content cluster split" idea, except the split
            signal is now silence-between-words instead of image content diff.
          - Each cue is padded slightly (speech_pad_seconds) since word-level
            ASR timestamps can be a touch tighter than when the hard-sub
            actually appears/disappears on screen, then cues are de-overlapped.

          No OCR is used. This script has no opinion on the actual subtitle
          text — timing.srt cues are placeholders ([TIMING_0001], ...), exactly
          like the previous image-based version, so it drops into the same
          downstream pipeline. The real ASR transcript IS kept in timing.json
          per cue purely for QA/debugging (to sanity-check that a cue's timing
          actually lines up with a spoken line), not as the final subtitle
          text.

          Known limitation vs. the old approach: this assumes on-screen hard
          subtitles line up with spoken audio. Silent on-screen text (titles,
          location cards, non-verbal captions) will NOT be picked up here,
          because there is no corresponding audio. If that matters for your
          videos, the old image-based pass is still the right tool for those
          cues, or the two signals should be combined/unioned.
          """

          import os
          import json
          import subprocess
          from pathlib import Path

          from faster_whisper import WhisperModel

          WORK = Path("work")
          AUDIO = WORK / "audio.wav"
          TIMING_JSON = WORK / "timing.json"
          OUTPUT_SRT = Path("timing.srt")

          def env_float(name, default):
              return float(os.environ.get(name, default))

          def env_str(name, default):
              value = os.environ.get(name, default)
              return value if value else default

          MODEL_SIZE = env_str("MODEL_SIZE", "medium")
          LANGUAGE = os.environ.get("LANGUAGE", "").strip() or None
          COMPUTE_TYPE = env_str("COMPUTE_TYPE", "int8")
          BEAM_SIZE = int(env_float("BEAM_SIZE", "5"))
          VAD_MIN_SILENCE_MS = int(env_float("VAD_MIN_SILENCE_MS", "300"))
          MAX_WORD_GAP = env_float("MAX_WORD_GAP", "0.45")
          MAX_CUE_DURATION = env_float("MAX_CUE_DURATION", "6.0")
          SPEECH_PAD_SECONDS = env_float("SPEECH_PAD_SECONDS", "0.08")
          MIN_CUE_DURATION = env_float("MIN_CUE_DURATION", "0.12")

          def log(message):
              print(message, flush=True)

          def probe_duration():
              cmd = [
                  "ffprobe", "-hide_banner", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "json", str(AUDIO),
              ]
              result = subprocess.run(
                  cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, check=True
              )
              return float(json.loads(result.stdout)["format"]["duration"])

          def transcribe():
              log(f"Loading faster-whisper model={MODEL_SIZE} compute_type={COMPUTE_TYPE}")
              model = WhisperModel(MODEL_SIZE, device="cpu", compute_type=COMPUTE_TYPE)

              log(
                  f"Transcribing (language={LANGUAGE or 'auto'}, beam_size={BEAM_SIZE}, "
                  f"vad_min_silence_ms={VAD_MIN_SILENCE_MS}) ..."
              )
              segments, info = model.transcribe(
                  str(AUDIO),
                  language=LANGUAGE,
                  beam_size=BEAM_SIZE,
                  word_timestamps=True,
                  vad_filter=True,
                  vad_parameters=dict(min_silence_duration_ms=VAD_MIN_SILENCE_MS),
                  condition_on_previous_text=False,
              )

              log(
                  f"Detected language={info.language} "
                  f"(p={info.language_probability:.3f}) duration={info.duration:.3f}s"
              )

              all_words = []
              raw_segments = []
              for seg in segments:
                  words = list(seg.words or [])
                  if not words:
                      # Fallback: no word-level breakdown for this segment (rare),
                      # keep it as a single atomic chunk instead of dropping it.
                      words = [type("W", (), {
                          "start": seg.start, "end": seg.end, "word": seg.text.strip()
                      })()]
                  raw_segments.append({
                      "start": float(seg.start),
                      "end": float(seg.end),
                      "text": seg.text.strip(),
                  })
                  for w in words:
                      all_words.append({
                          "start": float(w.start),
                          "end": float(w.end),
                          "text": str(w.word).strip(),
                          "segment_start": float(seg.start),
                          "segment_end": float(seg.end),
                      })

              log(f"ASR segments = {len(raw_segments)} | words = {len(all_words)}")
              return all_words, raw_segments, info

          def split_words_into_cues(words):
              """
              Group words into cues. Never merges across a Whisper segment
              boundary. Within a segment, starts a new cue whenever:
                - the silent gap to the previous word exceeds MAX_WORD_GAP, or
                - the running cue would exceed MAX_CUE_DURATION and there is at
                  least some small gap to split at (so we don't cut a word in
                  half; if truly zero gap exists, the cue is allowed to run
                  long rather than mangling a word boundary).
              """
              cues = []
              current = None

              def flush():
                  nonlocal current
                  if current is not None and current["words"]:
                      cues.append(current)
                  current = None

              prev_word = None
              for w in words:
                  new_segment = (
                      prev_word is not None
                      and w["segment_start"] != prev_word["segment_start"]
                  )
                  gap = (w["start"] - prev_word["end"]) if prev_word else None

                  start_new = current is None or new_segment
                  if not start_new and gap is not None and gap >= MAX_WORD_GAP:
                      start_new = True
                  if (
                      not start_new
                      and current is not None
                      and (w["end"] - current["start"]) > MAX_CUE_DURATION
                      and gap is not None
                      and gap > 0.02
                  ):
                      start_new = True

                  if start_new:
                      flush()
                      current = {"start": w["start"], "end": w["end"], "words": [w]}
                  else:
                      current["end"] = w["end"]
                      current["words"].append(w)

                  prev_word = w

              flush()
              return cues

          def pad_and_dedupe(cues, duration):
              padded = []
              for cue in cues:
                  st = max(0.0, cue["start"] - SPEECH_PAD_SECONDS)
                  en = min(duration, cue["end"] + SPEECH_PAD_SECONDS)
                  padded.append({
                      "start": st,
                      "end": en,
                      "text": "".join(w["text"] for w in cue["words"]),
                  })

              padded.sort(key=lambda c: (c["start"], c["end"]))
              final = []
              for cue in padded:
                  st, en = cue["start"], cue["end"]
                  if final:
                      prev = final[-1]
                      if st < prev["end"]:
                          mid = (st + prev["end"]) / 2.0
                          prev["end"] = mid
                          st = mid
                  if en - st < MIN_CUE_DURATION:
                      continue
                  final.append({"start": st, "end": en, "text": cue["text"]})
              return final

          def save_timing_srt(cues):
              lines = []
              for i, cue in enumerate(cues, 1):
                  start_ms = int(round(cue["start"] * 1000))
                  end_ms = int(round(cue["end"] * 1000))
                  if end_ms <= start_ms:
                      end_ms = start_ms + 100

                  def fmt(ms):
                      h = ms // 3600000
                      ms %= 3600000
                      m = ms // 60000
                      ms %= 60000
                      s = ms // 1000
                      milli = ms % 1000
                      return f"{h:02d}:{m:02d}:{s:02d},{milli:03d}"

                  lines.append(
                      f"{i}\n"
                      f"{fmt(start_ms)} --> {fmt(end_ms)}\n"
                      f"[TIMING_{i:04d}]\n"
                  )

              OUTPUT_SRT.write_text("\n".join(lines), encoding="utf-8")

          def main():
              if not AUDIO.exists():
                  raise RuntimeError(f"Audio không tồn tại: {AUDIO}")

              duration = probe_duration()
              words, raw_segments, info = transcribe()

              grouped = split_words_into_cues(words)
              log(f"CUES BEFORE PAD/DEDUPE = {len(grouped)}")

              final_cues = pad_and_dedupe(grouped, duration)
              log(f"FINAL TIMING CUES = {len(final_cues)}")

              for i, cue in enumerate(final_cues, 1):
                  log(
                      "[%04d] %.6f -> %.6f  (asr: %s)"
                      % (i, cue["start"], cue["end"], cue["text"][:40])
                  )

              save_timing_srt(final_cues)

              write_data = {
                  "duration": duration,
                  "model_size": MODEL_SIZE,
                  "language_requested": LANGUAGE,
                  "language_detected": info.language,
                  "language_probability": float(info.language_probability),
                  "max_word_gap": MAX_WORD_GAP,
                  "max_cue_duration": MAX_CUE_DURATION,
                  "speech_pad_seconds": SPEECH_PAD_SECONDS,
                  "min_cue_duration": MIN_CUE_DURATION,
                  "vad_min_silence_ms": VAD_MIN_SILENCE_MS,
                  "asr_segments": raw_segments,
                  "cues": [
                      {
                          "index": i,
                          "start": cue["start"],
                          "end": cue["end"],
                          "duration": cue["end"] - cue["start"],
                          "asr_text_reference_only": cue["text"],
                      }
                      for i, cue in enumerate(final_cues, 1)
                  ],
              }
              TIMING_JSON.write_text(
                  json.dumps(write_data, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              log("\n==========================================")
              log("FINAL TIMING RESULT")
              log("==========================================")
              log(f"Timing cues : {len(final_cues)}")
              log(f"Output      : {OUTPUT_SRT}")

              log("\n========== TIMING SRT ==========")
              print(OUTPUT_SRT.read_text(encoding="utf-8"))

          if __name__ == "__main__":
              main()
          PY

      # ============================================================
      # RUN
      # ============================================================
      - name: Run subtitle timing extraction
        env:
          MODEL_SIZE: ${{ inputs.model_size }}
          LANGUAGE: ${{ inputs.language }}
          COMPUTE_TYPE: ${{ inputs.compute_type }}
          BEAM_SIZE: ${{ inputs.beam_size }}
          VAD_MIN_SILENCE_MS: ${{ inputs.vad_min_silence_ms }}
          MAX_WORD_GAP: ${{ inputs.max_word_gap }}
          MAX_CUE_DURATION: ${{ inputs.max_cue_duration }}
          SPEECH_PAD_SECONDS: ${{ inputs.speech_pad_seconds }}
          MIN_CUE_DURATION: ${{ inputs.min_cue_duration }}
        run: |
          set -euxo pipefail
          python process.py

      # ============================================================
      # CHECK RESULT
      # ============================================================
      - name: Check timing result
        run: |
          set -euxo pipefail
          echo "=========================================="
          echo "FINAL TIMING SRT"
          echo "=========================================="

          if [ ! -s timing.srt ]; then
            echo "::error::timing.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          cat timing.srt

          echo ""
          echo "=========================================="
          echo "VALIDATE TIMING SRT"
          echo "=========================================="
          python - <<'PY'
          from pathlib import Path
          import re, sys

          text = Path("timing.srt").read_text(encoding="utf-8")
          blocks = [b for b in text.strip().split("\n\n") if b.strip()]
          timing_re = re.compile(
              r"^\d+\n"
              r"\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}\n"
              r"\[TIMING_\d{4}\]$"
          )

          print("Timing blocks:", len(blocks))

          if not blocks:
              print("::error::Không tìm thấy timing block.")
              sys.exit(1)

          for i, block in enumerate(blocks, 1):
              if not timing_re.match(block):
                  print(f"::error::Timing block {i} không đúng format SRT.")
                  print(block)
                  sys.exit(1)

          print("Timing SRT validation passed.")
          PY

          echo ""
          echo "=========================================="
          echo "TIMING JSON (ASR reference text, QA only)"
          echo "=========================================="
          if [ -f work/timing.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("work/timing.json").read_text(encoding="utf-8"))
          cues = data.get("cues", [])
          print("Timing cues:", len(cues))
          print("Detected language:", data.get("language_detected"))
          for cue in cues:
              print(
                  "[%04d] %.6f -> %.6f  | %s"
                  % (cue["index"], cue["start"], cue["end"], cue["asr_text_reference_only"])
              )
          PY
          fi

      # ============================================================
      # UPLOAD DEBUG
      # ============================================================
      - name: Upload subtitle debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-debug
          path: |
            work/timing.json
            work/audio.wav
            timing.srt
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # COMMIT SRT
      # ============================================================
      - name: Commit subtitle timing to repository
        run: |
          set -euxo pipefail
          if [ ! -s timing.srt ]; then
            echo "::error::timing.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timing.srt

          if git diff --cached --quiet; then
            echo "timing.srt không thay đổi, không cần commit."
          else
            git commit -m "extract: subtitle timing (audio/ASR)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
