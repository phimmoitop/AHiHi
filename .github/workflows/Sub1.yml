          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt khong ton tai hoac rong."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chinese.srt

          if git diff --cached --quiet; then
            echo "chinese.srt khong thay doi, khong can commit."
          else
