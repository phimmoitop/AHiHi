name: Bilibili Hard Subtitle → Accurate Timing → Midpoint OCR

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_fps:
        description: "FPS dùng để phát hiện timing. 10-15 là hợp lý"
        required: false
        default: "12"
        type: string

      refine_iterations:
        description: "Số vòng binary search để refine START/END"
        required: false
        default: "8"
        type: string

      min_subtitle_seconds:
        description: "Subtitle tối thiểu (giây)"
        required: false
        default: "0.20"
        type: string

permissions:
  contents: write

jobs:

  process:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # SYSTEM
      # ============================================================

      - name: Install system packages
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            tqdm \
            pysubs2 \
            yt-dlp

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install \
            paddleocr==3.3.2


      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        run: |
          set -eux

          mkdir -p work

          rm -f chinese.srt
          rm -f work/timing.json
          rm -f work/ocr.json
          rm -f work/cookies.txt


      # ============================================================
      # COOKIES
      # ============================================================

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi

          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt

          chmod 600 work/cookies.txt


      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::Không tìm thấy work/source.mp4"
            find work -maxdepth 2 -type f -ls
            exit 1
          fi

          ls -lh work/


      # ============================================================
      # CREATE PROCESS SCRIPT
      # ============================================================

      - name: Create processing script
        run: |

          cat > process.py <<'PY'

          import os
          import re
          import json
          import subprocess
          from pathlib import Path

          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm
          from paddleocr import PaddleOCR


          # ============================================================
          # PATHS
          # ============================================================

          WORK = Path("work")

          VIDEO = WORK / "source.mp4"

          TIMING_JSON = WORK / "timing.json"

          OCR_JSON = WORK / "ocr.json"

          OUTPUT_SRT = Path("chinese.srt")


          # ============================================================
          # CONFIG
          # ============================================================

          SCAN_FPS = float(
              os.environ.get(
                  "SCAN_FPS",
                  "12"
              )
          )

          REFINE_ITERATIONS = int(
              os.environ.get(
                  "REFINE_ITERATIONS",
                  "8"
              )
          )

          MIN_SUBTITLE_SECONDS = float(
              os.environ.get(
                  "MIN_SUBTITLE_SECONDS",
                  "0.20"
              )
          )


          # ============================================================
          # ROI
          # ============================================================
          #
          # Subtitle tiếng Trung hard-sub thường nằm ở 65-100%.
          #
          # Không crop quá sát lúc đầu vì subtitle có thể nằm hơi cao.
          #

          ROI_Y1_RATIO = 0.62

          ROI_Y2_RATIO = 0.98


          # ============================================================
          # TEMPORAL DETECTION CONFIG
          # ============================================================

          #
          # Ta không dùng một occupancy threshold cố định.
          #
          # Mỗi frame được biến thành:
          #
          #   "subtitle mask"
          #
          # sau đó so sánh temporal.
          #

          BLUR_SIZE = 3

          ADAPTIVE_BLOCK_SIZE = 31

          ADAPTIVE_C = 8

          MORPH_KERNEL = 3

          MIN_COMPONENT_AREA = 8

          MIN_TEXT_HEIGHT = 5

          MAX_TEXT_HEIGHT_RATIO = 0.25


          #
          # Subtitle thường là những vùng:
          #
          # - sáng hơn background
          # - hoặc rất sáng sau threshold
          #
          # Ta chạy cả:
          #
          #   grayscale bright
          #   local adaptive threshold
          #
          # rồi OR chúng lại.
          #


          # ============================================================
          # OCR
          # ============================================================

          OCR_UPSCALE = 3.0

          OCR_DET_LIMIT = 3000

          OCR_MIN_SCORE = 0.35


          # ============================================================
          # UTILS
          # ============================================================

          def log(message):
              print(message, flush=True)


          def normalize_text(text):

              text = str(text).strip()

              text = re.sub(
                  r"\s+",
                  "",
                  text
              )

              return text


          def chinese_count(text):

              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      str(text)
                  )
              )


          # ============================================================
          # VIDEO INFO
          # ============================================================

          def probe_video():

              cmd = [
                  "ffprobe",
                  "-hide_banner",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width,height,r_frame_rate",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "json",
                  str(VIDEO)
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              fps_num, fps_den = (
                  stream["r_frame_rate"]
                  .split("/")
              )

              fps = (
                  float(fps_num)
                  / float(fps_den)
              )

              duration = float(
                  data["format"]["duration"]
              )

              return (
                  width,
                  height,
                  fps,
                  duration
              )


          # ============================================================
          # FRAME EXTRACTION
          # ============================================================

          def get_frame(time_sec):

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-ss",
                  f"{max(0, time_sec):.6f}",
                  "-i",
                  str(VIDEO),
                  "-frames:v",
                  "1",
                  "-f",
                  "image2pipe",
                  "-vcodec",
                  "mjpeg",
                  "-"
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE
              )

              if (
                  result.returncode != 0
                  or not result.stdout
              ):
                  return None

              raw = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8
              )

              return cv2.imdecode(
                  raw,
                  cv2.IMREAD_COLOR
              )


          # ============================================================
          # SUBTITLE MASK
          # ============================================================

          def build_subtitle_mask(frame):

              h, w = frame.shape[:2]

              y1 = int(
                  h * ROI_Y1_RATIO
              )

              y2 = int(
                  h * ROI_Y2_RATIO
              )

              roi = frame[
                  y1:y2,
                  :
              ]

              gray = cv2.cvtColor(
                  roi,
                  cv2.COLOR_BGR2GRAY
              )

              gray = cv2.GaussianBlur(
                  gray,
                  (
                      BLUR_SIZE,
                      BLUR_SIZE
                  ),
                  0
              )

              # --------------------------------------------------------
              # Method 1:
              # Bright pixels
              # --------------------------------------------------------

              _, bright = cv2.threshold(
                  gray,
                  0,
                  255,
                  cv2.THRESH_BINARY
                  + cv2.THRESH_OTSU
              )

              # --------------------------------------------------------
              # Method 2:
              # Adaptive threshold
              # --------------------------------------------------------

              adaptive = cv2.adaptiveThreshold(
                  gray,
                  255,
                  cv2.ADAPTIVE_THRESH_GAUSSIAN_C,
                  cv2.THRESH_BINARY,
                  ADAPTIVE_BLOCK_SIZE,
                  ADAPTIVE_C
              )

              mask = cv2.bitwise_or(
                  bright,
                  adaptive
              )

              # --------------------------------------------------------
              # Morphology
              # --------------------------------------------------------

              kernel = cv2.getStructuringElement(
                  cv2.MORPH_RECT,
                  (
                      MORPH_KERNEL,
                      MORPH_KERNEL
                  )
              )

              mask = cv2.morphologyEx(
                  mask,
                  cv2.MORPH_OPEN,
                  kernel
              )

              mask = cv2.morphologyEx(
                  mask,
                  cv2.MORPH_CLOSE,
                  kernel
              )

              return mask


          # ============================================================
          # TEXT-LIKE SCORE
          # ============================================================

          def subtitle_score(frame):

              mask = build_subtitle_mask(
                  frame
              )

              h, w = mask.shape

              total_pixels = h * w

              if total_pixels <= 0:
                  return 0.0

              #
              # Connected components.
              #

              num_labels, labels, stats, _ = (
                  cv2.connectedComponentsWithStats(
                      mask,
                      connectivity=8
                  )
              )

              good_area = 0

              good_components = 0

              for i in range(
                  1,
                  num_labels
              ):

                  x = stats[
                      i,
                      cv2.CC_STAT_LEFT
                  ]

                  y = stats[
                      i,
                      cv2.CC_STAT_TOP
                  ]

                  cw = stats[
                      i,
                      cv2.CC_STAT_WIDTH
                  ]

                  ch = stats[
                      i,
                      cv2.CC_STAT_HEIGHT
                  ]

                  area = stats[
                      i,
                      cv2.CC_STAT_AREA
                  ]

                  if area < MIN_COMPONENT_AREA:
                      continue

                  if ch < MIN_TEXT_HEIGHT:
                      continue

                  if ch > (
                      h
                      * MAX_TEXT_HEIGHT_RATIO
                  ):
                      continue

                  #
                  # Chinese subtitle thường tạo ra
                  # nhiều connected components nhỏ.
                  #

                  good_area += area

                  good_components += 1

              occupancy = (
                  good_area
                  / max(1, total_pixels)
              )

              #
              # Không chỉ dùng occupancy.
              #
              # Số component cũng là tín hiệu.
              #

              component_signal = min(
                  1.0,
                  good_components / 30.0
              )

              score = (
                  occupancy * 0.65
                  + component_signal * 0.35
              )

              return float(score)


          # ============================================================
          # TEMPORAL FRAME ANALYSIS
          # ============================================================

          def load_scan_frames():

              (
                  width,
                  height,
                  video_fps,
                  duration
              ) = probe_video()

              total = int(
                  np.ceil(
                      duration
                      * SCAN_FPS
                  )
              )

              log("")
              log(
                  "=========================================="
              )

              log(
                  "PASS 1 — SUBTITLE TIMING DETECTION"
              )

              log(
                  "=========================================="
              )

              log(
                  f"VIDEO       : "
                  f"{width}x{height}"
              )

              log(
                  f"VIDEO FPS   : "
                  f"{video_fps:.3f}"
              )

              log(
                  f"DURATION    : "
                  f"{duration:.3f}s"
              )

              log(
                  f"SCAN FPS    : "
                  f"{SCAN_FPS}"
              )

              log(
                  f"ROI         : "
                  f"y={int(height*ROI_Y1_RATIO)}.."
                  f"{int(height*ROI_Y2_RATIO)}"
              )

              log(
                  "OCR         : DISABLED"
              )

              log(
                  "Timing      : TEMPORAL PIXEL ANALYSIS"
              )

              frames = []

              times = []

              scores = []

              for index in tqdm(
                  range(total),
                  desc="Timing scan"
              ):

                  t = (
                      index
                      / SCAN_FPS
                  )

                  if t >= duration:
                      break

                  frame = get_frame(t)

                  if frame is None:
                      continue

                  score = subtitle_score(
                      frame
                  )

                  frames.append(
                      frame
                  )

                  times.append(t)

                  scores.append(score)

              return (
                  frames,
                  times,
                  scores,
                  duration
              )


          # ============================================================
          # ROBUST THRESHOLD
          # ============================================================

          def calculate_threshold(scores):

              values = np.asarray(
                  scores,
                  dtype=np.float32
              )

              if len(values) == 0:
                  return 0.0

              #
              # Không dùng threshold cố định.
              #
              # Tính distribution.
              #

              p50 = float(
                  np.percentile(
                      values,
                      50
                  )
              )

              p75 = float(
                  np.percentile(
                      values,
                      75
                  )
              )

              p90 = float(
                  np.percentile(
                      values,
                      90
                  )
              )

              p95 = float(
                  np.percentile(
                      values,
                      95
                  )
              )

              #
              # Subtitle frame thường tạo peak.
              #
              # Chọn threshold giữa baseline và peak.
              #

              baseline = p50

              peak = max(
                  p90,
                  p95
              )

              threshold = (
                  baseline
                  + (
                      peak
                      - baseline
                  )
                  * 0.35
              )

              #
              # Safety bounds.
              #

              threshold = max(
                  0.002,
                  threshold
              )

              threshold = min(
                  threshold,
                  0.20
              )

              log("")
              log(
                  f"SCORE P50 = {p50:.6f}"
              )

              log(
                  f"SCORE P75 = {p75:.6f}"
              )

              log(
                  f"SCORE P90 = {p90:.6f}"
              )

              log(
                  f"SCORE P95 = {p95:.6f}"
              )

              log(
                  f"DETECTION THRESHOLD = "
                  f"{threshold:.6f}"
              )

              return threshold


          # ============================================================
          # TEMPORAL SEGMENTS
          # ============================================================

          def make_segments(
              times,
              scores,
              threshold
          ):

              if not scores:
                  return []

              active = False

              start_index = None

              segments = []

              for i, score in enumerate(
                  scores
              ):

                  is_sub = (
                      score >= threshold
                  )

                  if (
                      is_sub
                      and not active
                  ):

                      active = True

                      start_index = i

                  elif (
                      not is_sub
                      and active
                  ):

                      end_index = i - 1

                      segments.append(
                          (
                              start_index,
                              end_index
                          )
                      )

                      active = False

                      start_index = None

              if active:

                  segments.append(
                      (
                          start_index,
                          len(scores) - 1
                      )
                  )

              #
              # Convert + filter.
              #

              result = []

              for start_i, end_i in segments:

                  start = times[
                      start_i
                  ]

                  end = (
                      times[end_i]
                      + 1.0 / SCAN_FPS
                  )

                  if (
                      end - start
                      < MIN_SUBTITLE_SECONDS
                  ):
                      continue

                  result.append(
                      {
                          "coarse_start": start,
                          "coarse_end": end,
                          "start_index": start_i,
                          "end_index": end_i
                      }
                  )

              return result


          # ============================================================
          # BINARY SEARCH TRANSITION
          # ============================================================

          def frame_is_subtitle(
              time_sec,
              threshold
          ):

              frame = get_frame(
                  time_sec
              )

              if frame is None:
                  return False

              score = subtitle_score(
                  frame
              )

              return (
                  score >= threshold
              )


          def refine_start(
              low,
              high,
              threshold
          ):

              #
              # low  = definitely NO subtitle
              # high = definitely subtitle
              #

              for _ in range(
                  REFINE_ITERATIONS
              ):

                  mid = (
                      low + high
                  ) / 2.0

                  if frame_is_subtitle(
                      mid,
                      threshold
                  ):
                      high = mid
                  else:
                      low = mid

              return high


          def refine_end(
              low,
              high,
              threshold
          ):

              #
              # low  = definitely subtitle
              # high = definitely NO subtitle
              #

              for _ in range(
                  REFINE_ITERATIONS
              ):

                  mid = (
                      low + high
                  ) / 2.0

                  if frame_is_subtitle(
                      mid,
                      threshold
                  ):
                      low = mid
                  else:
                      high = mid

              return low


          # ============================================================
          # REFINE ALL TIMINGS
          # ============================================================

          def refine_segments(
              coarse_segments,
              times,
              scores,
              threshold,
              duration
          ):

              result = []

              step = (
                  1.0 / SCAN_FPS
              )

              for segment in coarse_segments:

                  si = segment[
                      "start_index"
                  ]

                  ei = segment[
                      "end_index"
                  ]

                  #
                  # START
                  #

                  if si == 0:

                      start = times[si]

                  else:

                      low = max(
                          0.0,
                          times[si] - step
                      )

                      high = times[si]

                      start = refine_start(
                          low,
                          high,
                          threshold
                      )

                  #
                  # END
                  #

                  if ei >= len(times) - 1:

                      end = min(
                          duration,
                          times[ei] + step
                      )

                  else:

                      low = times[ei]

                      high = min(
                          duration,
                          times[ei] + step
                      )

                      end = refine_end(
                          low,
                          high,
                          threshold
                      )

                  if (
                      end - start
                      < MIN_SUBTITLE_SECONDS
                  ):
                      continue

                  result.append(
                      {
                          "start": round(
                              start,
                              6
                          ),
                          "end": round(
                              end,
                              6
                          ),
                          "duration": round(
                              end - start,
                              6
                          ),
                          "midpoint": round(
                              (
                                  start
                                  + end
                              ) / 2.0,
                              6
                          )
                      }
                  )

              return result


          # ============================================================
          # SAVE DEBUG TIMING
          # ============================================================

          def save_timing(
              timing_cues,
              times,
              scores,
              threshold
          ):

              data = {
                  "scan_fps": SCAN_FPS,
                  "threshold": threshold,
                  "samples": [
                      {
                          "time": round(
                              float(t),
                              6
                          ),
                          "score": round(
                              float(s),
                              8
                          )
                      }
                      for t, s in zip(
                          times,
                          scores
                      )
                  ],
                  "cues": timing_cues
              }

              TIMING_JSON.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          # ============================================================
          # FIND BEST OCR CROP
          # ============================================================

          def find_text_bbox(
              frame
          ):

              h, w = frame.shape[:2]

              y1 = int(
                  h * ROI_Y1_RATIO
              )

              y2 = int(
                  h * ROI_Y2_RATIO
              )

              roi = frame[
                  y1:y2,
                  :
              ]

              gray = cv2.cvtColor(
                  roi,
                  cv2.COLOR_BGR2GRAY
              )

              #
              # Threshold chữ sáng.
              #

              _, mask = cv2.threshold(
                  gray,
                  0,
                  255,
                  cv2.THRESH_BINARY
                  + cv2.THRESH_OTSU
              )

              #
              # Connected components.
              #

              num_labels, labels, stats, _ = (
                  cv2.connectedComponentsWithStats(
                      mask,
                      connectivity=8
                  )
              )

              boxes = []

              for i in range(
                  1,
                  num_labels
              ):

                  x = stats[
                      i,
                      cv2.CC_STAT_LEFT
                  ]

                  y = stats[
                      i,
                      cv2.CC_STAT_TOP
                  ]

                  cw = stats[
                      i,
                      cv2.CC_STAT_WIDTH
                  ]

                  ch = stats[
                      i,
                      cv2.CC_STAT_HEIGHT
                  ]

                  area = stats[
                      i,
                      cv2.CC_STAT_AREA
                  ]

                  if area < 8:
                      continue

                  if ch < 5:
                      continue

                  if ch > (
                      roi.shape[0] * 0.25
                  ):
                      continue

                  boxes.append(
                      (
                          x,
                          y,
                          cw,
                          ch,
                          area
                      )
                  )

              if not boxes:

                  return (
                      0,
                      y1,
                      w,
                      y2
                  )

              #
              # Gom tất cả component.
              #

              xs = [
                  b[0]
                  for b in boxes
              ]

              ys = [
                  b[1]
                  for b in boxes
              ]

              x2s = [
                  b[0] + b[2]
                  for b in boxes
              ]

              y2s = [
                  b[1] + b[3]
                  for b in boxes
              ]

              bx1 = max(
                  0,
                  min(xs) - 20
              )

              by1 = max(
                  0,
                  y1 + min(ys) - 15
              )

              bx2 = min(
                  w,
                  max(x2s) + 20
              )

              by2 = min(
                  h,
                  y1 + max(y2s) + 15
              )

              #
              # Nếu bbox quá rộng theo chiều dọc,
              # giữ nguyên ROI.
              #

              if (
                  by2 - by1
                  > h * 0.30
              ):

                  by1 = y1

                  by2 = y2

              return (
                  bx1,
                  by1,
                  bx2,
                  by2
              )


          # ============================================================
          # OCR PREPROCESS
          # ============================================================

          def preprocess_ocr(
              crop
          ):

              if (
                  crop is None
                  or crop.size == 0
              ):
                  return crop

              #
              # Upscale mạnh.
              #

              crop = cv2.resize(
                  crop,
                  None,
                  fx=OCR_UPSCALE,
                  fy=OCR_UPSCALE,
                  interpolation=cv2.INTER_CUBIC
              )

              #
              # LAB CLAHE.
              #

              lab = cv2.cvtColor(
                  crop,
                  cv2.COLOR_BGR2LAB
              )

              l, a, b = cv2.split(
                  lab
              )

              clahe = cv2.createCLAHE(
                  clipLimit=2.0,
                  tileGridSize=(8, 8)
              )

              l = clahe.apply(l)

              lab = cv2.merge(
                  (
                      l,
                      a,
                      b
                  )
              )

              return cv2.cvtColor(
                  lab,
                  cv2.COLOR_LAB2BGR
              )


          # ============================================================
          # OCR ONE MIDPOINT
          # ============================================================

          def ocr_midpoint(
              ocr,
              cue,
              duration
          ):

              midpoint = float(
                  cue["midpoint"]
              )

              frame = get_frame(
                  midpoint
              )

              if frame is None:

                  return {
                      "text": "",
                      "midpoint": midpoint,
                      "error": "frame_failed"
                  }

              #
              # Tìm bounding box chữ.
              #

              (
                  x1,
                  y1,
                  x2,
                  y2
              ) = find_text_bbox(
                  frame
              )

              crop = frame[
                  y1:y2,
                  x1:x2
              ]

              processed = preprocess_ocr(
                  crop
              )

              #
              # OCR
              #

              result = ocr.predict(
                  processed
              )

              texts = []

              scores = []

              for page in result:

                  try:

                      data = page.json

                      if callable(data):
                          data = data()

                  except Exception:

                      continue

                  if isinstance(
                      data,
                      str
                  ):

                      try:
                          data = json.loads(
                              data
                          )
                      except Exception:
                          continue

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  if isinstance(
                      data.get("res"),
                      dict
                  ):
                      data = data["res"]

                  rec_texts = data.get(
                      "rec_texts",
                      []
                  )

                  rec_scores = data.get(
                      "rec_scores",
                      []
                  )

                  for i, text in enumerate(
                      rec_texts
                  ):

                      text = normalize_text(
                          text
                      )

                      if not text:
                          continue

                      score = 1.0

                      if i < len(
                          rec_scores
                      ):

                          try:
                              score = float(
                                  rec_scores[i]
                              )
                          except Exception:
                              pass

                      if score < OCR_MIN_SCORE:
                          continue

                      if chinese_count(
                          text
                      ) == 0:
                          continue

                      texts.append(
                          text
                      )

                      scores.append(
                          score
                      )

              text = normalize_text(
                  "".join(texts)
              )

              return {
                  "text": text,
                  "midpoint": midpoint,
                  "bbox": [
                      x1,
                      y1,
                      x2,
                      y2
                  ],
                  "ocr_scores": scores
              }


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      f"Video not found: {VIDEO}"
                  )

              (
                  frames,
                  times,
                  scores,
                  duration
              ) = load_scan_frames()

              if not scores:

                  raise RuntimeError(
                      "Không đọc được frame nào."
                  )

              threshold = calculate_threshold(
                  scores
              )

              coarse_segments = make_segments(
                  times,
                  scores,
                  threshold
              )

              log("")

              log(
                  f"COARSE TIMING CUES = "
                  f"{len(coarse_segments)}"
              )

              timing_cues = refine_segments(
                  coarse_segments,
                  times,
                  scores,
                  threshold,
                  duration
              )

              log("")

              log(
                  "REFINED TIMING CUES = "
                  f"{len(timing_cues)}"
              )

              for i, cue in enumerate(
                  timing_cues
              ):

                  log(
                      f"[{i:04d}] "
                      f"{cue['start']:.6f} "
                      f"→ "
                      f"{cue['end']:.6f} "
                      f"mid="
                      f"{cue['midpoint']:.6f}"
                  )

              save_timing(
                  timing_cues,
                  times,
                  scores,
                  threshold
              )

              # ========================================================
              # PASS 2
              # ========================================================

              log("")
              log(
                  "=========================================="
              )

              log(
                  "PASS 2 — MIDPOINT OCR"
              )

              log(
                  "=========================================="
              )

              log(
                  "Timing source = PASS 1"
              )

              log(
                  "OCR frame = EXACT CUE MIDPOINT"
              )

              log(
                  f"Total cues = "
                  f"{len(timing_cues)}"
              )

              if not timing_cues:

                  log(
                      "WARNING: "
                      "PASS 1 không tìm thấy timing."
                  )

                  log(
                      "Không chạy OCR vì không có midpoint."
                  )

                  OUTPUT_SRT.write_text(
                      "",
                      encoding="utf-8"
                  )

                  OCR_JSON.write_text(
                      json.dumps(
                          {
                              "cues": []
                          },
                          ensure_ascii=False,
                          indent=2
                      ),
                      encoding="utf-8"
                  )

                  return

              log(
                  "Loading PaddleOCR..."
              )

              ocr = PaddleOCR(
                  lang="ch",
                  text_det_limit_side_len=OCR_DET_LIMIT,
                  text_det_limit_type="max"
              )

              ocr_results = []

              for cue in tqdm(
                  timing_cues,
                  desc="Midpoint OCR"
              ):

                  result = ocr_midpoint(
                      ocr,
                      cue,
                      duration
                  )

                  result.update(
                      {
                          "start": cue[
                              "start"
                          ],
                          "end": cue[
                              "end"
                          ]
                      }
                  )

                  ocr_results.append(
                      result
                  )

                  log(
                      f"[{cue['start']:.3f}"
                      f"→"
                      f"{cue['end']:.3f}] "
                      f"{result['text']!r}"
                  )

              # ========================================================
              # SAVE OCR JSON
              # ========================================================

              OCR_JSON.write_text(
                  json.dumps(
                      {
                          "cues": ocr_results
                      },
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              # ========================================================
              # WRITE SRT
              # ========================================================

              subs = pysubs2.SSAFile()

              for item in ocr_results:

                  text = item[
                      "text"
                  ]

                  if not text:
                      continue

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=int(
                              float(
                                  item["start"]
                              )
                              * 1000
                          ),
                          end=int(
                              float(
                                  item["end"]
                              )
                              * 1000
                          ),
                          text=text
                      )
                  )

              subs.save(
                  str(OUTPUT_SRT),
                  encoding="utf-8"
              )

              # ========================================================
              # SUMMARY
              # ========================================================

              log("")
              log(
                  "=========================================="
              )

              log(
                  "FINAL RESULT"
              )

              log(
                  "=========================================="
              )

              log(
                  f"Timing cues : "
                  f"{len(timing_cues)}"
              )

              log(
                  f"OCR cues    : "
                  f"{len(ocr_results)}"
              )

              log(
                  f"Output      : "
                  f"{OUTPUT_SRT}"
              )

              log(
                  f"Timing JSON : "
                  f"{TIMING_JSON}"
              )

              log(
                  f"OCR JSON    : "
                  f"{OCR_JSON}"
              )

              log(
                  "=========================================="
              )


          if __name__ == "__main__":
              main()

          PY


      # ============================================================
      # RUN
      # ============================================================

      - name: Run subtitle extraction
        env:
          SCAN_FPS: ${{ inputs.scan_fps }}
          REFINE_ITERATIONS: ${{ inputs.refine_iterations }}
          MIN_SUBTITLE_SECONDS: ${{ inputs.min_subtitle_seconds }}

          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

        run: |
          set -euo pipefail

          python process.py


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check output
        run: |
          set -euo pipefail

          echo ""
          echo "========== TIMING JSON =========="

          if [ -f work/timing.json ]; then
            cat work/timing.json
          fi

          echo ""
          echo "========== OCR JSON =========="

          if [ -f work/ocr.json ]; then
            cat work/ocr.json
          fi

          echo ""
          echo "========== FINAL SRT =========="

          if [ -f chinese.srt ]; then
            cat chinese.srt
          fi

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt rỗng."
            exit 1
          fi


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit Chinese subtitle
        run: |
          set -euo pipefail

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add chinese.srt

          if git diff --cached --quiet; then

            echo \
              "chinese.srt không thay đổi."

          else

            git commit \
              -m "extract: Chinese hard subtitle"

            git push \
              origin \
              HEAD:${{ github.ref_name }}

          fi


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt

          echo "Cookie removed."
