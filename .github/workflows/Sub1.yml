name: Bilibili Hard Subtitle Extractor → Accurate Timing + Midpoint OCR

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_fps:
        description: "FPS phân tích timing. 10-15 cho timing tốt."
        required: false
        default: "12"
        type: string

      roi_top:
        description: "Top của vùng subtitle (% chiều cao video)"
        required: false
        default: "70"
        type: string

      roi_bottom:
        description: "Bottom của vùng subtitle (% chiều cao video)"
        required: false
        default: "100"
        type: string

      min_duration:
        description: "Subtitle tối thiểu (giây)"
        required: false
        default: "0.25"
        type: string

      threshold:
        description: "Brightness threshold cho subtitle trắng"
        required: false
        default: "180"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            tqdm \
            pysubs2 \
            yt-dlp

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install \
            paddleocr==3.3.2


      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Prepare directories
        run: |
          set -eux

          mkdir -p work
          mkdir -p work/cues
          mkdir -p work/debug

          rm -f chinese.srt
          rm -f work/timing.json
          rm -f work/ocr.json
          rm -f work/debug/*


      # ============================================================
      # BILIBILI COOKIES
      # ============================================================

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi

          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt

          chmod 600 work/cookies.txt


      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::Không tìm thấy work/source.mp4."

            find work \
              -maxdepth 2 \
              -type f \
              -ls

            exit 1
          fi

          ls -lh work/


      # ============================================================
      # CREATE PROCESSOR
      # ============================================================

      - name: Create subtitle processor
        run: |

          cat > process.py <<'PY'

          import os
          import re
          import json
          import math
          import subprocess
          from pathlib import Path
          from collections import Counter

          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm

          from paddleocr import PaddleOCR


          # ============================================================
          # PATHS
          # ============================================================

          WORK = Path("work")

          VIDEO = WORK / "source.mp4"

          TIMING_JSON = WORK / "timing.json"

          OCR_JSON = WORK / "ocr.json"

          OUTPUT_SRT = Path("chinese.srt")

          CUE_DIR = WORK / "cues"

          DEBUG_DIR = WORK / "debug"


          # ============================================================
          # CONFIG
          # ============================================================

          SCAN_FPS = float(
              os.environ.get(
                  "SCAN_FPS",
                  "12",
              )
          )

          ROI_TOP_PERCENT = float(
              os.environ.get(
                  "ROI_TOP",
                  "70",
              )
          )

          ROI_BOTTOM_PERCENT = float(
              os.environ.get(
                  "ROI_BOTTOM",
                  "100",
              )
          )

          MIN_DURATION = float(
              os.environ.get(
                  "MIN_DURATION",
                  "0.25",
              )
          )

          BRIGHTNESS_THRESHOLD = int(
              os.environ.get(
                  "BRIGHTNESS_THRESHOLD",
                  "180",
              )
          )


          # ------------------------------------------------------------
          # Timing detection
          # ------------------------------------------------------------

          #
          # Subtitle thay đổi thường tạo ra pixel difference.
          #
          # Nhưng video bản thân nó cũng chuyển động.
          #
          # Vì vậy KHÔNG so sánh toàn bộ ROI.
          #
          # Ta:
          #
          #   1. grayscale
          #   2. threshold brightness
          #   3. morphology
          #   4. tính occupancy của bright subtitle pixels
          #
          # Với subtitle trắng:
          #
          # background thay đổi
          # nhưng subtitle vẫn tạo ra vùng bright ổn định.
          #
          # Ngoài ra dùng frame-to-frame difference để bắt
          # thời điểm subtitle xuất hiện / biến mất.
          #

          OCCUPANCY_MIN = 0.0008

          DIFF_PERCENTILE = 98.0

          START_CONFIRM_FRAMES = 2

          END_CONFIRM_FRAMES = 2

          # Cho phép gap nhỏ do video compression / fade.
          MAX_EMPTY_GAP = 0.20

          # ------------------------------------------------------------
          # Subtitle morphology
          # ------------------------------------------------------------

          MORPH_OPEN = 1

          MORPH_CLOSE = 3

          # ------------------------------------------------------------
          # OCR
          # ------------------------------------------------------------

          OCR_UPSCALE = 3.0

          OCR_DET_LIMIT = 2500

          OCR_MIN_SCORE = 0.35


          # ============================================================
          # LOG
          # ============================================================

          def log(message):

              print(
                  message,
                  flush=True,
              )


          # ============================================================
          # CHINESE
          # ============================================================

          def chinese_count(text):

              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      str(text),
                  )
              )


          def normalize_text(text):

              text = str(text).strip()

              text = re.sub(
                  r"\s+",
                  "",
                  text,
              )

              return text


          # ============================================================
          # VIDEO INFO
          # ============================================================

          def probe_video():

              cmd = [
                  "ffprobe",
                  "-hide_banner",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width,height,r_frame_rate",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "json",
                  str(VIDEO),
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True,
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              num, den = (
                  stream["r_frame_rate"]
                  .split("/")
              )

              fps = (
                  float(num)
                  / float(den)
              )

              duration = float(
                  data["format"]["duration"]
              )

              return (
                  width,
                  height,
                  fps,
                  duration,
              )


          # ============================================================
          # ROI
          # ============================================================

          def get_roi(height):

              y1 = int(
                  height
                  * ROI_TOP_PERCENT
                  / 100.0
              )

              y2 = int(
                  height
                  * ROI_BOTTOM_PERCENT
                  / 100.0
              )

              y1 = max(
                  0,
                  min(height - 1, y1),
              )

              y2 = max(
                  y1 + 1,
                  min(height, y2),
              )

              return (
                  y1,
                  y2,
              )


          # ============================================================
          # SUBTITLE MASK
          # ============================================================

          def subtitle_mask(frame):

              gray = cv2.cvtColor(
                  frame,
                  cv2.COLOR_BGR2GRAY,
              )

              # --------------------------------------------------------
              # Bright pixel threshold
              # --------------------------------------------------------

              _, mask = cv2.threshold(
                  gray,
                  BRIGHTNESS_THRESHOLD,
                  255,
                  cv2.THRESH_BINARY,
              )

              # --------------------------------------------------------
              # Remove isolated noise
              # --------------------------------------------------------

              if MORPH_OPEN > 0:

                  kernel = cv2.getStructuringElement(
                      cv2.MORPH_ELLIPSE,
                      (
                          MORPH_OPEN,
                          MORPH_OPEN,
                      ),
                  )

                  mask = cv2.morphologyEx(
                      mask,
                      cv2.MORPH_OPEN,
                      kernel,
                  )

              # --------------------------------------------------------
              # Connect letters
              # --------------------------------------------------------

              if MORPH_CLOSE > 0:

                  kernel = cv2.getStructuringElement(
                      cv2.MORPH_RECT,
                      (
                          MORPH_CLOSE,
                          MORPH_CLOSE,
                      ),
                  )

                  mask = cv2.morphologyEx(
                      mask,
                      cv2.MORPH_CLOSE,
                      kernel,
                  )

              return mask


          # ============================================================
          # MASK SCORE
          # ============================================================

          def mask_score(mask):

              if mask is None:
                  return 0.0

              white = cv2.countNonZero(
                  mask
              )

              total = (
                  mask.shape[0]
                  * mask.shape[1]
              )

              if total <= 0:
                  return 0.0

              return (
                  white
                  / total
              )


          # ============================================================
          # FRAME DIFFERENCE
          # ============================================================

          def frame_difference(
              previous,
              current,
          ):

              if (
                  previous is None
                  or current is None
              ):
                  return 0.0

              prev_gray = cv2.cvtColor(
                  previous,
                  cv2.COLOR_BGR2GRAY,
              )

              curr_gray = cv2.cvtColor(
                  current,
                  cv2.COLOR_BGR2GRAY,
              )

              diff = cv2.absdiff(
                  prev_gray,
                  curr_gray,
              )

              # Không dùng mean vì background movement
              # có thể làm mean lớn.
              #
              # percentile giúp bắt những vùng thay đổi mạnh.

              return float(
                  np.percentile(
                      diff,
                      DIFF_PERCENTILE,
                  )
              )


          # ============================================================
          # BUILD FRAME STREAM
          # ============================================================

          def frame_stream(
              width,
              height,
              y1,
              y2,
              duration,
          ):

              roi_width = width

              roi_height = (
                  y2 - y1
              )

              filter_graph = (
                  f"fps={SCAN_FPS},"
                  f"crop="
                  f"{roi_width}:"
                  f"{roi_height}:"
                  f"0:"
                  f"{y1}"
              )

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-i",
                  str(VIDEO),
                  "-vf",
                  filter_graph,
                  "-an",
                  "-sn",
                  "-dn",
                  "-pix_fmt",
                  "bgr24",
                  "-f",
                  "rawvideo",
                  "-",
              ]

              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  bufsize=1024 * 1024 * 64,
              )

              frame_size = (
                  roi_width
                  * roi_height
                  * 3
              )

              index = 0

              try:

                  while True:

                      raw = (
                          process.stdout.read(
                              frame_size
                          )
                      )

                      if len(raw) != frame_size:
                          break

                      frame = (
                          np.frombuffer(
                              raw,
                              dtype=np.uint8,
                          )
                          .reshape(
                              (
                                  roi_height,
                                  roi_width,
                                  3,
                              )
                          )
                      )

                      time_sec = (
                          index
                          / SCAN_FPS
                      )

                      yield (
                          index,
                          time_sec,
                          frame,
                      )

                      index += 1

              finally:

                  if process.stdout:
                      process.stdout.close()

                  stderr = b""

                  if process.stderr:

                      stderr = (
                          process.stderr.read()
                      )

                      process.stderr.close()

                  code = (
                      process.wait()
                  )

                  if code != 0:

                      raise RuntimeError(
                          "FFmpeg frame stream failed:\n"
                          + stderr.decode(
                              "utf-8",
                              errors="replace",
                          )
                      )


          # ============================================================
          # TIMING DETECTION
          # ============================================================

          def detect_timings():

              (
                  width,
                  height,
                  video_fps,
                  duration,
              ) = probe_video()

              y1, y2 = get_roi(
                  height
              )

              log("")
              log(
                  "=========================================="
              )
              log(
                  "PASS 1 — SUBTITLE TIMING DETECTION"
              )
              log(
                  "=========================================="
              )

              log(
                  f"VIDEO       : {width}x{height}"
              )

              log(
                  f"VIDEO FPS   : {video_fps:.3f}"
              )

              log(
                  f"DURATION    : {duration:.3f}s"
              )

              log(
                  f"SCAN FPS    : {SCAN_FPS}"
              )

              log(
                  f"ROI         : y={y1}..{y2}"
              )

              log(
                  "OCR         : DISABLED"
              )

              log(
                  "Timing      : PIXEL ANALYSIS ONLY"
              )

              # --------------------------------------------------------
              # First pass:
              #
              # determine baseline statistics
              #
              # --------------------------------------------------------

              samples = []

              previous_frame = None

              pbar = tqdm(
                  total=int(
                      math.ceil(
                          duration
                          * SCAN_FPS
                      )
                  ),
                  desc="Timing scan",
              )

              for (
                  index,
                  time_sec,
                  frame,
              ) in frame_stream(
                  width,
                  height,
                  y1,
                  y2,
                  duration,
              ):

                  mask = subtitle_mask(
                      frame
                  )

                  occupancy = mask_score(
                      mask
                  )

                  diff = frame_difference(
                      previous_frame,
                      frame,
                  )

                  samples.append(
                      {
                          "index": index,
                          "time": time_sec,
                          "occupancy": occupancy,
                          "diff": diff,
                      }
                  )

                  previous_frame = frame

                  pbar.update(1)

              pbar.close()

              if not samples:

                  raise RuntimeError(
                      "Không đọc được frame nào."
                  )

              # --------------------------------------------------------
              # Dynamic occupancy threshold
              #
              # Background bright pixels có thể rất nhiều.
              #
              # Ta dùng percentile thấp + absolute floor.
              # --------------------------------------------------------

              occupancy_values = np.array(
                  [
                      x["occupancy"]
                      for x in samples
                  ],
                  dtype=np.float32,
              )

              dynamic_threshold = max(
                  OCCUPANCY_MIN,
                  float(
                      np.percentile(
                          occupancy_values,
                          65,
                      )
                      * 1.8
                  ),
              )

              log(
                  f"Occupancy threshold = "
                  f"{dynamic_threshold:.6f}"
              )

              # --------------------------------------------------------
              # Detect raw active states
              # --------------------------------------------------------

              active = []

              for item in samples:

                  is_active = (
                      item["occupancy"]
                      >= dynamic_threshold
                  )

                  active.append(
                      is_active
                  )

              # --------------------------------------------------------
              # Temporal smoothing
              #
              # Subtitle có thể fade nhẹ hoặc compression làm
              # occupancy dao động.
              #
              # Không cho một vài frame empty phá cue.
              # --------------------------------------------------------

              gap_frames = max(
                  1,
                  int(
                      MAX_EMPTY_GAP
                      * SCAN_FPS
                  ),
              )

              # Fill short false gaps.

              i = 0

              while i < len(active):

                  if active[i]:

                      i += 1
                      continue

                  start = i

                  while (
                      i < len(active)
                      and not active[i]
                  ):
                      i += 1

                  end = i

                  gap_length = (
                      end - start
                  )

                  if (
                      gap_length
                      <= gap_frames
                      and start > 0
                      and end < len(active)
                      and active[start - 1]
                      and active[end]
                  ):

                      for j in range(
                          start,
                          end,
                      ):
                          active[j] = True


              # --------------------------------------------------------
              # Convert active states → raw cues
              # --------------------------------------------------------

              raw_cues = []

              start_index = None

              for index, state in enumerate(
                  active
              ):

                  if (
                      state
                      and start_index is None
                  ):

                      start_index = index

                  elif (
                      not state
                      and start_index is not None
                  ):

                      end_index = (
                          index - 1
                      )

                      start_time = (
                          samples[
                              start_index
                          ]["time"]
                      )

                      end_time = min(
                          duration,
                          (
                              samples[
                                  end_index
                              ]["time"]
                              + 1.0 / SCAN_FPS
                          ),
                      )

                      if (
                          end_time
                          - start_time
                          >= MIN_DURATION
                      ):

                          raw_cues.append(
                              {
                                  "start": start_time,
                                  "end": end_time,
                              }
                          )

                      start_index = None

              # Last cue

              if start_index is not None:

                  end_index = (
                      len(samples)
                      - 1
                  )

                  start_time = (
                      samples[
                          start_index
                      ]["time"]
                  )

                  end_time = min(
                      duration,
                      samples[
                          end_index
                      ]["time"]
                      + 1.0 / SCAN_FPS,
                  )

                  if (
                      end_time
                      - start_time
                      >= MIN_DURATION
                  ):

                      raw_cues.append(
                          {
                              "start": start_time,
                              "end": end_time,
                          }
                      )

              # --------------------------------------------------------
              # Merge cues separated by tiny gaps.
              #
              # Important:
              #
              # This is NOT OCR merge.
              #
              # It is purely temporal.
              # --------------------------------------------------------

              cues = []

              for cue in raw_cues:

                  if not cues:

                      cues.append(
                          dict(cue)
                      )

                      continue

                  previous = cues[-1]

                  gap = (
                      cue["start"]
                      - previous["end"]
                  )

                  if gap <= MAX_EMPTY_GAP:

                      previous["end"] = max(
                          previous["end"],
                          cue["end"],
                      )

                  else:

                      cues.append(
                          dict(cue)
                      )

              # --------------------------------------------------------
              # Remove absurd overlaps
              # --------------------------------------------------------

              cleaned = []

              for cue in cues:

                  if not cleaned:

                      cleaned.append(cue)

                      continue

                  previous = cleaned[-1]

                  if (
                      cue["start"]
                      < previous["end"]
                  ):

                      midpoint = (
                          previous["end"]
                          + cue["start"]
                      ) / 2.0

                      previous["end"] = midpoint

                      cue["start"] = midpoint

                  if (
                      cue["end"]
                      > cue["start"]
                  ):

                      cleaned.append(cue)

              cues = cleaned

              # --------------------------------------------------------
              # Add midpoint
              # --------------------------------------------------------

              for index, cue in enumerate(
                  cues,
                  start=1,
              ):

                  cue["id"] = index

                  cue["midpoint"] = (
                      cue["start"]
                      + cue["end"]
                  ) / 2.0

                  cue["duration"] = (
                      cue["end"]
                      - cue["start"]
                  )

              # --------------------------------------------------------
              # Save timing
              # --------------------------------------------------------

              timing_data = {
                  "video": {
                      "width": width,
                      "height": height,
                      "fps": video_fps,
                      "duration": duration,
                  },
                  "scan": {
                      "fps": SCAN_FPS,
                      "roi_top": ROI_TOP_PERCENT,
                      "roi_bottom": ROI_BOTTOM_PERCENT,
                      "y1": y1,
                      "y2": y2,
                      "brightness_threshold": BRIGHTNESS_THRESHOLD,
                      "occupancy_threshold": dynamic_threshold,
                  },
                  "cue_count": len(cues),
                  "cues": cues,
              }

              TIMING_JSON.write_text(
                  json.dumps(
                      timing_data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              log("")
              log(
                  f"TIMING CUES = {len(cues)}"
              )

              for cue in cues[:30]:

                  log(
                      f"[{cue['id']:04d}] "
                      f"{cue['start']:.3f} → "
                      f"{cue['end']:.3f} "
                      f"(mid="
                      f"{cue['midpoint']:.3f})"
                  )

              if len(cues) > 30:

                  log(
                      f"... "
                      f"{len(cues) - 30} cues khác"
                  )

              return timing_data


          # ============================================================
          # EXTRACT EXACT MIDPOINT FRAME
          # ============================================================

          def extract_frame_at_time(
              time_sec,
          ):

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",

                  # Seek trước input để nhanh,
                  # sau đó decode chính xác.

                  "-ss",
                  f"{time_sec:.6f}",

                  "-i",
                  str(VIDEO),

                  "-frames:v",
                  "1",

                  "-f",
                  "image2pipe",

                  "-vcodec",
                  "png",

                  "-",
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if (
                  result.returncode != 0
                  or not result.stdout
              ):

                  raise RuntimeError(
                      "Không extract được frame "
                      f"tại {time_sec:.3f}s"
                  )

              raw = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8,
              )

              frame = cv2.imdecode(
                  raw,
                  cv2.IMREAD_COLOR,
              )

              if frame is None:

                  raise RuntimeError(
                      "cv2 không decode được frame."
                  )

              return frame


          # ============================================================
          # CLEAN OCR IMAGE
          # ============================================================

          def prepare_ocr_image(
              frame,
              y1,
              y2,
          ):

              roi = frame[
                  y1:y2,
                  :,
              ]

              if (
                  roi is None
                  or roi.size == 0
              ):

                  return None

              # --------------------------------------------------------
              # Upscale
              # --------------------------------------------------------

              roi = cv2.resize(
                  roi,
                  None,
                  fx=OCR_UPSCALE,
                  fy=OCR_UPSCALE,
                  interpolation=cv2.INTER_CUBIC,
              )

              # --------------------------------------------------------
              # Grayscale
              # --------------------------------------------------------

              gray = cv2.cvtColor(
                  roi,
                  cv2.COLOR_BGR2GRAY,
              )

              # --------------------------------------------------------
              # CLAHE
              # --------------------------------------------------------

              clahe = cv2.createCLAHE(
                  clipLimit=2.0,
                  tileGridSize=(8, 8),
              )

              gray = clahe.apply(
                  gray
              )

              # --------------------------------------------------------
              # Otsu
              #
              # Ta tạo một binary version.
              #
              # Nhưng không nhất thiết OCR binary tốt hơn grayscale.
              #
              # Vì vậy trả về cả hai.
              # --------------------------------------------------------

              _, otsu = cv2.threshold(
                  gray,
                  0,
                  255,
                  cv2.THRESH_BINARY
                  + cv2.THRESH_OTSU,
              )

              # --------------------------------------------------------
              # Bright subtitle mask
              # --------------------------------------------------------

              _, bright = cv2.threshold(
                  gray,
                  BRIGHTNESS_THRESHOLD,
                  255,
                  cv2.THRESH_BINARY,
              )

              # --------------------------------------------------------
              # Morphology
              # --------------------------------------------------------

              kernel = cv2.getStructuringElement(
                  cv2.MORPH_RECT,
                  (3, 3),
              )

              bright = cv2.morphologyEx(
                  bright,
                  cv2.MORPH_CLOSE,
                  kernel,
              )

              # --------------------------------------------------------
              # Black background + white subtitle
              #
              # Đây là ảnh rất tốt cho debug.
              # --------------------------------------------------------

              binary = bright

              return {
                  "gray": gray,
                  "otsu": otsu,
                  "binary": binary,
              }


          # ============================================================
          # OCR
          # ============================================================

          def run_ocr(
              ocr,
              image,
          ):

              if image is None:
                  return []

              results = []

              # --------------------------------------------------------
              # Thử grayscale trước
              # --------------------------------------------------------

              variants = [
                  (
                      "gray",
                      image["gray"],
                  ),
                  (
                      "binary",
                      image["binary"],
                  ),
                  (
                      "otsu",
                      image["otsu"],
                  ),
              ]

              for variant_name, variant_image in variants:

                  try:

                      output = ocr.predict(
                          variant_image
                      )

                  except Exception as error:

                      log(
                          "OCR ERROR "
                          f"{variant_name}: "
                          f"{error!r}"
                      )

                      continue

                  for page in output:

                      try:

                          data = page.json

                          if callable(data):

                              data = data()

                      except Exception:

                          continue

                      if isinstance(
                          data,
                          str,
                      ):

                          try:

                              data = json.loads(
                                  data
                              )

                          except Exception:

                              continue

                      if not isinstance(
                          data,
                          dict,
                      ):

                          continue

                      if isinstance(
                          data.get("res"),
                          dict,
                      ):

                          data = data["res"]

                      texts = data.get(
                          "rec_texts",
                          [],
                      )

                      scores = data.get(
                          "rec_scores",
                          [],
                      )

                      for index, raw_text in enumerate(
                          texts
                      ):

                          text = normalize_text(
                              raw_text
                          )

                          if not text:
                              continue

                          try:

                              score = float(
                                  scores[index]
                              )

                          except Exception:

                              score = 0.0

                          if (
                              score
                              < OCR_MIN_SCORE
                          ):

                              continue

                          results.append(
                              {
                                  "variant": variant_name,
                                  "text": text,
                                  "score": score,
                                  "chinese": chinese_count(
                                      text
                                  ),
                              }
                          )

              return results


          # ============================================================
          # CHOOSE OCR RESULT
          # ============================================================

          def choose_ocr_result(
              results
          ):

              if not results:
                  return ""

              # --------------------------------------------------------
              # Group exact text.
              # --------------------------------------------------------

              grouped = {}

              for item in results:

                  text = item["text"]

                  bucket = grouped.setdefault(
                      text,
                      {
                          "count": 0,
                          "score": 0.0,
                          "chinese": 0,
                      },
                  )

                  bucket["count"] += 1

                  bucket["score"] += float(
                      item["score"]
                  )

                  bucket["chinese"] = max(
                      bucket["chinese"],
                      item["chinese"],
                  )

              # --------------------------------------------------------
              # Score:
              #
              # 1. xuất hiện ở nhiều preprocessing variant
              # 2. confidence cao
              # 3. nhiều Chinese chars
              #
              # Không dùng "text dài hơn = tốt hơn" một cách mù quáng.
              # --------------------------------------------------------

              best_text = max(
                  grouped.items(),
                  key=lambda item: (
                      item[1]["count"],
                      item[1]["score"],
                      item[1]["chinese"],
                  ),
              )[0]

              return best_text


          # ============================================================
          # OCR ALL MIDPOINTS
          # ============================================================

          def ocr_midpoints(
              timing_data
          ):

              (
                  width,
                  height,
                  video_fps,
                  duration,
              ) = probe_video()

              y1, y2 = get_roi(
                  height
              )

              log("")
              log(
                  "=========================================="
              )
              log(
                  "PASS 2 — MIDPOINT OCR"
              )
              log(
                  "=========================================="
              )

              log(
                  "Timing source = PASS 1"
              )

              log(
                  "OCR frame = cue midpoint"
              )

              log(
                  f"Total cues = "
                  f"{len(timing_data['cues'])}"
              )

              log(
                  f"ROI = y={y1}..{y2}"
              )

              # --------------------------------------------------------
              # Load PaddleOCR once
              # --------------------------------------------------------

              log(
                  "Loading PaddleOCR..."
              )

              ocr = PaddleOCR(
                  lang="ch",
                  text_det_limit_side_len=OCR_DET_LIMIT,
                  text_det_limit_type="max",
              )

              output_cues = []

              ocr_debug = []

              for cue in tqdm(
                  timing_data["cues"],
                  desc="Midpoint OCR",
              ):

                  cue_id = cue["id"]

                  start = float(
                      cue["start"]
                  )

                  end = float(
                      cue["end"]
                  )

                  midpoint = float(
                      cue["midpoint"]
                  )

                  log("")
                  log(
                      f"========== CUE {cue_id} =========="
                  )

                  log(
                      f"time     : "
                      f"{start:.3f} → "
                      f"{end:.3f}"
                  )

                  log(
                      f"midpoint : "
                      f"{midpoint:.3f}"
                  )

                  # ----------------------------------------------------
                  # Extract EXACT midpoint frame
                  # ----------------------------------------------------

                  frame = extract_frame_at_time(
                      midpoint
                  )

                  # ----------------------------------------------------
                  # Save original midpoint for debugging
                  # ----------------------------------------------------

                  original_path = (
                      DEBUG_DIR
                      / f"{cue_id:05d}_original.png"
                  )

                  cv2.imwrite(
                      str(original_path),
                      frame,
                  )

                  # ----------------------------------------------------
                  # Prepare images
                  # ----------------------------------------------------

                  prepared = prepare_ocr_image(
                      frame,
                      y1,
                      y2,
                  )

                  if prepared is None:

                      log(
                          "OCR IMAGE = EMPTY"
                      )

                      continue

                  # ----------------------------------------------------
                  # Save OCR variants
                  # ----------------------------------------------------

                  cv2.imwrite(
                      str(
                          DEBUG_DIR
                          / f"{cue_id:05d}_gray.png"
                      ),
                      prepared["gray"],
                  )

                  cv2.imwrite(
                      str(
                          DEBUG_DIR
                          / f"{cue_id:05d}_binary.png"
                      ),
                      prepared["binary"],
                  )

                  cv2.imwrite(
                      str(
                          DEBUG_DIR
                          / f"{cue_id:05d}_otsu.png"
                      ),
                      prepared["otsu"],
                  )

                  # ----------------------------------------------------
                  # OCR
                  # ----------------------------------------------------

                  results = run_ocr(
                      ocr,
                      prepared,
                  )

                  text = choose_ocr_result(
                      results
                  )

                  log(
                      f"OCR = {text!r}"
                  )

                  # ----------------------------------------------------
                  # Debug OCR alternatives
                  # ----------------------------------------------------

                  ocr_debug.append(
                      {
                          "id": cue_id,
                          "start": start,
                          "end": end,
                          "midpoint": midpoint,
                          "selected_text": text,
                          "results": results,
                      }
                  )

                  # ----------------------------------------------------
                  # Empty OCR
                  # ----------------------------------------------------

                  if not text:

                      log(
                          "WARNING: OCR EMPTY"
                      )

                      continue

                  # ----------------------------------------------------
                  # Save cue
                  # ----------------------------------------------------

                  output_cues.append(
                      {
                          "id": cue_id,
                          "start": start,
                          "end": end,
                          "midpoint": midpoint,
                          "text": text,
                      }
                  )

              # --------------------------------------------------------
              # Save OCR debug
              # --------------------------------------------------------

              OCR_JSON.write_text(
                  json.dumps(
                      ocr_debug,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              return output_cues


          # ============================================================
          # SRT
          # ============================================================

          def save_srt(
              cues
          ):

              subs = pysubs2.SSAFile()

              for cue in cues:

                  start_ms = int(
                      round(
                          cue["start"]
                          * 1000
                      )
                  )

                  end_ms = int(
                      round(
                          cue["end"]
                          * 1000
                      )
                  )

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=start_ms,
                          end=end_ms,
                          text=cue["text"],
                      )
                  )

              subs.save(
                  str(OUTPUT_SRT),
                  encoding="utf-8",
              )


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      "Video không tồn tại: "
                      + str(VIDEO)
                  )

              # --------------------------------------------------------
              # PASS 1
              # --------------------------------------------------------

              timing_data = (
                  detect_timings()
              )

              # --------------------------------------------------------
              # PASS 2
              # --------------------------------------------------------

              cues = (
                  ocr_midpoints(
                      timing_data
                  )
              )

              # --------------------------------------------------------
              # SAVE
              # --------------------------------------------------------

              save_srt(
                  cues
              )

              log("")
              log(
                  "=========================================="
              )

              log(
                  "FINAL RESULT"
              )

              log(
                  "=========================================="
              )

              log(
                  f"Timing cues : "
                  f"{len(timing_data['cues'])}"
              )

              log(
                  f"OCR cues    : "
                  f"{len(cues)}"
              )

              log(
                  f"Output      : "
                  f"{OUTPUT_SRT}"
              )

              log(
                  f"Timing JSON : "
                  f"{TIMING_JSON}"
              )

              log(
                  f"OCR JSON    : "
                  f"{OCR_JSON}"
              )

              log(
                  "=========================================="
              )

              # --------------------------------------------------------
              # Print SRT
              # --------------------------------------------------------

              print("")

              print(
                  "========== FINAL SRT =========="
              )

              print(
                  OUTPUT_SRT.read_text(
                      encoding="utf-8"
                  )
              )


          if __name__ == "__main__":
              main()

          PY


      # ============================================================
      # RUN
      # ============================================================

      - name: Extract subtitle
        env:
          SCAN_FPS: ${{ inputs.scan_fps }}
          ROI_TOP: ${{ inputs.roi_top }}
          ROI_BOTTOM: ${{ inputs.roi_bottom }}
          MIN_DURATION: ${{ inputs.min_duration }}
          BRIGHTNESS_THRESHOLD: ${{ inputs.threshold }}

          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

        run: |
          set -euo pipefail

          python process.py


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check Chinese subtitle
        run: |
          set -euo pipefail

          if [ ! -f chinese.srt ]; then
            echo "::error::chinese.srt không được tạo."
            exit 1
          fi

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt rỗng."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "FINAL chinese.srt"
          echo "=========================================="

          cat chinese.srt

          echo ""
          echo "=========================================="
          echo "TIMING DEBUG"
          echo "=========================================="

          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "work/timing.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Video:",
              data["video"]
          )

          print()

          print(
              "Timing configuration:"
          )

          print(
              data["scan"]
          )

          print()

          print(
              "Cue count:",
              data["cue_count"]
          )

          print()

          for cue in data["cues"][:100]:

              print(
                  f"{cue['id']:04d} "
                  f"{cue['start']:.3f} --> "
                  f"{cue['end']:.3f} "
                  f"mid={cue['midpoint']:.3f}"
              )

          PY


      # ============================================================
      # UPLOAD DEBUG ARTIFACTS
      # ============================================================

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-debug
          path: |
            work/timing.json
            work/ocr.json
            work/debug/
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # COMMIT SRT
      # ============================================================

      - name: Commit Chinese subtitle
        run: |
          set -euo pipefail

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add chinese.srt

          if git diff --cached --quiet; then

            echo \
              "chinese.srt không thay đổi."

          else

            git commit \
              -m "feat: extract Chinese hard subtitle"

            git push \
              origin \
              HEAD:${{ github.ref_name }}

          fi


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt

          echo "Cookie removed."
