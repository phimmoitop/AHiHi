name: Bilibili OCR Debug → Chinese SRT

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string
      scan_seconds:
        description: "Khoảng cách quét để tìm vùng subtitle ban đầu (giây)"
        required: false
        default: "0.5"
        type: string
      ocr_fps:
        description: "FPS OCR thực tế. Debug nên dùng 4-8"
        required: false
        default: "8"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python packages
        run: |
          set -eux
          python -m pip install --upgrade pip

          python -m pip install \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            tqdm \
            pysubs2 \
            yt-dlp

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install paddleocr==3.3.2

      - name: Prepare directories
        run: |
          set -eux
          mkdir -p work
          rm -f chinese.srt
          rm -f work/ocr_debug.json
          rm -f work/cookies.txt

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::GitHub Secret BILIBILI_COOKIES chua duoc cau hinh."
            exit 1
          fi

          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt
          chmod 600 work/cookies.txt

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::Khong tim thay work/source.mp4 sau khi tai video."
            find work -maxdepth 2 -type f -ls
            exit 1
          fi

          ls -lh work/

      - name: Create OCR debug script
        run: |
          cat > process.py <<'PY'
          import os
          import re
          import json
          import subprocess
          from pathlib import Path
          from collections import Counter

          import cv2
          import numpy as np
          import pysubs2
          from tqdm import tqdm
          from paddleocr import PaddleOCR


          # ============================================================
          # PATHS
          # ============================================================

          WORK = Path("work")
          VIDEO = WORK / "source.mp4"
          OUTPUT_SRT = Path("chinese.srt")
          DEBUG_JSON = WORK / "ocr_debug.json"


          # ============================================================
          # CONFIG
          # ============================================================

          SCAN_SECONDS = float(
              os.environ.get(
                  "SCAN_SECONDS",
                  "0.5",
              )
          )

          OCR_FPS = float(
              os.environ.get(
                  "OCR_FPS",
                  "8",
              )
          )

          # Chỉ dùng phần dưới video để TÌM subtitle.
          # Sau khi tìm thấy subtitle:
          #
          #   X = FULL WIDTH
          #   Y = lấy theo chiều cao subtitle phát hiện được
          #
          DETECT_SEARCH_Y_RATIO = 0.70

          # Padding theo chiều dọc.
          # Giữ thêm khoảng trên/dưới để tránh crop sát chữ.
          REGION_PAD_Y_RATIO = 0.015
          REGION_MIN_PAD_Y = 10

          MIN_CHINESE_COUNT = 1
          MIN_BOX_WIDTH = 5
          MIN_BOX_HEIGHT = 5

          # Debug mode:
          #
          # - Không dùng change detection.
          # - Không skip frame.
          # - Không fuzzy merge.
          # - Không similarity merge.
          #
          # OCR tất cả sample.
          #
          # Mục tiêu:
          # kiểm tra chính xác OCR đọc được gì ở từng thời điểm.


          # ============================================================
          # UTILS
          # ============================================================

          def log(message):
              print(message, flush=True)


          def chinese_count(text):
              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      str(text),
                  )
              )


          def normalize_text(text):
              text = str(text).strip()

              # PaddleOCR đôi khi trả khoảng trắng giữa ký tự.
              text = re.sub(
                  r"\s+",
                  "",
                  text,
              )

              return text


          # ============================================================
          # VIDEO INFO
          # ============================================================

          def probe_video():
              cmd = [
                  "ffprobe",
                  "-hide_banner",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width,height,r_frame_rate",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "json",
                  str(VIDEO),
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True,
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              fps_num, fps_den = (
                  stream["r_frame_rate"]
                  .split("/")
              )

              fps = (
                  float(fps_num)
                  / float(fps_den)
              )

              duration = float(
                  data["format"]["duration"]
              )

              return (
                  width,
                  height,
                  fps,
                  duration,
              )


          # ============================================================
          # GET ONE FRAME
          # ============================================================

          def get_frame(time_sec):
              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-ss",
                  f"{time_sec:.6f}",
                  "-i",
                  str(VIDEO),
                  "-frames:v",
                  "1",
                  "-f",
                  "image2pipe",
                  "-vcodec",
                  "mjpeg",
                  "-",
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if (
                  result.returncode != 0
                  or not result.stdout
              ):
                  return None

              raw = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8,
              )

              return cv2.imdecode(
                  raw,
                  cv2.IMREAD_COLOR,
              )


          # ============================================================
          # PADDLEOCR RESULT PARSER
          # ============================================================

          def ocr_image(image):
              """
              Chạy PaddleOCR và trả về:

              [
                  {
                      "text": "...",
                      "score": 0.99,
                      "box": [x1, y1, x2, y2]
                  }
              ]
              """

              result = ocr.predict(
                  image
              )

              items = []

              for page in result:

                  try:
                      data = page.json

                      if callable(data):
                          data = data()

                  except Exception as error:
                      log(
                          "OCR JSON ERROR: "
                          + repr(error)
                      )
                      continue

                  if isinstance(
                      data,
                      str,
                  ):
                      try:
                          data = json.loads(
                              data
                          )
                      except Exception:
                          continue

                  if not isinstance(
                      data,
                      dict,
                  ):
                      continue

                  if isinstance(
                      data.get("res"),
                      dict,
                  ):
                      data = data["res"]

                  rec_texts = data.get(
                      "rec_texts",
                      [],
                  )

                  rec_scores = data.get(
                      "rec_scores",
                      [],
                  )

                  rec_polys = data.get(
                      "rec_polys",
                      [],
                  )

                  for index, raw_text in enumerate(
                      rec_texts
                  ):
                      text = normalize_text(
                          raw_text
                      )

                      if not text:
                          continue

                      if (
                          index
                          >= len(rec_polys)
                      ):
                          continue

                      try:
                          score = float(
                              rec_scores[index]
                          )

                      except Exception:
                          score = 1.0

                      points = np.asarray(
                          rec_polys[index]
                      )

                      if (
                          points.ndim != 2
                          or points.shape[1] != 2
                      ):
                          continue

                      x1 = int(
                          np.min(
                              points[:, 0]
                          )
                      )

                      y1 = int(
                          np.min(
                              points[:, 1]
                          )
                      )

                      x2 = int(
                          np.max(
                              points[:, 0]
                          )
                      )

                      y2 = int(
                          np.max(
                              points[:, 1]
                          )
                      )

                      if (
                          x2 - x1
                          < MIN_BOX_WIDTH
                      ):
                          continue

                      if (
                          y2 - y1
                          < MIN_BOX_HEIGHT
                      ):
                          continue

                      items.append(
                          {
                              "text": text,
                              "score": score,
                              "box": [
                                  x1,
                                  y1,
                                  x2,
                                  y2,
                              ],
                          }
                      )

              return items


          # ============================================================
          # FIND SUBTITLE REGION
          # ============================================================

          def find_subtitle_region():
              """
              Logic mới:

              1. Scan toàn bộ video cho tới khi thấy chữ Trung
                 ở vùng dưới video.

              2. Dùng bounding box để xác định CHIỀU DỌC subtitle:
                     y1 -> y2

              3. KHÔNG dùng x1/x2 của box để crop.

              4. OCR region cuối cùng luôn là FULL WIDTH:
                     x1 = 0
                     x2 = video_width

              Đây là điểm sửa chính so với bản debug trước.
              """

              (
                  width,
                  height,
                  fps,
                  duration,
              ) = probe_video()

              search_y1 = int(
                  height
                  * DETECT_SEARCH_Y_RATIO
              )

              search_y2 = height

              log(
                  "VIDEO: "
                  f"{width}x{height} "
                  f"FPS={fps:.3f} "
                  f"DURATION={duration:.3f}s"
              )

              log(
                  "SUBTITLE DETECTION SEARCH AREA: "
                  f"x=0..{width}, "
                  f"y={search_y1}..{search_y2}"
              )

              time_sec = 0.0

              while time_sec < duration:

                  log(
                      f"REGION SCAN: "
                      f"{time_sec:.3f}s"
                  )

                  frame = get_frame(
                      time_sec
                  )

                  if frame is None:
                      time_sec += SCAN_SECONDS
                      continue

                  # Chỉ crop vùng dưới để việc tìm subtitle
                  # ban đầu nhanh hơn.
                  search_crop = frame[
                      search_y1:search_y2,
                      0:width,
                  ]

                  items = ocr_image(
                      search_crop
                  )

                  candidates = []

                  for item in items:

                      text = item["text"]

                      if (
                          chinese_count(text)
                          < MIN_CHINESE_COUNT
                      ):
                          continue

                      x1, y1, x2, y2 = (
                          item["box"]
                      )

                      # Chuyển Y từ crop coordinate
                      # về video coordinate.
                      abs_y1 = (
                          y1
                          + search_y1
                      )

                      abs_y2 = (
                          y2
                          + search_y1
                      )

                      # Chỉ dùng để tìm candidate subtitle.
                      # Ưu tiên chữ nằm thấp hơn.
                      box_height = (
                          abs_y2
                          - abs_y1
                      )

                      vertical_score = (
                          abs_y2
                          / max(
                              1,
                              height,
                          )
                      )

                      text_score = (
                          chinese_count(
                              text
                          )
                      )

                      score = (
                          vertical_score
                          * 1000
                          + text_score * 10
                          + box_height
                      )

                      candidates.append(
                          {
                              "score": score,
                              "text": text,
                              "y1": abs_y1,
                              "y2": abs_y2,
                              "box": [
                                  x1,
                                  abs_y1,
                                  x2,
                                  abs_y2,
                              ],
                          }
                      )

                  if candidates:

                      candidates.sort(
                          key=lambda item: (
                              item["score"]
                          ),
                          reverse=True,
                      )

                      # Lấy candidate tốt nhất để xác định
                      # vị trí subtitle theo chiều dọc.
                      #
                      # X được bỏ qua hoàn toàn.
                      best = candidates[0]

                      detected_y1 = (
                          best["y1"]
                      )

                      detected_y2 = (
                          best["y2"]
                      )

                      pad_y = max(
                          REGION_MIN_PAD_Y,
                          int(
                              height
                              * REGION_PAD_Y_RATIO
                          ),
                      )

                      region_y1 = max(
                          0,
                          detected_y1 - pad_y,
                      )

                      region_y2 = min(
                          height,
                          detected_y2 + pad_y,
                      )

                      # =================================================
                      # QUAN TRỌNG:
                      #
                      # FULL WIDTH
                      #
                      # Không dùng x1/x2 của box OCR nữa.
                      # =================================================

                      region = {
                          "x1": 0,
                          "y1": int(region_y1),
                          "x2": int(width),
                          "y2": int(region_y2),
                          "width": int(width),
                          "height": int(height),
                          "fps": float(fps),
                          "found_at": float(time_sec),
                          "sample_text": best["text"],
                          "detected_box": best["box"],
                          "detected_subtitle_y1": int(
                              detected_y1
                          ),
                          "detected_subtitle_y2": int(
                              detected_y2
                          ),
                          "region_mode": (
                              "full_width"
                          ),
                      }

                      log(
                          "INITIAL SUBTITLE REGION FOUND:"
                      )

                      log(
                          json.dumps(
                              region,
                              ensure_ascii=False,
                          )
                      )

                      log(
                          "IMPORTANT: "
                          "OCR FINAL REGION USES "
                          "FULL VIDEO WIDTH."
                      )

                      log(
                          f"FINAL OCR REGION: "
                          f"x=0..{width}, "
                          f"y={region_y1}..{region_y2}, "
                          f"size={width}x"
                          f"{region_y2-region_y1}"
                      )

                      return region

                  time_sec += (
                      SCAN_SECONDS
                  )

              raise RuntimeError(
                  "Khong tim thay subtitle "
                  "trong toan bo video."
              )


          # ============================================================
          # OCR ALL VIDEO
          # ============================================================

          def extract_all_samples(region):

              (
                  width,
                  height,
                  video_fps,
                  duration,
              ) = probe_video()

              rx1 = int(
                  region["x1"]
              )

              ry1 = int(
                  region["y1"]
              )

              rx2 = int(
                  region["x2"]
              )

              ry2 = int(
                  region["y2"]
              )

              crop_width = (
                  rx2 - rx1
              )

              crop_height = (
                  ry2 - ry1
              )

              if (
                  crop_width <= 0
                  or crop_height <= 0
              ):
                  raise RuntimeError(
                      "Invalid OCR region: "
                      + json.dumps(
                          region,
                          ensure_ascii=False,
                      )
                  )

              expected_samples = int(
                  np.ceil(
                      duration
                      * OCR_FPS
                  )
              )

              log("")
              log(
                  "========== OCR DEBUG MODE =========="
              )

              log(
                  "CHANGE DETECTION: DISABLED"
              )

              log(
                  "FRAME SKIP: DISABLED"
              )

              log(
                  "TEMPORAL + LENGTH-AWARE MERGE: ENABLED"
              )

              log(
                  "OCR EVERY SAMPLE: ENABLED"
              )

              log(
                  f"OCR FPS={OCR_FPS}"
              )

              log(
                  f"EXPECTED SAMPLES="
                  f"{expected_samples}"
              )

              log(
                  f"OCR REGION: "
                  f"x={rx1}..{rx2} "
                  f"y={ry1}..{ry2}"
              )

              log(
                  f"OCR CROP SIZE: "
                  f"{crop_width}x"
                  f"{crop_height}"
              )

              log(
                  "===================================="
              )

              # Decode liên tục bằng FFmpeg.
              #
              # Không chạy FFmpeg lại cho từng frame.
              #
              # Đây nhanh hơn rất nhiều so với:
              # get_frame() -> OCR -> get_frame() -> OCR
              #
              filter_graph = (
                  f"fps={OCR_FPS},"
                  f"crop={crop_width}:"
                  f"{crop_height}:"
                  f"{rx1}:"
                  f"{ry1}"
              )

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-i",
                  str(VIDEO),
                  "-vf",
                  filter_graph,
                  "-an",
                  "-sn",
                  "-dn",
                  "-pix_fmt",
                  "bgr24",
                  "-f",
                  "rawvideo",
                  "-",
              ]

              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  bufsize=1024 * 1024 * 128,
              )

              frame_size = (
                  crop_width
                  * crop_height
                  * 3
              )

              samples = []

              pbar = tqdm(
                  total=expected_samples,
                  desc="OCR DEBUG",
              )

              index = 0

              try:

                  while True:

                      raw = (
                          process.stdout.read(
                              frame_size
                          )
                      )

                      if (
                          len(raw)
                          != frame_size
                      ):
                          break

                      current_time = (
                          index
                          / OCR_FPS
                      )

                      frame = (
                          np.frombuffer(
                              raw,
                              dtype=np.uint8,
                          )
                          .reshape(
                              (
                                  crop_height,
                                  crop_width,
                                  3,
                              )
                          )
                      )

                      items = ocr_image(
                          frame
                      )

                      valid = []

                      for item in items:

                          text = (
                              item["text"]
                          )

                          if (
                              chinese_count(
                                  text
                              )
                              < MIN_CHINESE_COUNT
                          ):
                              continue

                          x1, y1, x2, y2 = (
                              item["box"]
                          )

                          valid.append(
                              {
                                  "text": text,
                                  "score": item[
                                      "score"
                                  ],
                                  "box": [
                                      x1 + rx1,
                                      y1 + ry1,
                                      x2 + rx1,
                                      y2 + ry1,
                                  ],
                              }
                          )

                      # PaddleOCR có thể trả nhiều box.
                      #
                      # Sắp xếp trái -> phải để ghép
                      # thành một subtitle line.
                      valid.sort(
                          key=lambda item: (
                              item["box"][0],
                              item["box"][1],
                          )
                      )

                      text = normalize_text(
                          "".join(
                              item["text"]
                              for item in valid
                          )
                      )

                      sample = {
                          "index": index,
                          "time": round(
                              current_time,
                              6,
                          ),
                          "text": text,
                          "detections": valid,
                      }

                      samples.append(
                          sample
                      )

                      if text:
                          log(
                              f"[OCR {index:05d}] "
                              f"{current_time:8.3f}s "
                              f"TEXT={text!r}"
                          )

                      else:
                          log(
                              f"[OCR {index:05d}] "
                              f"{current_time:8.3f}s "
                              "TEXT=<EMPTY>"
                          )

                      index += 1

                      pbar.update(
                          1
                      )

              finally:

                  pbar.close()

                  if process.stdout:
                      process.stdout.close()

                  stderr_data = b""

                  if process.stderr:
                      stderr_data = (
                          process.stderr.read()
                      )

                      process.stderr.close()

                  return_code = (
                      process.wait()
                  )

                  if return_code != 0:

                      raise RuntimeError(
                          "FFmpeg OCR stream failed:\n"
                          + stderr_data.decode(
                              "utf-8",
                              errors="replace",
                          )
                      )

              log(
                  "OCR DEBUG STATS: "
                  f"scanned={len(samples)} "
                  f"ocr={len(samples)} "
                  "skipped=0"
              )

              return (
                  samples,
                  duration,
              )


          # ============================================================
          # TEMPORAL + LENGTH-AWARE SUBTITLE MERGE
          # ============================================================

          # OCR frame sau thường nét hơn.
          # Vì vậy:
          #   - ưu tiên representative ở các frame cuối
          #   - nhưng không lấy frame cuối tuyệt đối một cách mù quáng
          #   - dùng frequency + recency trong tail window
          #
          # Merge phụ thuộc đồng thời vào:
          #   1. thời gian giữa hai sample non-empty
          #   2. độ dài subtitle
          #   3. số ký tự giống nhau theo đúng thứ tự (LCS)
          #
          # Câu ngắn: rất khắt khe.
          # Câu dài: cho phép sai vài ký tự OCR.


          def lcs_length(a, b):
              previous = [0] * (len(b) + 1)

              for char_a in a:
                  current = [0]

                  for j, char_b in enumerate(b, 1):
                      if char_a == char_b:
                          current.append(
                              previous[j - 1] + 1
                          )
                      else:
                          current.append(
                              max(
                                  previous[j],
                                  current[-1],
                              )
                          )

                  previous = current

              return previous[-1]


          def required_common_chars(length):
              # 1-2 ký tự: strict
              if length <= 2:
                  return length

              # 3-4 ký tự: ví dụ 4 cần khớp ít nhất 3
              if length <= 4:
                  return max(2, length - 1)

              # 5-6 ký tự: thiếu tối đa 1
              if length <= 6:
                  return length - 1

              # 7-8 ký tự: thiếu tối đa 2
              if length <= 8:
                  return length - 2

              # Câu dài: ít nhất 75%
              return int(
                  np.ceil(length * 0.75)
              )


          def allowed_gap_for_length(length):
              # Gap tolerance phụ thuộc độ dài câu.
              # Đây không phải duration chính xác của subtitle.
              if length <= 2:
                  return 0.45

              if length <= 4:
                  return 0.65

              if length <= 6:
                  return 0.90

              if length <= 8:
                  return 1.25

              return min(
                  2.20,
                  1.25
                  + (length - 8) * 0.15,
              )


          def text_match_details(a, b, time_gap):
              if not a or not b:
                  return False, {
                      "common": 0,
                      "reason": "empty",
                  }

              common = lcs_length(a, b)
              max_len = max(len(a), len(b))
              ratio = common / max(1, max_len)

              details = {
                  "common": common,
                  "max_len": max_len,
                  "ratio": round(ratio, 4),
                  "time_gap": round(time_gap, 4),
                  "gap_limit": round(
                      allowed_gap_for_length(max_len),
                      4,
                  ),
              }

              if time_gap > allowed_gap_for_length(max_len):
                  details["reason"] = "gap_too_large"
                  return False, details

              # 1 ký tự phải giống hoàn toàn.
              if max_len == 1:
                  details["required"] = 1
                  details["reason"] = "single_char"
                  return a == b, details

              # 2 ký tự:
              # - bình thường phải giống hoàn toàn
              # - cho phép OCR sai 1 ký tự chỉ khi cực gần nhau
              if max_len == 2:
                  if a == b:
                      details["required"] = 2
                      details["reason"] = "short_exact"
                      return True, details

                  matched = (
                      common == 1
                      and time_gap <= 0.30
                  )

                  details["required"] = (
                      "exact, or 1 common if gap<=0.30"
                  )
                  details["reason"] = "short_exception"
                  return matched, details

              required = required_common_chars(max_len)

              details["required"] = required
              details["reason"] = "length_aware_lcs"

              return common >= required, details


          def choose_tail_representative(
              segment,
              tail_size=4,
          ):
              # Chỉ nhìn các sample cuối.
              # Frequency cao hơn thắng.
              # Nếu bằng nhau, sample xuất hiện muộn hơn thắng.
              # Vì vậy frame cuối/gần cuối được ưu tiên.
              tail = segment[-tail_size:]
              grouped = {}

              for sample in tail:
                  text = sample["text"]

                  if not text:
                      continue

                  stats = grouped.setdefault(
                      text,
                      {
                          "count": 0,
                          "last_index": -1,
                          "last_time": -1.0,
                      },
                  )

                  stats["count"] += 1
                  stats["last_index"] = max(
                      stats["last_index"],
                      sample["index"],
                  )
                  stats["last_time"] = max(
                      stats["last_time"],
                      float(sample["time"]),
                  )

              if not grouped:
                  return ""

              return max(
                  grouped.items(),
                  key=lambda item: (
                      item[1]["count"],
                      item[1]["last_index"],
                      len(item[0]),
                  ),
              )[0]


          def finalize_segment(segment, duration):
              if not segment:
                  return None

              candidate = choose_tail_representative(segment)

              if not candidate:
                  return None

              # Tail candidate là mặc định cuối cùng.
              # Chỉ override nếu một text khác có đồng thuận mạnh hơn
              # rõ rệt (nhiều hơn ít nhất 2 sample).
              counts = Counter(
                  sample["text"]
                  for sample in segment
                  if sample["text"]
              )

              candidate_count = counts.get(candidate, 0)

              alternatives = [
                  (text, count)
                  for text, count in counts.items()
                  if text != candidate
              ]

              if alternatives:
                  best_text, best_count = max(
                      alternatives,
                      key=lambda item: (
                          item[1],
                          len(item[0]),
                      ),
                  )

                  if best_count >= candidate_count + 2:
                      candidate = best_text

              start = float(segment[0]["time"])
              end = min(
                  duration,
                  float(segment[-1]["time"])
                  + (1.0 / OCR_FPS),
              )

              return {
                  "start": start,
                  "end": max(start + 0.001, end),
                  "text": candidate,
                  "sample_count": len(segment),
                  "tail_candidate": choose_tail_representative(
                      segment
                  ),
              }


          def samples_to_raw_cues(samples, duration):
              """
              Merge subtitle bằng:
                  temporal continuity
                  + length-aware LCS
                  + tail representative

              EMPTY không đóng segment ngay lập tức.
              Chỉ đóng khi sample non-empty tiếp theo:
                  - cách quá xa
                  HOẶC
                  - không đủ giống representative hiện tại.
              """

              if not samples:
                  return [], []

              cues = []
              merge_debug = []

              active_segment = []
              last_nonempty_time = None

              for sample in samples:
                  current_text = sample["text"]

                  if not current_text:
                      continue

                  current_time = float(sample["time"])

                  if not active_segment:
                      active_segment = [sample]
                      last_nonempty_time = current_time
                      continue

                  representative = (
                      choose_tail_representative(
                          active_segment
                      )
                  )

                  time_gap = (
                      current_time
                      - last_nonempty_time
                  )

                  matched, details = text_match_details(
                      current_text,
                      representative,
                      time_gap,
                  )

                  merge_debug.append(
                      {
                          "time": current_time,
                          "text": current_text,
                          "representative": representative,
                          "matched": matched,
                          "details": details,
                      }
                  )

                  if matched:
                      active_segment.append(sample)
                      last_nonempty_time = current_time
                      continue

                  cue = finalize_segment(
                      active_segment,
                      duration,
                  )

                  if cue:
                      cues.append(cue)

                  active_segment = [sample]
                  last_nonempty_time = current_time

              if active_segment:
                  cue = finalize_segment(
                      active_segment,
                      duration,
                  )

                  if cue:
                      cues.append(cue)

              # Safety cleanup:
              # Hai cue text giống hệt nhau chỉ được nối nếu khoảng cách
              # phù hợp với độ dài subtitle.
              cleaned = []

              for cue in cues:
                  if not cleaned:
                      cleaned.append(cue)
                      continue

                  previous = cleaned[-1]

                  gap = (
                      cue["start"]
                      - previous["end"]
                  )

                  if (
                      cue["text"] == previous["text"]
                      and gap <= allowed_gap_for_length(
                          len(cue["text"])
                      )
                  ):
                      previous["end"] = max(
                          previous["end"],
                          cue["end"],
                      )
                      previous["sample_count"] += cue.get(
                          "sample_count",
                          0,
                      )
                  else:
                      cleaned.append(cue)

              return cleaned, merge_debug


          # ============================================================
          # SAVE SRT
          # ============================================================

          def save_srt(cues):

              subs = pysubs2.SSAFile()

              for cue in cues:

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=int(
                              cue["start"]
                              * 1000
                          ),
                          end=int(
                              cue["end"]
                              * 1000
                          ),
                          text=cue["text"],
                      )
                  )

              subs.save(
                  str(OUTPUT_SRT),
                  encoding="utf-8",
              )


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      "Video khong ton tai: "
                      + str(VIDEO)
                  )

              log(
                  "Loading PaddleOCR..."
              )

              global ocr

              ocr = PaddleOCR(
                  lang="ch"
              )

              region = (
                  find_subtitle_region()
              )

              (
                  samples,
                  duration,
              ) = extract_all_samples(
                  region
              )

              (
                  cues,
                  merge_debug,
              ) = samples_to_raw_cues(
                  samples,
                  duration,
              )

              save_srt(
                  cues
              )

              nonempty_samples = [
                  sample
                  for sample in samples
                  if sample["text"]
              ]

              counter = Counter(
                  sample["text"]
                  for sample in nonempty_samples
              )

              debug_data = {
                  "region": region,
                  "scan_seconds": SCAN_SECONDS,
                  "ocr_fps": OCR_FPS,
                  "sample_count": len(
                      samples
                  ),
                  "nonempty_sample_count": len(
                      nonempty_samples
                  ),
                  "cue_count": len(
                      cues
                  ),
                  "samples": samples,
                  "cues": cues,
                  "merge_debug": merge_debug,
              }

              DEBUG_JSON.write_text(
                  json.dumps(
                      debug_data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              log("")
              log(
                  "========== OCR DEBUG SUMMARY =========="
              )

              log(
                  "REGION:"
              )

              log(
                  json.dumps(
                      region,
                      ensure_ascii=False,
                  )
              )

              log(
                  f"Total samples : "
                  f"{len(samples)}"
              )

              log(
                  f"Non-empty     : "
                  f"{len(nonempty_samples)}"
              )

              log(
                  f"Raw SRT cues  : "
                  f"{len(cues)}"
              )

              log(
                  f"Output        : "
                  f"{OUTPUT_SRT}"
              )

              log(
                  f"Debug JSON    : "
                  f"{DEBUG_JSON}"
              )

              log(
                  "Most common OCR results:"
              )

              for (
                  text,
                  count,
              ) in counter.most_common(
                  20
              ):
                  log(
                      f"  {count:4d}x "
                      f"{text!r}"
                  )

              log(
                  "======================================="
              )


          if __name__ == "__main__":
              main()
          PY

      - name: OCR Debug only
        env:
          SCAN_SECONDS: ${{ inputs.scan_seconds }}
          OCR_FPS: ${{ inputs.ocr_fps }}
          DISABLE_MODEL_SOURCE_CHECK: "True"
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          set -euo pipefail
          python process.py

      - name: Check Chinese subtitle
        run: |
          set -euo pipefail

          if [ ! -f chinese.srt ]; then
            echo "::error::chinese.srt khong duoc tao."
            exit 1
          fi

          echo "========== chinese.srt =========="
          cat chinese.srt

          echo ""
          echo "========== OCR DEBUG REGION =========="

          python - <<'PY'
          import json
          from pathlib import Path

          debug_file = Path("work/ocr_debug.json")

          if not debug_file.exists():
              raise SystemExit("work/ocr_debug.json khong ton tai")

          data = json.loads(
              debug_file.read_text(
                  encoding="utf-8"
              )
          )

          region = data["region"]

          print(
              json.dumps(
                  region,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print()
          print(
              "sample_count:",
              data["sample_count"]
          )

          print(
              "nonempty_sample_count:",
              data["nonempty_sample_count"]
          )

          print(
              "cue_count:",
              data["cue_count"]
          )
          PY

      - name: Commit Chinese subtitle to repository
        run: |
          set -euo pipefail

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt khong ton tai hoac rong."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chinese.srt

          if git diff --cached --quiet; then
            echo "chinese.srt khong thay doi, khong can commit."
          else
            git commit -m "debug: update Chinese OCR subtitle"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
