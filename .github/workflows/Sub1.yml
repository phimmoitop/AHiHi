name: Bilibili Hard Subtitle Extractor — Pixel Timing + Midpoint OCR

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili video URL"
        required: true
        type: string

      scan_fps:
        description: "FPS scan thô để tìm timing"
        required: false
        default: "12"
        type: string

      refine_radius:
        description: "Khoảng refine quanh transition, giây"
        required: false
        default: "0.25"
        type: string

      midpoint_offsets:
        description: "OCR thêm quanh midpoint, ví dụ 0.08"
        required: false
        default: "0.08"
        type: string

      save_debug_frames:
        description: "Lưu frame OCR để debug"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            tqdm \
            pysubs2 \
            yt-dlp

          python -m pip install \
            paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/

          python -m pip install \
            paddleocr==3.3.2


      # ============================================================
      # PREPARE
      # ============================================================

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p work
          mkdir -p work/debug_frames

          rm -f chinese.srt
          rm -f work/timing.json
          rm -f work/ocr.json
          rm -f work/all_debug.json
          rm -f work/cookies.txt


      # ============================================================
      # BILIBILI COOKIES
      # ============================================================

      - name: Prepare Bilibili cookies
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
        run: |
          set -euo pipefail

          if [ -z "${BILIBILI_COOKIES:-}" ]; then
            echo "::error::BILIBILI_COOKIES chưa được cấu hình."
            exit 1
          fi

          printf '%s\n' "$BILIBILI_COOKIES" > work/cookies.txt

          chmod 600 work/cookies.txt


      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download Bilibili video
        env:
          BILIBILI_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          yt-dlp \
            --cookies work/cookies.txt \
            --no-playlist \
            --extractor-retries 5 \
            --fragment-retries 5 \
            --retries 5 \
            --socket-timeout 30 \
            --add-header "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --add-header "Referer: https://www.bilibili.com/" \
            --add-header "Origin: https://www.bilibili.com" \
            -f "bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b" \
            --merge-output-format mp4 \
            -o "work/source.%(ext)s" \
            "$BILIBILI_URL"

          if [ ! -f work/source.mp4 ]; then
            echo "::error::work/source.mp4 không tồn tại."

            find work -maxdepth 2 -type f -ls

            exit 1
          fi

          ls -lh work/


      # ============================================================
      # CREATE PROCESS SCRIPT
      # ============================================================

      - name: Create subtitle extraction script
        run: |
          cat > process.py <<'PY'
          import os
          import re
          import json
          import math
          import subprocess
          from pathlib import Path
          from collections import Counter

          import cv2
          import numpy as np
          import pysubs2

          from tqdm import tqdm
          from paddleocr import PaddleOCR


          # ============================================================
          # PATHS
          # ============================================================

          WORK = Path("work")
          VIDEO = WORK / "source.mp4"

          TIMING_JSON = WORK / "timing.json"
          OCR_JSON = WORK / "ocr.json"
          DEBUG_JSON = WORK / "all_debug.json"

          OUTPUT_SRT = Path("chinese.srt")

          DEBUG_FRAMES_DIR = WORK / "debug_frames"


          # ============================================================
          # CONFIG
          # ============================================================

          SCAN_FPS = float(
              os.environ.get(
                  "SCAN_FPS",
                  "12",
              )
          )

          REFINE_RADIUS = float(
              os.environ.get(
                  "REFINE_RADIUS",
                  "0.25",
              )
          )

          MIDPOINT_OFFSET = float(
              os.environ.get(
                  "MIDPOINT_OFFSET",
                  "0.08",
              )
          )

          SAVE_DEBUG_FRAMES = (
              os.environ.get(
                  "SAVE_DEBUG_FRAMES",
                  "true",
              ).lower()
              == "true"
          )


          # ============================================================
          # SUBTITLE ROI
          # ============================================================
          #
          # Chỉ phân tích phần dưới video.
          #
          # Với video 1920x1080:
          #
          # y = 756..1080
          #
          # tức 30% cuối.
          #
          # Không OCR ở đây.
          # Chỉ dùng pixel analysis.
          # ============================================================

          ROI_Y1_RATIO = 0.70
          ROI_Y2_RATIO = 0.99


          # ============================================================
          # PIXEL DETECTION
          # ============================================================
          #
          # Hard subtitle Trung thường:
          #
          # - sáng hơn background
          # - có edge mạnh
          # - nằm thành một hoặc hai hàng
          # - tồn tại liên tục trong nhiều frame
          #
          # Không dùng OCR.
          #
          # Chúng ta tạo subtitle-like mask bằng:
          #
          #   bright pixels
          #   +
          #   local contrast
          #   +
          #   edge
          #
          # Sau đó dùng morphology để gom stroke thành text band.
          # ============================================================

          BRIGHT_THRESHOLD = 175

          LOCAL_CONTRAST_THRESHOLD = 25

          EDGE_THRESHOLD = 60

          MIN_COMPONENT_HEIGHT = 3
          MAX_COMPONENT_HEIGHT_RATIO = 0.20

          MORPH_KERNEL_W_RATIO = 0.018

          # Tỷ lệ horizontal occupancy tối thiểu.
          #
          # Không đặt quá cao vì một subtitle ngắn có thể chỉ chiếm
          # 10-15% chiều rộng.
          MIN_BAND_OCCUPANCY = 0.008

          # Điểm score cuối cùng.
          #
          # threshold được tính adaptive từ toàn video.
          SCORE_PERCENTILE = 90.0

          SCORE_THRESHOLD_FACTOR = 0.45


          # ============================================================
          # TEMPORAL FILTER
          # ============================================================

          # Subtitle phải tồn tại ít nhất khoảng này.
          MIN_CUE_DURATION = 0.20

          # Khoảng trống nhỏ giữa 2 đoạn có thể vẫn là cùng subtitle.
          MAX_INTERNAL_GAP = 0.18

          # Loại bỏ những burst quá ngắn.
          MIN_ACTIVE_FRAMES = 2


          # ============================================================
          # OCR CONFIG
          # ============================================================

          OCR_UPSCALE = 2.5

          OCR_DET_LIMIT_SIDE_LEN = 2500

          OCR_USE_CLAHE = True

          OCR_LANG = "ch"

          # ============================================================
          # OCR FRAME SELECTION
          # ============================================================
          #
          # Không OCR timing.
          #
          # Chỉ lấy:
          #
          #   midpoint - offset
          #   midpoint
          #   midpoint + offset
          #
          # rồi chọn frame/text tốt nhất.
          # ============================================================

          OCR_CANDIDATE_OFFSETS = (
              -MIDPOINT_OFFSET,
              0.0,
              MIDPOINT_OFFSET,
          )


          # ============================================================
          # UTILS
          # ============================================================

          def log(message):
              print(
                  message,
                  flush=True,
              )


          def chinese_count(text):
              return len(
                  re.findall(
                      r"[\u3400-\u9fff]",
                      str(text),
                  )
              )


          def normalize_text(text):
              text = str(text).strip()

              text = re.sub(
                  r"\s+",
                  "",
                  text,
              )

              # Loại một số ký tự rác phổ biến.
              text = text.replace(
                  "　",
                  "",
              )

              return text


          # ============================================================
          # JSON SAFE
          # ============================================================
          #
          # FIX LỖI:
          #
          # TypeError:
          # Object of type int64 is not JSON serializable
          #
          # ============================================================

          def json_safe(obj):

              if isinstance(
                  obj,
                  np.integer,
              ):
                  return int(obj)

              if isinstance(
                  obj,
                  np.floating,
              ):
                  return float(obj)

              if isinstance(
                  obj,
                  np.bool_,
              ):
                  return bool(obj)

              if isinstance(
                  obj,
                  np.ndarray,
              ):
                  return [
                      json_safe(x)
                      for x in obj.tolist()
                  ]

              if isinstance(
                  obj,
                  dict,
              ):
                  return {
                      str(k): json_safe(v)
                      for k, v in obj.items()
                  }

              if isinstance(
                  obj,
                  (
                      list,
                      tuple,
                  ),
              ):
                  return [
                      json_safe(x)
                      for x in obj
                  ]

              return obj


          def write_json(
              path,
              data,
          ):

              path.write_text(
                  json.dumps(
                      json_safe(data),
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          # ============================================================
          # VIDEO INFO
          # ============================================================

          def probe_video():

              cmd = [
                  "ffprobe",
                  "-hide_banner",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width,height,r_frame_rate,nb_frames",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "json",
                  str(VIDEO),
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=True,
              )

              data = json.loads(
                  result.stdout
              )

              stream = data["streams"][0]

              width = int(
                  stream["width"]
              )

              height = int(
                  stream["height"]
              )

              fps_num, fps_den = (
                  stream["r_frame_rate"]
                  .split("/")
              )

              fps = (
                  float(fps_num)
                  / float(fps_den)
              )

              duration = float(
                  data["format"]["duration"]
              )

              nb_frames_raw = stream.get(
                  "nb_frames"
              )

              if nb_frames_raw:
                  try:
                      nb_frames = int(
                          nb_frames_raw
                      )
                  except Exception:
                      nb_frames = None
              else:
                  nb_frames = None

              return {
                  "width": width,
                  "height": height,
                  "fps": fps,
                  "duration": duration,
                  "nb_frames": nb_frames,
              }


          # ============================================================
          # READ ONE FRAME
          # ============================================================

          def get_frame(
              time_sec,
          ):

              time_sec = max(
                  0.0,
                  float(time_sec),
              )

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-ss",
                  f"{time_sec:.6f}",
                  "-i",
                  str(VIDEO),
                  "-frames:v",
                  "1",
                  "-f",
                  "image2pipe",
                  "-vcodec",
                  "mjpeg",
                  "-q:v",
                  "2",
                  "-",
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if (
                  result.returncode != 0
                  or not result.stdout
              ):
                  return None

              raw = np.frombuffer(
                  result.stdout,
                  dtype=np.uint8,
              )

              frame = cv2.imdecode(
                  raw,
                  cv2.IMREAD_COLOR,
              )

              return frame


          # ============================================================
          # ROI
          # ============================================================

          def get_roi(
              frame,
              video_info,
          ):

              height = video_info["height"]
              width = video_info["width"]

              y1 = int(
                  height
                  * ROI_Y1_RATIO
              )

              y2 = int(
                  height
                  * ROI_Y2_RATIO
              )

              return (
                  frame[
                      y1:y2,
                      0:width,
                  ],
                  y1,
                  y2,
              )


          # ============================================================
          # SUBTITLE PIXEL MASK
          # ============================================================

          def subtitle_mask(
              roi,
          ):

              if roi is None:
                  return None

              gray = cv2.cvtColor(
                  roi,
                  cv2.COLOR_BGR2GRAY,
              )

              # --------------------------------------------------------
              # 1. Bright mask
              # --------------------------------------------------------

              bright = (
                  gray
                  >= BRIGHT_THRESHOLD
              ).astype(
                  np.uint8
              ) * 255

              # --------------------------------------------------------
              # 2. Local contrast / top-hat
              # --------------------------------------------------------

              kernel_size = max(
                  9,
                  int(
                      min(
                          roi.shape[0],
                          roi.shape[1],
                      )
                      * 0.025
                  ),
              )

              if kernel_size % 2 == 0:
                  kernel_size += 1

              kernel = cv2.getStructuringElement(
                  cv2.MORPH_ELLIPSE,
                  (
                      kernel_size,
                      kernel_size,
                  ),
              )

              background = cv2.morphologyEx(
                  gray,
                  cv2.MORPH_CLOSE,
                  kernel,
              )

              local_contrast = cv2.subtract(
                  background,
                  gray,
              )

              # Bright local structures.
              local_bright = (
                  gray.astype(
                      np.int16
                  )
                  - cv2.GaussianBlur(
                      gray,
                      (0, 0),
                      3,
                  ).astype(
                      np.int16
                  )
              )

              local_bright = np.clip(
                  local_bright,
                  0,
                  255,
              ).astype(
                  np.uint8
              )

              local_mask = (
                  local_bright
                  >= LOCAL_CONTRAST_THRESHOLD
              ).astype(
                  np.uint8
              ) * 255

              # --------------------------------------------------------
              # 3. Edge mask
              # --------------------------------------------------------

              edges = cv2.Canny(
                  gray,
                  EDGE_THRESHOLD,
                  EDGE_THRESHOLD * 2,
              )

              # --------------------------------------------------------
              # Combine
              # --------------------------------------------------------
              #
              # Subtitle stroke thường vừa sáng vừa có edge.
              #
              combined = cv2.bitwise_and(
                  bright,
                  cv2.bitwise_or(
                      local_mask,
                      edges,
                  ),
              )

              # --------------------------------------------------------
              # Morphology
              # --------------------------------------------------------

              kernel_w = max(
                  7,
                  int(
                      roi.shape[1]
                      * MORPH_KERNEL_W_RATIO
                  ),
              )

              kernel_h = max(
                  2,
                  int(
                      roi.shape[0]
                      * 0.015
                  ),
              )

              horizontal_kernel = cv2.getStructuringElement(
                  cv2.MORPH_RECT,
                  (
                      kernel_w,
                      kernel_h,
                  ),
              )

              combined = cv2.morphologyEx(
                  combined,
                  cv2.MORPH_CLOSE,
                  horizontal_kernel,
              )

              # Remove tiny noise.
              small_kernel = cv2.getStructuringElement(
                  cv2.MORPH_RECT,
                  (3, 3),
              )

              combined = cv2.morphologyEx(
                  combined,
                  cv2.MORPH_OPEN,
                  small_kernel,
              )

              return combined


          # ============================================================
          # PIXEL SCORE
          # ============================================================

          def subtitle_score(
              roi,
          ):

              mask = subtitle_mask(
                  roi
              )

              if mask is None:
                  return {
                      "score": 0.0,
                      "occupancy": 0.0,
                      "band_score": 0.0,
                      "components": 0,
                      "mask": None,
                  }

              h, w = mask.shape

              occupancy = (
                  float(
                      np.count_nonzero(
                          mask
                      )
                  )
                  / float(
                      h * w
                  )
              )

              # --------------------------------------------------------
              # Connected components
              # --------------------------------------------------------

              num_labels, labels, stats, _ = (
                  cv2.connectedComponentsWithStats(
                      mask,
                      connectivity=8,
                  )
              )

              valid_components = []

              max_component_height = int(
                  h
                  * MAX_COMPONENT_HEIGHT_RATIO
              )

              for i in range(
                  1,
                  num_labels,
              ):

                  x = int(
                      stats[i, cv2.CC_STAT_LEFT]
                  )

                  y = int(
                      stats[i, cv2.CC_STAT_TOP]
                  )

                  cw = int(
                      stats[i, cv2.CC_STAT_WIDTH]
                  )

                  ch = int(
                      stats[i, cv2.CC_STAT_HEIGHT]
                  )

                  area = int(
                      stats[i, cv2.CC_STAT_AREA]
                  )

                  if (
                      ch
                      < MIN_COMPONENT_HEIGHT
                  ):
                      continue

                  if (
                      ch
                      > max_component_height
                  ):
                      continue

                  if cw < 3:
                      continue

                  if area < 8:
                      continue

                  valid_components.append(
                      (
                          x,
                          y,
                          cw,
                          ch,
                          area,
                      )
                  )

              # --------------------------------------------------------
              # Text-like horizontal bands
              # --------------------------------------------------------

              band_score = 0.0

              if valid_components:

                  # Tính coverage của component bbox.
                  #
                  # Subtitle text thường tạo thành cluster theo
                  # chiều ngang.
                  xs = [
                      c[0]
                      for c in valid_components
                  ]

                  xe = [
                      c[0] + c[2]
                      for c in valid_components
                  ]

                  min_x = min(xs)
                  max_x = max(xe)

                  horizontal_span = (
                      max_x
                      - min_x
                  )

                  horizontal_ratio = (
                      horizontal_span
                      / max(
                          1,
                          w,
                      )
                  )

                  # Score có trọng số nhẹ.
                  band_score = (
                      horizontal_ratio
                      * min(
                          1.0,
                          len(
                              valid_components
                          )
                          / 8.0,
                      )
                  )

              # --------------------------------------------------------
              # Vertical concentration
              # --------------------------------------------------------
              #
              # Subtitle thường tập trung trong một band ngang,
              # không phủ đều toàn ROI.
              # --------------------------------------------------------

              row_counts = np.count_nonzero(
                  mask,
                  axis=1,
              )

              if row_counts.size:

                  peak_rows = (
                      row_counts
                      > (
                          np.max(
                              row_counts
                          )
                          * 0.25
                      )
                  )

                  vertical_concentration = (
                      float(
                          np.count_nonzero(
                              peak_rows
                          )
                      )
                      / float(h)
                  )

              else:
                  vertical_concentration = 0.0

              # --------------------------------------------------------
              # Final score
              # --------------------------------------------------------
              #
              # Occupancy là tín hiệu chính.
              # Band + component giúp phân biệt background.
              # --------------------------------------------------------

              score = (
                  occupancy
                  * 1.0
                  + band_score
                  * 0.035
                  + vertical_concentration
                  * 0.008
              )

              return {
                  "score": float(score),
                  "occupancy": float(
                      occupancy
                  ),
                  "band_score": float(
                      band_score
                  ),
                  "vertical_concentration": float(
                      vertical_concentration
                  ),
                  "components": int(
                      len(
                          valid_components
                      )
                  ),
                  "mask": mask,
              }


          # ============================================================
          # ADAPTIVE THRESHOLD
          # ============================================================

          def calculate_detection_threshold(
              scores,
          ):

              values = np.asarray(
                  scores,
                  dtype=np.float64,
              )

              values = values[
                  np.isfinite(values)
              ]

              if not len(values):
                  return 0.01

              p90 = float(
                  np.percentile(
                      values,
                      90,
                  )
              )

              p95 = float(
                  np.percentile(
                      values,
                      95,
                  )
              )

              # Adaptive threshold.
              #
              # Không dùng absolute threshold cứng.
              #
              threshold = (
                  p90
                  * SCORE_THRESHOLD_FACTOR
              )

              threshold = max(
                  threshold,
                  0.0005,
              )

              log(
                  f"SCORE P90 = {p90:.6f}"
              )

              log(
                  f"SCORE P95 = {p95:.6f}"
              )

              log(
                  f"DETECTION THRESHOLD = {threshold:.6f}"
              )

              return threshold


          # ============================================================
          # SMOOTH BINARY SIGNAL
          # ============================================================

          def smooth_signal(
              active,
          ):

              arr = np.asarray(
                  active,
                  dtype=np.uint8,
              )

              if len(arr) < 3:
                  return arr

              # Fill one-frame holes.
              #
              # 1110111 -> 1111111
              #
              for i in range(
                  1,
                  len(arr) - 1,
              ):

                  if (
                      arr[i] == 0
                      and arr[i - 1] == 1
                      and arr[i + 1] == 1
                  ):
                      arr[i] = 1

              # Remove isolated one-frame bursts.
              #
              for i in range(
                  1,
                  len(arr) - 1,
              ):

                  if (
                      arr[i] == 1
                      and arr[i - 1] == 0
                      and arr[i + 1] == 0
                  ):
                      arr[i] = 0

              return arr


          # ============================================================
          # COARSE CUES
          # ============================================================

          def detect_coarse_cues(
              samples,
              threshold,
              duration,
          ):

              active = [
                  int(
                      sample["score"]
                      >= threshold
                  )
                  for sample in samples
              ]

              active = smooth_signal(
                  active
              )

              cues = []

              start_index = None

              for i, is_active in enumerate(
                  active
              ):

                  if (
                      is_active
                      and start_index is None
                  ):

                      start_index = i

                  elif (
                      not is_active
                      and start_index is not None
                  ):

                      end_index = i - 1

                      start_time = float(
                          samples[
                              start_index
                          ]["time"]
                      )

                      end_time = float(
                          samples[
                              end_index
                          ]["time"]
                      ) + (
                          1.0
                          / SCAN_FPS
                      )

                      if (
                          end_time
                          - start_time
                          >= MIN_CUE_DURATION
                      ):

                          if (
                              end_index
                              - start_index
                              + 1
                              >= MIN_ACTIVE_FRAMES
                          ):

                              cues.append(
                                  {
                                      "start": max(
                                          0.0,
                                          start_time,
                                      ),
                                      "end": min(
                                          duration,
                                          end_time,
                                      ),
                                      "coarse_start_index": int(
                                          start_index
                                      ),
                                      "coarse_end_index": int(
                                          end_index
                                      ),
                                  }
                              )

                      start_index = None

              if start_index is not None:

                  end_index = (
                      len(samples)
                      - 1
                  )

                  start_time = float(
                      samples[
                          start_index
                      ]["time"]
                  )

                  end_time = min(
                      duration,
                      float(
                          samples[
                              end_index
                          ]["time"]
                      )
                      + (
                          1.0
                          / SCAN_FPS
                      ),
                  )

                  if (
                      end_time
                      - start_time
                      >= MIN_CUE_DURATION
                  ):

                      cues.append(
                          {
                              "start": start_time,
                              "end": end_time,
                              "coarse_start_index": int(
                                  start_index
                              ),
                              "coarse_end_index": int(
                                  end_index
                              ),
                          }
                      )

              return cues


          # ============================================================
          # REFINE TRANSITION
          # ============================================================

          def score_at_time(
              time_sec,
              video_info,
          ):

              frame = get_frame(
                  time_sec
              )

              if frame is None:
                  return 0.0

              roi, _, _ = get_roi(
                  frame,
                  video_info,
              )

              result = subtitle_score(
                  roi
              )

              return float(
                  result["score"]
              )


          def refine_transition(
              approximate_time,
              threshold,
              video_info,
              searching_start,
          ):

              fps = video_info["fps"]

              left = max(
                  0.0,
                  approximate_time
                  - REFINE_RADIUS,
              )

              right = min(
                  video_info["duration"],
                  approximate_time
                  + REFINE_RADIUS,
              )

              frame_step = (
                  1.0
                  / fps
              )

              times = np.arange(
                  left,
                  right + frame_step * 0.5,
                  frame_step,
              )

              states = []

              for time_sec in times:

                  score = score_at_time(
                      float(time_sec),
                      video_info,
                  )

                  states.append(
                      (
                          float(time_sec),
                          float(score),
                          bool(
                              score
                              >= threshold
                          ),
                      )
                  )

              if not states:
                  return float(
                      approximate_time
                  )

              if searching_start:

                  # First frame that becomes active.
                  for (
                      time_sec,
                      score,
                      is_active,
                  ) in states:

                      if is_active:
                          return time_sec

                  return states[-1][0]

              else:

                  # First frame that becomes inactive.
                  for (
                      time_sec,
                      score,
                      is_active,
                  ) in states:

                      if not is_active:
                          return time_sec

                  return states[-1][0]


          # ============================================================
          # REFINE ALL CUES
          # ============================================================

          def refine_cues(
              coarse_cues,
              threshold,
              video_info,
          ):

              refined = []

              for index, cue in enumerate(
                  coarse_cues
              ):

                  coarse_start = float(
                      cue["start"]
                  )

                  coarse_end = float(
                      cue["end"]
                  )

                  refined_start = (
                      refine_transition(
                          coarse_start,
                          threshold,
                          video_info,
                          True,
                      )
                  )

                  refined_end = (
                      refine_transition(
                          coarse_end,
                          threshold,
                          video_info,
                          False,
                      )
                  )

                  # Safety.
                  #
                  # Không cho timing âm / vượt duration.
                  refined_start = max(
                      0.0,
                      min(
                          video_info[
                              "duration"
                          ],
                          refined_start,
                      ),
                  )

                  refined_end = max(
                      refined_start
                      + (
                          1.0
                          / video_info[
                              "fps"
                          ]
                      ),
                      min(
                          video_info[
                              "duration"
                          ],
                          refined_end,
                      ),
                  )

                  duration = (
                      refined_end
                      - refined_start
                  )

                  if (
                      duration
                      < MIN_CUE_DURATION
                  ):
                      continue

                  midpoint = (
                      refined_start
                      + refined_end
                  ) / 2.0

                  item = {
                      "index": int(
                          index
                      ),
                      "start": float(
                          refined_start
                      ),
                      "end": float(
                          refined_end
                      ),
                      "duration": float(
                          duration
                      ),
                      "midpoint": float(
                          midpoint
                      ),
                      "coarse_start": float(
                          coarse_start
                      ),
                      "coarse_end": float(
                          coarse_end
                      ),
                  }

                  refined.append(
                      item
                  )

              return refined


          # ============================================================
          # PASS 1
          # ============================================================

          def timing_pass():

              video_info = probe_video()

              width = video_info[
                  "width"
              ]

              height = video_info[
                  "height"
              ]

              fps = video_info[
                  "fps"
              ]

              duration = video_info[
                  "duration"
              ]

              roi_y1 = int(
                  height
                  * ROI_Y1_RATIO
              )

              roi_y2 = int(
                  height
                  * ROI_Y2_RATIO
              )

              log("")
              log(
                  "=========================================="
              )
              log(
                  "PASS 1 — SUBTITLE TIMING DETECTION"
              )
              log(
                  "=========================================="
              )

              log(
                  f"VIDEO       : {width}x{height}"
              )

              log(
                  f"VIDEO FPS   : {fps:.3f}"
              )

              log(
                  f"DURATION    : {duration:.3f}s"
              )

              log(
                  f"SCAN FPS    : {SCAN_FPS}"
              )

              log(
                  f"ROI         : y={roi_y1}..{roi_y2}"
              )

              log(
                  "OCR         : DISABLED"
              )

              log(
                  "Timing      : PIXEL ANALYSIS ONLY"
              )

              # --------------------------------------------------------
              # FFmpeg continuous decode
              # --------------------------------------------------------

              filter_graph = (
                  f"fps={SCAN_FPS},"
                  f"crop={width}:"
                  f"{roi_y2 - roi_y1}:"
                  f"0:{roi_y1}"
              )

              cmd = [
                  "ffmpeg",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-i",
                  str(VIDEO),
                  "-vf",
                  filter_graph,
                  "-an",
                  "-sn",
                  "-dn",
                  "-pix_fmt",
                  "bgr24",
                  "-f",
                  "rawvideo",
                  "-",
              ]

              process = subprocess.Popen(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  bufsize=1024 * 1024 * 64,
              )

              roi_width = width
              roi_height = (
                  roi_y2
                  - roi_y1
              )

              frame_size = (
                  roi_width
                  * roi_height
                  * 3
              )

              expected = int(
                  math.ceil(
                      duration
                      * SCAN_FPS
                  )
              )

              samples = []

              pbar = tqdm(
                  total=expected,
                  desc="Timing scan",
              )

              index = 0

              try:

                  while True:

                      raw = (
                          process.stdout.read(
                              frame_size
                          )
                      )

                      if (
                          len(raw)
                          != frame_size
                      ):
                          break

                      roi = (
                          np.frombuffer(
                              raw,
                              dtype=np.uint8,
                          )
                          .reshape(
                              (
                                  roi_height,
                                  roi_width,
                                  3,
                              )
                          )
                      )

                      result = subtitle_score(
                          roi
                      )

                      current_time = (
                          index
                          / SCAN_FPS
                      )

                      samples.append(
                          {
                              "index": int(
                                  index
                              ),
                              "time": float(
                                  current_time
                              ),
                              "score": float(
                                  result[
                                      "score"
                                  ]
                              ),
                              "occupancy": float(
                                  result[
                                      "occupancy"
                                  ]
                              ),
                              "band_score": float(
                                  result[
                                      "band_score"
                                  ]
                              ),
                              "vertical_concentration": float(
                                  result[
                                      "vertical_concentration"
                                  ]
                              ),
                              "components": int(
                                  result[
                                      "components"
                                  ]
                              ),
                          }
                      )

                      index += 1

                      pbar.update(1)

              finally:

                  pbar.close()

                  if process.stdout:
                      process.stdout.close()

                  stderr_data = b""

                  if process.stderr:
                      stderr_data = (
                          process.stderr.read()
                      )

                      process.stderr.close()

                  return_code = (
                      process.wait()
                  )

                  if return_code != 0:

                      raise RuntimeError(
                          "FFmpeg timing scan failed:\n"
                          + stderr_data.decode(
                              "utf-8",
                              errors="replace",
                          )
                      )

              scores = [
                  sample["score"]
                  for sample in samples
              ]

              threshold = (
                  calculate_detection_threshold(
                      scores
                  )
              )

              coarse_cues = (
                  detect_coarse_cues(
                      samples,
                      threshold,
                      duration,
                  )
              )

              log("")

              log(
                  f"COARSE TIMING CUES = "
                  f"{len(coarse_cues)}"
              )

              refined_cues = refine_cues(
                  coarse_cues,
                  threshold,
                  video_info,
              )

              log("")

              log(
                  f"REFINED TIMING CUES = "
                  f"{len(refined_cues)}"
              )

              for cue in refined_cues:

                  log(
                      "[%04d] %.6f → %.6f mid=%.6f"
                      % (
                          cue["index"],
                          cue["start"],
                          cue["end"],
                          cue["midpoint"],
                      )
                  )

              timing_data = {
                  "video": video_info,
                  "scan_fps": float(
                      SCAN_FPS
                  ),
                  "roi": {
                      "y1": int(
                          roi_y1
                      ),
                      "y2": int(
                          roi_y2
                      ),
                      "y1_ratio": float(
                          ROI_Y1_RATIO
                      ),
                      "y2_ratio": float(
                          ROI_Y2_RATIO
                      ),
                  },
                  "threshold": float(
                      threshold
                  ),
                  "samples": samples,
                  "coarse_cues": coarse_cues,
                  "cues": refined_cues,
              }

              write_json(
                  TIMING_JSON,
                  timing_data,
              )

              return (
                  video_info,
                  refined_cues,
                  threshold,
              )


          # ============================================================
          # OCR PREPROCESS
          # ============================================================

          def preprocess_ocr(
              image,
          ):

              if image is None:
                  return None

              processed = image

              if (
                  OCR_UPSCALE
                  != 1.0
              ):

                  processed = cv2.resize(
                      processed,
                      None,
                      fx=OCR_UPSCALE,
                      fy=OCR_UPSCALE,
                      interpolation=cv2.INTER_CUBIC,
                  )

              if OCR_USE_CLAHE:

                  lab = cv2.cvtColor(
                      processed,
                      cv2.COLOR_BGR2LAB,
                  )

                  l, a, b = cv2.split(
                      lab
                  )

                  clahe = (
                      cv2.createCLAHE(
                          clipLimit=2.0,
                          tileGridSize=(
                              8,
                              8,
                          ),
                      )
                  )

                  l = clahe.apply(
                      l
                  )

                  processed = cv2.cvtColor(
                      cv2.merge(
                          (
                              l,
                              a,
                              b,
                          )
                      ),
                      cv2.COLOR_LAB2BGR,
                  )

              return processed


          # ============================================================
          # OCR RESULT PARSER
          # ============================================================

          def parse_ocr_result(
              result,
          ):

              items = []

              for page in result:

                  try:

                      data = page.json

                      if callable(data):
                          data = data()

                  except Exception:
                      continue

                  if isinstance(
                      data,
                      str,
                  ):

                      try:
                          data = json.loads(
                              data
                          )
                      except Exception:
                          continue

                  if not isinstance(
                      data,
                      dict,
                  ):
                      continue

                  if isinstance(
                      data.get("res"),
                      dict,
                  ):
                      data = data[
                          "res"
                      ]

                  rec_texts = data.get(
                      "rec_texts",
                      [],
                  )

                  rec_scores = data.get(
                      "rec_scores",
                      [],
                  )

                  rec_polys = data.get(
                      "rec_polys",
                      [],
                  )

                  for i, raw_text in enumerate(
                      rec_texts
                  ):

                      text = normalize_text(
                          raw_text
                      )

                      if not text:
                          continue

                      score = 1.0

                      if (
                          i
                          < len(
                              rec_scores
                          )
                      ):

                          try:
                              score = float(
                                  rec_scores[
                                      i
                                  ]
                              )
                          except Exception:
                              pass

                      box = None

                      if (
                          i
                          < len(
                              rec_polys
                          )
                      ):

                          points = np.asarray(
                              rec_polys[i]
                          )

                          if (
                              points.ndim
                              == 2
                              and points.shape[1]
                              == 2
                          ):

                              box = [
                                  int(
                                      np.min(
                                          points[
                                              :,
                                              0,
                                          ]
                                      )
                                  ),
                                  int(
                                      np.min(
                                          points[
                                              :,
                                              1,
                                          ]
                                      )
                                  ),
                                  int(
                                      np.max(
                                          points[
                                              :,
                                              0,
                                          ]
                                      )
                                  ),
                                  int(
                                      np.max(
                                          points[
                                              :,
                                              1,
                                          ]
                                      )
                                  ),
                              ]

                      items.append(
                          {
                              "text": text,
                              "score": float(
                                  score
                              ),
                              "box": box,
                          }
                      )

              items.sort(
                  key=lambda x: (
                      x["box"][0]
                      if x["box"]
                      else 0
                  )
              )

              return items


          # ============================================================
          # OCR ONE FRAME
          # ============================================================

          def ocr_one_frame(
              ocr,
              frame,
              video_info,
          ):

              roi, y1, y2 = get_roi(
                  frame,
                  video_info,
              )

              processed = (
                  preprocess_ocr(
                      roi
                  )
              )

              result = ocr.predict(
                  processed
              )

              items = parse_ocr_result(
                  result
              )

              chinese_items = [
                  item
                  for item in items
                  if chinese_count(
                      item["text"]
                  )
                  > 0
              ]

              chinese_items.sort(
                  key=lambda x: (
                      x["box"][0]
                      if x["box"]
                      else 0
                  )
              )

              text = normalize_text(
                  "".join(
                      item["text"]
                      for item in chinese_items
                  )
              )

              if chinese_items:

                  mean_score = float(
                      np.mean(
                          [
                              item[
                                  "score"
                              ]
                              for item
                              in chinese_items
                          ]
                      )
                  )

              else:

                  mean_score = 0.0

              chinese_chars = (
                  chinese_count(
                      text
                  )
              )

              # --------------------------------------------------------
              # Visual quality
              # --------------------------------------------------------
              #
              # Không chọn frame chỉ vì OCR confidence.
              #
              # Subtitle frame rõ thường có:
              #
              # - edge mạnh
              # - stroke contrast tốt
              #
              # --------------------------------------------------------

              gray = cv2.cvtColor(
                  roi,
                  cv2.COLOR_BGR2GRAY,
              )

              laplacian_var = float(
                  cv2.Laplacian(
                      gray,
                      cv2.CV_64F,
                  ).var()
              )

              quality_score = (
                  mean_score
                  * 0.65
                  + min(
                      1.0,
                      chinese_chars
                      / 20.0,
                  )
                  * 0.25
                  + min(
                      1.0,
                      laplacian_var
                      / 1000.0,
                  )
                  * 0.10
              )

              return {
                  "text": text,
                  "items": chinese_items,
                  "ocr_score": float(
                      mean_score
                  ),
                  "chinese_chars": int(
                      chinese_chars
                  ),
                  "sharpness": float(
                      laplacian_var
                  ),
                  "quality_score": float(
                      quality_score
                  ),
              }


          # ============================================================
          # CHOOSE OCR RESULT
          # ============================================================

          def choose_best_ocr(
              candidates,
          ):

              valid = [
                  candidate
                  for candidate
                  in candidates
                  if candidate["text"]
              ]

              if not valid:
                  return {
                      "text": "",
                      "reason": "no_ocr_result",
                  }

              # --------------------------------------------------------
              # Group exact text.
              # --------------------------------------------------------

              groups = {}

              for candidate in valid:

                  text = candidate[
                      "text"
                  ]

                  groups.setdefault(
                      text,
                      [],
                  ).append(
                      candidate
                  )

              # --------------------------------------------------------
              # Consensus first.
              #
              # Nếu 2/3 frame cùng text thì ưu tiên consensus.
              # --------------------------------------------------------

              ranked_groups = []

              for text, group in groups.items():

                  best_candidate = max(
                      group,
                      key=lambda x: (
                          x[
                              "quality_score"
                          ],
                          x[
                              "ocr_score"
                          ],
                          x[
                              "chinese_chars"
                          ],
                      ),
                  )

                  ranked_groups.append(
                      (
                          len(group),
                          text,
                          best_candidate,
                      )
                  )

              ranked_groups.sort(
                  key=lambda x: (
                      x[0],
                      x[2][
                          "quality_score"
                      ],
                      x[2][
                          "ocr_score"
                      ],
                      x[2][
                          "chinese_chars"
                      ],
                  ),
                  reverse=True,
              )

              best = (
                  ranked_groups[0][2]
              )

              return {
                  "text": best["text"],
                  "selected_time": best[
                      "time"
                  ],
                  "ocr_score": best[
                      "ocr_score"
                  ],
                  "sharpness": best[
                      "sharpness"
                  ],
                  "quality_score": best[
                      "quality_score"
                  ],
                  "chinese_chars": best[
                      "chinese_chars"
                  ],
                  "consensus": int(
                      ranked_groups[0][0]
                  ),
                  "candidates": candidates,
              }


          # ============================================================
          # PASS 2
          # ============================================================

          def midpoint_ocr_pass(
              video_info,
              cues,
          ):

              log("")
              log(
                  "=========================================="
              )
              log(
                  "PASS 2 — MIDPOINT OCR"
              )
              log(
                  "=========================================="
              )

              log(
                  "Timing source = PASS 1"
              )

              log(
                  "OCR frame = MIDPOINT ± OFFSET"
              )

              log(
                  f"Total cues = {len(cues)}"
              )

              if not cues:
                  return []

              log(
                  "Loading PaddleOCR..."
              )

              ocr = PaddleOCR(
                  lang=OCR_LANG,
                  text_det_limit_side_len=OCR_DET_LIMIT_SIDE_LEN,
                  text_det_limit_type="max",
              )

              output = []

              for cue_index, cue in enumerate(
                  tqdm(
                      cues,
                      desc="Midpoint OCR",
                  )
              ):

                  midpoint = float(
                      cue["midpoint"]
                  )

                  candidate_times = []

                  for offset in (
                      OCR_CANDIDATE_OFFSETS
                  ):

                      time_sec = (
                          midpoint
                          + offset
                      )

                      time_sec = max(
                          cue["start"]
                          + 0.05,
                          min(
                              cue["end"]
                              - 0.05,
                              time_sec,
                          ),
                      )

                      candidate_times.append(
                          float(
                              time_sec
                          )
                      )

                  # Remove duplicates.
                  candidate_times = list(
                      dict.fromkeys(
                          candidate_times
                      )
                  )

                  candidates = []

                  for time_sec in candidate_times:

                      frame = get_frame(
                          time_sec
                      )

                      if frame is None:
                          continue

                      result = (
                          ocr_one_frame(
                              ocr,
                              frame,
                              video_info,
                          )
                      )

                      result["time"] = float(
                          time_sec
                      )

                      candidates.append(
                          result
                      )

                      # ------------------------------------------------
                      # Save debug frame.
                      # ------------------------------------------------

                      if (
                          SAVE_DEBUG_FRAMES
                      ):

                          safe_index = int(
                              cue_index
                          )

                          filename = (
                              DEBUG_FRAMES_DIR
                              / (
                                  f"{safe_index:04d}"
                                  f"_"
                                  f"{time_sec:.3f}"
                                  ".jpg"
                              )
                          )

                          cv2.imwrite(
                              str(filename),
                              frame,
                              [
                                  int(
                                      cv2.IMWRITE_JPEG_QUALITY
                                  ),
                                  95,
                              ],
                          )

                  best = choose_best_ocr(
                      candidates
                  )

                  best["index"] = int(
                      cue_index
                  )

                  best["start"] = float(
                      cue["start"]
                  )

                  best["end"] = float(
                      cue["end"]
                  )

                  best["midpoint"] = float(
                      cue["midpoint"]
                  )

                  output.append(
                      best
                  )

                  log(
                      "[%04d] %.6f → %.6f "
                      "mid=%.6f "
                      "TEXT=%r"
                      % (
                          cue_index,
                          cue["start"],
                          cue["end"],
                          cue["midpoint"],
                          best.get(
                              "text",
                              "",
                          ),
                      )
                  )

              return output


          # ============================================================
          # CLEAN FINAL CUES
          # ============================================================

          def clean_final_cues(
              ocr_cues,
          ):

              final = []

              for cue in ocr_cues:

                  text = normalize_text(
                      cue.get(
                          "text",
                          "",
                      )
                  )

                  if not text:
                      continue

                  start = float(
                      cue["start"]
                  )

                  end = float(
                      cue["end"]
                  )

                  if (
                      end
                      <= start
                  ):
                      continue

                  final.append(
                      {
                          "start": start,
                          "end": end,
                          "text": text,
                      }
                  )

              # --------------------------------------------------------
              # Merge exact duplicate subtitles that are separated by
              # a tiny gap.
              # --------------------------------------------------------

              merged = []

              for cue in final:

                  if not merged:

                      merged.append(
                          cue
                      )

                      continue

                  previous = merged[
                      -1
                  ]

                  gap = (
                      cue["start"]
                      - previous["end"]
                  )

                  if (
                      cue["text"]
                      == previous["text"]
                      and gap
                      <= 0.15
                  ):

                      previous["end"] = max(
                          previous["end"],
                          cue["end"],
                      )

                  else:

                      merged.append(
                          cue
                      )

              return merged


          # ============================================================
          # SAVE SRT
          # ============================================================

          def save_srt(
              cues,
          ):

              subs = pysubs2.SSAFile()

              for cue in cues:

                  start_ms = int(
                      round(
                          cue["start"]
                          * 1000
                      )
                  )

                  end_ms = int(
                      round(
                          cue["end"]
                          * 1000
                      )
                  )

                  subs.events.append(
                      pysubs2.SSAEvent(
                          start=start_ms,
                          end=end_ms,
                          text=cue["text"],
                      )
                  )

              subs.save(
                  str(
                      OUTPUT_SRT
                  ),
                  encoding="utf-8",
              )


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              if not VIDEO.exists():

                  raise RuntimeError(
                      f"Video không tồn tại: {VIDEO}"
                  )

              (
                  video_info,
                  timing_cues,
                  threshold,
              ) = timing_pass()

              ocr_results = (
                  midpoint_ocr_pass(
                      video_info,
                      timing_cues,
                  )
              )

              final_cues = (
                  clean_final_cues(
                      ocr_results
                  )
              )

              save_srt(
                  final_cues
              )

              ocr_data = {
                  "video": video_info,
                  "midpoint_offset": float(
                      MIDPOINT_OFFSET
                  ),
                  "ocr_upscale": float(
                      OCR_UPSCALE
                  ),
                  "ocr_det_limit_side_len": int(
                      OCR_DET_LIMIT_SIDE_LEN
                  ),
                  "results": ocr_results,
              }

              write_json(
                  OCR_JSON,
                  ocr_data,
              )

              debug_data = {
                  "video": video_info,
                  "timing_threshold": float(
                      threshold
                  ),
                  "timing_cues": timing_cues,
                  "ocr_results": ocr_results,
                  "final_cues": final_cues,
              }

              write_json(
                  DEBUG_JSON,
                  debug_data,
              )

              log("")
              log(
                  "=========================================="
              )
              log(
                  "FINAL RESULT"
              )
              log(
                  "=========================================="
              )

              log(
                  f"Timing cues : "
                  f"{len(timing_cues)}"
              )

              log(
                  f"OCR cues    : "
                  f"{len(ocr_results)}"
              )

              log(
                  f"Final cues  : "
                  f"{len(final_cues)}"
              )

              log(
                  f"Output      : "
                  f"{OUTPUT_SRT}"
              )

              log(
                  f"Timing JSON : "
                  f"{TIMING_JSON}"
              )

              log(
                  f"OCR JSON    : "
                  f"{OCR_JSON}"
              )

              log("")
              log(
                  "========== FINAL SRT =========="
              )

              if OUTPUT_SRT.exists():

                  print(
                      OUTPUT_SRT.read_text(
                          encoding="utf-8"
                      )
                  )

              else:

                  log(
                      "SRT không tồn tại."
                  )


          if __name__ == "__main__":
              main()

          PY


      # ============================================================
      # RUN
      # ============================================================

      - name: Run subtitle extraction
        env:
          SCAN_FPS: ${{ inputs.scan_fps }}
          REFINE_RADIUS: ${{ inputs.refine_radius }}
          MIDPOINT_OFFSET: ${{ inputs.midpoint_offsets }}
          SAVE_DEBUG_FRAMES: ${{ inputs.save_debug_frames }}
        run: |
          set -euo pipefail

          python process.py


      # ============================================================
      # CHECK RESULT
      # ============================================================

      - name: Check Chinese subtitle
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "FINAL SRT"
          echo "=========================================="

          if [ ! -f chinese.srt ]; then
            echo "::error::chinese.srt không được tạo."
            exit 1
          fi

          cat chinese.srt

          echo ""
          echo "=========================================="
          echo "TIMING JSON"
          echo "=========================================="

          if [ -f work/timing.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("work/timing.json").read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Timing cues:",
              len(data.get("cues", []))
          )

          for cue in data.get("cues", []):
              print(
                  "[%04d] %.6f -> %.6f mid=%.6f"
                  % (
                      cue["index"],
                      cue["start"],
                      cue["end"],
                      cue["midpoint"],
                  )
              )
          PY
          fi

          echo ""
          echo "=========================================="
          echo "OCR JSON"
          echo "=========================================="

          if [ -f work/ocr.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("work/ocr.json").read_text(
                  encoding="utf-8"
              )
          )

          results = data.get(
              "results",
              []
          )

          print(
              "OCR results:",
              len(results)
          )

          for item in results:
              print(
                  "[%04d] %.6f -> %.6f | %s"
                  % (
                      item["index"],
                      item["start"],
                      item["end"],
                      item.get(
                          "text",
                          "",
                      ),
                  )
              )
          PY
          fi

          echo ""

          if ! grep -q '[一-龥]' chinese.srt; then
            echo "::error::Không tìm thấy Chinese character trong chinese.srt."
            exit 1
          fi

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt rỗng."
            exit 1
          fi


      # ============================================================
      # UPLOAD DEBUG ARTIFACT
      # ============================================================

      - name: Upload subtitle debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-debug
          path: |
            work/timing.json
            work/ocr.json
            work/all_debug.json
            work/debug_frames/
            chinese.srt
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # COMMIT SRT
      # ============================================================

      - name: Commit Chinese subtitle to repository
        run: |
          set -euo pipefail

          if [ ! -s chinese.srt ]; then
            echo "::error::chinese.srt không tồn tại hoặc rỗng."
            exit 1
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add chinese.srt

          if git diff --cached --quiet; then

            echo \
              "chinese.srt không thay đổi, không cần commit."

          else

            git commit \
              -m "extract: Chinese hard subtitle"

            git push \
              origin \
              HEAD:${{ github.ref_name }}

          fi


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
