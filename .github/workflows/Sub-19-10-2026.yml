      - name: TTS Generation (from Vietnamese VTT)
        run: |
          python3 <<'EOF'
          import webvtt, os, re, asyncio, edge_tts, sys

          MAX_CONCURRENT_TTS = 8
          MAX_ATTEMPTS = 4
          ERROR_THRESHOLD = 5  # Ngưỡng lỗi để dừng workflow
          failed_count = 0
          done_count = 0

          def normalize_for_tts(text):
              text = text.lower()
              text = re.sub(r'<[^>]+>', '', text)
              text = re.sub(r'\b([a-zà-ỹđ])-\1', r'\1', text)
              text = re.sub(r'\s+', ' ', text).strip()
              text = text.replace('"', '').replace('[', '').replace(']', '')
              text = text.replace(",", ", ").replace(".", ". ")
              if not text.endswith((".", "!", "?", "...")): text += "."
              return text

          async def generate_tts(text, out, idx, semaphore, total):
              global failed_count, done_count
              async with semaphore:
                  try:
                      tts_text = normalize_for_tts(text)
                      if not tts_text or tts_text == ".":
                          # cue rỗng: không tạo file, bước mix sẽ coi là im lặng
                          return
                      last_err = None
                      for attempt in range(MAX_ATTEMPTS):
                          try:
                              tts = edge_tts.Communicate(tts_text, voice="vi-VN-HoaiMyNeural", rate="+32%")
                              await tts.save(out)
                              if os.path.exists(out) and os.path.getsize(out) > 0:
                                  return
                              raise RuntimeError("Empty audio file")
                          except Exception as e:
                              last_err = e
                              if os.path.exists(out):
                                  os.remove(out)
                              await asyncio.sleep(1.5 * (attempt + 1))
                      raise last_err
                  except Exception as e:
                      failed_count += 1
                      print(f"Lỗi đoạn {idx}: {e}", flush=True)
                  finally:
                      done_count += 1
                      if done_count % 200 == 0:
                          print(f"TTS {done_count}/{total}", flush=True)

          async def main():
              vtt_path = "work/vietnamese.vtt"
              if not os.path.exists(vtt_path):
                  print(f"Missing {vtt_path}"); sys.exit(1)

              vtt = webvtt.read(vtt_path)
              os.makedirs("chunks", exist_ok=True)
              semaphore = asyncio.Semaphore(MAX_CONCURRENT_TTS)
              total = len(vtt)

              tasks = [generate_tts(c.text, f"chunks/c_{i}.mp3", i, semaphore, total) for i, c in enumerate(vtt)]
              await asyncio.gather(*tasks)

              print(f"Tổng số đoạn lỗi: {failed_count}")
              if failed_count > ERROR_THRESHOLD:
                  print(f"Phát hiện {failed_count} đoạn lỗi (vượt ngưỡng {ERROR_THRESHOLD}). Dừng Workflow!")
                  sys.exit(1)

              with open("count.txt", "w") as f: f.write(str(total))
              print(f"[DONE] Generated {total} TTS chunks")

          asyncio.run(main())
          EOF

      - name: Build TTS track (numpy, one pass) & final mix filter
        run: |
          set -euo pipefail
          VIDEO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          AUDIO_RATE=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          if [ -z "$AUDIO_RATE" ]; then AUDIO_RATE=44100; fi
          echo "audio_rate=$AUDIO_RATE" >> $GITHUB_ENV

          export VIDEO_DURATION=$VIDEO_DURATION
          export AUDIO_RATE=$AUDIO_RATE

          python3 <<'EOF'
          import os, wave, subprocess
          import numpy as np
          import av
          import webvtt

          TTS_PEAK = 0.60           # mỗi đoạn TTS được chuẩn hóa về mức này (thay cho gain cố định 3.5 gây vỡ tiếng)
          BG_VOLUME = 0.1           # gain cho tiếng gốc (áp trong ffmpeg ở bước render)
          DELAY_MS = 500            # TTS bắt đầu sau cue 500 ms
          GAP_MS = 80               # khoảng nghỉ tối thiểu giữa 2 đoạn TTS liền nhau
          MAX_DRIFT_MS = 2500       # cho phép lùi tối đa so với mốc cue; quá mức này mới chấp nhận chồng
          MAX_SPEEDUP = 1.35        # tăng tốc thêm tối đa cho đoạn không vừa khe trống (nhân với +28% sẵn có)
          SIL_THRESH = 10 ** (-50 / 20)   # -50 dB, cắt khoảng lặng đầu và cuối mỗi đoạn

          rate = int(os.environ["AUDIO_RATE"])
          duration = float(os.environ["VIDEO_DURATION"])

          def to_ms(time_str):
              h, m, s = time_str.replace(',', '.').split(':')
              return int(float(h) * 3600000 + float(m) * 60000 + float(s) * 1000)

          def as_list(x):
              if x is None: return []
              return x if isinstance(x, list) else [x]

          def decode_mono(path):
              c = av.open(path)
              rs = av.AudioResampler(format="flt", layout="mono", rate=rate)
              parts = []
              for frame in c.decode(audio=0):
                  for f in as_list(rs.resample(frame)):
                      parts.append(f.to_ndarray().reshape(-1))
              for f in as_list(rs.resample(None)):
                  parts.append(f.to_ndarray().reshape(-1))
              c.close()
              return np.concatenate(parts).astype(np.float32) if parts else np.zeros(0, np.float32)

          def atempo(x, speed):
              try:
                  p = subprocess.run(
                      ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "f32le", "-ar", str(rate), "-ac", "1",
                       "-i", "pipe:0", "-af", f"atempo={speed:.4f}", "-f", "f32le", "pipe:1"],
                      input=x.astype("<f4").tobytes(), stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True)
                  out = np.frombuffer(p.stdout, dtype="<f4").copy()
                  return out if out.size else x
              except Exception:
                  return x

          total = int((duration + 10) * rate)
          buf = np.zeros(total, dtype=np.float32)

          vtt = webvtt.read("work/vietnamese.vtt")
          starts = [int((to_ms(c.start) + DELAY_MS) * rate / 1000) for c in vtt]
          gap = int(GAP_MS * rate / 1000)
          max_drift = int(MAX_DRIFT_MS * rate / 1000)
          cursor = 0
          placed = skipped = sped = overlapped = 0
          max_shift = 0
          for i, c in enumerate(vtt):
              path = f"chunks/c_{i}.mp3"
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  skipped += 1
                  continue
              try:
                  x = decode_mono(path)
              except Exception as e:
                  print(f"Decode lỗi đoạn {i}: {e}")
                  skipped += 1
                  continue
              loud = np.nonzero(np.abs(x) > SIL_THRESH)[0]
              if loud.size == 0:
                  skipped += 1
                  continue
              x = x[loud[0]:loud[-1] + 1]            # cắt lặng đầu VÀ cuối

              # Chuẩn hóa độ to từng đoạn (không dùng gain cố định nữa)
              ref = float(np.percentile(np.abs(x), 99.5))
              if ref > 1e-4:
                  x = x * (TTS_PEAK / ref)

              # Đặt tuần tự: đoạn sau không đè lên đoạn trước, tối đa lùi MAX_DRIFT
              nxt = starts[i + 1] if i + 1 < len(vtt) else total
              pos = max(starts[i], cursor + gap)
              pos = min(pos, starts[i] + max_drift)
              avail = nxt - pos
              if avail > 0 and len(x) > avail:
                  sp = min(MAX_SPEEDUP, len(x) / avail)
                  if sp > 1.03:
                      x = atempo(x, sp)
                      sped += 1
              if pos < cursor:
                  overlapped += 1
              if pos >= total:
                  continue
              n = min(len(x), total - pos)
              buf[pos:pos + n] += x[:n]
              cursor = pos + n
              max_shift = max(max_shift, pos - starts[i])
              placed += 1
              if (i + 1) % 500 == 0:
                  print(f"Mixed {i + 1}/{len(vtt)}", flush=True)
          print(f"TTS placed={placed} skipped={skipped} sped_up={sped} overlapped={overlapped} "
                f"max_shift={max_shift / rate:.2f}s")

          # Ghi 1 file wav duy nhất (mono int16), có soft limiter phòng khi vẫn còn đoạn chồng nhau
          BLOCK = 1 << 22
          with wave.open("work/tts_track.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(rate)
              for s in range(0, total, BLOCK):
                  x = buf[s:s + BLOCK].copy()
                  a = np.abs(x)
                  m = a > 0.9
                  if m.any():
                      x[m] = np.sign(x[m]) * (0.9 + 0.1 * np.tanh((a[m] - 0.9) / 0.1))
                  wf.writeframes((np.clip(x, -1.0, 1.0) * 32767).astype("<i2").tobytes())

          # Filter mix cuối: input 0 = video gốc, input 1 = tts_track.wav
          with open("final_mix.txt", "w") as f:
              f.write(f"[0:a]aresample={rate}:async=1,asetpts=PTS-STARTPTS,volume={BG_VOLUME}[bg];")
              f.write(f"[1:a]aresample={rate},asetpts=PTS-STARTPTS[tts];")
              f.write("[bg][tts]amix=inputs=2:normalize=0:duration=first[out_audio]")
          EOF
          ls -lh work/tts_track.wav

      - name: Render Vietnamese video and HLS with detected subtitle blur
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, math, re, subprocess
          from pathlib import Path
          import cv2
          import numpy as np
          import pysubs2

          geo = json.loads(Path("work/subtitle_geometry.json").read_text(encoding="utf-8"))
          if not geo.get("valid") or not geo.get("blur"):
              raise SystemExit("Subtitle geometry was not validated; refusing to render.")
          width, height = int(geo["video_width"]), int(geo["video_height"])
          blur = geo["blur"]
          sub_h = int(geo["subtitle_height"])
          center_x, center_y = width // 2, int(geo["subtitle_center_y"])
          blur_w, blur_h = int(blur["width"]), int(blur["height"])
          blur_x, blur_y = int(blur["x"]), int(blur["y"])
          sigma = max(24, int(round(sub_h * .80)))
          feather_x = max(8, int(round(blur_h * .27)))
          feather_y = max(3, int(round(blur_h * .09)))

          vi = pysubs2.load("work/vietnamese.srt", encoding="utf-8")
          max_chars = max((len(re.sub(r"\s+", "", ev.text)) for ev in vi.events), default=20)
          font_size = max(18, int(sub_h * .90))
          font_size = min(font_size, max(18, int(width * .75 / max(1, max_chars * .60))))
          ass = [
              "[Script Info]", "Title: Vietnamese hard subtitles",
              "ScriptType: v4.00+", f"PlayResX: {width}", f"PlayResY: {height}",
              "WrapStyle: 2", "ScaledBorderAndShadow: yes", "",
              "[V4+ Styles]",
              "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding",
              f"Style: Default,Noto Sans,{font_size},&H00FFFFFF,&H000000FF,&H00000000,&H64000000,0,0,0,0,100,100,0,0,1,2,1,5,40,40,0,1",
              "", "[Events]", "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
          ]
          def ass_time(ms):
              total = max(0, int(ms))
              h, total = divmod(total, 3600000)
              m, total = divmod(total, 60000)
              sec, total = divmod(total, 1000)
              return f"{h}:{m:02}:{sec:02}.{total // 10:02}"
          for ev in vi.events:
              text = ev.text.replace("\\N", "\\N").replace("\n", "\\N")
              text = text.replace("{", "\\{").replace("}", "\\}")
              ass.append(
                  f"Dialogue: 0,{ass_time(ev.start)},{ass_time(ev.end)},Default,,0,0,0,,"
                  f"{{\\an5\\pos({center_x},{center_y})}}{text}"
              )
          Path("work/vietnamese-overlay.ass").write_text("\n".join(ass) + "\n", encoding="utf-8")

          # Mặt nạ alpha feather 4 cạnh: dựng MỘT LẦN bằng numpy thành ảnh PNG xám tĩnh,
          # thay cho geq (tính lại từng pixel của từng frame).
          fx, fy = float(max(1, feather_x)), float(max(1, feather_y))
          xs = np.arange(blur_w, dtype=np.float32)[None, :]
          ys = np.arange(blur_h, dtype=np.float32)[:, None]
          alpha = np.minimum(np.minimum(xs / fx, (blur_w - 1 - xs) / fx),
                             np.minimum(ys / fy, (blur_h - 1 - ys) / fy))
          alpha = np.clip(alpha, 0.0, 1.0)
          cv2.imwrite("work/blur_mask.png", (alpha * 255).astype(np.uint8))

          # Input: 0 = raw_video.mp4, 1 = work/tts_track.wav, 2 = work/blur_mask.png (lặp)
          video_graph = (
              f"[0:v]split=2[vbase][vpatchsrc];"
              f"[vpatchsrc]crop={blur_w}:{blur_h}:{blur_x}:{blur_y},"
              f"gblur=sigma={sigma},format=rgb24[vblur];"
              f"[2:v]format=gray[vmask];"
              f"[vblur][vmask]alphamerge[vpatch];"
              f"[vbase][vpatch]overlay=x={blur_x}:y={blur_y}:shortest=1,"
              f"subtitles=work/vietnamese-overlay.ass[v]"
          )
          audio_graph = Path("final_mix.txt").read_text(encoding="utf-8").strip()
          Path("work/render-filter.txt").write_text(audio_graph + ";" + video_graph + "\n", encoding="utf-8")
          print(f"Subtitle text bbox: center_y={center_y}, height={sub_h}px")
          print(f"Blur: x={blur_x}, y={blur_y}, w={blur_w}, h={blur_h}, sigma={sigma}; fixed for full video.")
          print(f"Vietnamese overlay: centered at ({center_x},{center_y}), font={font_size}px.")
          PY

          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 raw_video.mp4)

          ffmpeg -y -i raw_video.mp4 -i work/tts_track.wav \
            -loop 1 -framerate 30 -t "$DUR" -i work/blur_mask.png \
            -filter_complex_script work/render-filter.txt \
            -map "[v]" -map "[out_audio]" \
            -force_key_frames "expr:gte(t,n_forced*5)" -sc_threshold 0 \
            -c:v libx264 -preset "${X264_PRESET}" -crf "${X264_CRF}" -pix_fmt yuv420p \
            -c:a aac -ar ${{ env.audio_rate }} -b:a 128k final.mp4

          mkdir -p output
          ffmpeg -y -i final.mp4 -c copy -f hls \
            -hls_time 5 -hls_list_size 0 -start_number 10001 -hls_playlist_type vod \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "${{ inputs.slug }}-index.png" \
            -hls_segment_filename "output/${{ inputs.slug }}-index%d.png" \
            "output/${{ inputs.slug }}.m3u8"

      - name: Copy subtitle file into output folder
        run: |
          set -eux
          cp work/vietnamese.vtt "output/${{ inputs.slug }}.vtt"
          ls -lh output/

      - name: Prepare Cloudflare Pages directory
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          cat > output/index.html <<EOF
          <!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>Video ${SLUG} — Vietsub</title>
          <style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}video{width:100%;background:#000}a{color:#8cf}</style>
          <h1>${SLUG} — Vietsub + thuyết minh</h1>
          <video id="v" controls playsinline></video>
          <p><a href="${SLUG}.m3u8">Tải playlist HLS</a> · <a href="${SLUG}.vtt">Tải phụ đề VTT</a></p>
          <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
          <script>const v=document.getElementById('v'),u='${SLUG}.m3u8';if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=u;else if(Hls.isSupported()){const h=new Hls();h.loadSource(u);h.attachMedia(v)}</script>
          </html>
          EOF
          ls -lh output/

      - name: Deploy video output to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account }}
          CF_PAGES_PROJECT: ${{ inputs.page }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Enter the Cloudflare API Token in the workflow form."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Enter the Cloudflare Account ID in the workflow form."
            exit 1
          fi
          if [ -z "${CF_PAGES_PROJECT:-}" ]; then
            echo "::error::Enter the Cloudflare Pages project name in the workflow form."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy output \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch "${{ inputs.slug }}"
          echo "Cloudflare Pages deployment completed for ${CF_PAGES_PROJECT}."

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f work/cookies.txt
          echo "Cookie removed."
